<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#14232b" />
<meta name="color-scheme" content="dark" />
<title>問道長生 · 修仙界</title>
<meta name="description" content="一款修仙風格的遊戲介面：修煉、突破境界、施展功法，踏上長生大道。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  /* 墨青 · 宣紙 · 翡翠 · 鎏金 · 硃砂 */
  :root {
    --background: oklch(0.17 0.025 220);
    --foreground: oklch(0.93 0.02 95);
    --card: oklch(0.21 0.028 215);
    --primary: oklch(0.76 0.11 165);
    --secondary: oklch(0.25 0.028 215);
    --muted-fg: oklch(0.72 0.02 200);
    --accent: oklch(0.83 0.12 85);
    --destructive: oklch(0.62 0.19 30);
    --border: oklch(0.76 0.11 165 / 20%);
    --radius: 6px;
    --sans: 'Noto Sans TC', sans-serif;
    --serif: 'Noto Serif TC', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--background); color: var(--foreground); font-family: var(--sans); -webkit-font-smoothing: antialiased; width: 100%; height: 100%; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul, ol { list-style: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .serif { font-family: var(--serif); }
  .muted { color: var(--muted-fg); }
  .xs { font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }

  /* 畫面切換控制 */
  .screen { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* 首頁封面樣式 */
  #start-screen {
    background-image: url('bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 10;
  }
  .clickable-area {
    position: absolute;
    background: transparent;
    border: none;
    cursor: pointer;
    outline: none;
  }
  .clickable-area:hover {
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    border-radius: 8px;
  }
  /* 圖片上的按鈕精確位置（可依你的圖片位置微調百分比） */
  #btn-start { bottom: 1%; left: 22.8%; width: 17%; height: 12%; }
  #btn-settings-home { bottom: 1%; right: 22.8%; width: 17%; height: 12%; }

  .app { position: relative; min-height: 100dvh; overflow: hidden; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .veil { position: absolute; inset: 0; background: color-mix(in oklch, var(--background) 55%, transparent); }
  .shell { position: relative; max-width: 1280px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 16px; padding: 12px; }
  .grid { flex: 1; min-height: 0; display: grid; gap: 16px; }
  @media (min-width: 768px) { .shell { padding: 16px; } }
  @media (min-width: 1024px) {
    .shell { height: 100dvh; }
    .grid { grid-template-columns: 200px 1fr 300px; }
  }

  .panel {
    background: color-mix(in oklch, var(--card) 80%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow:
      inset 0 0 0 3px color-mix(in oklch, var(--background) 70%, transparent),
      inset 0 0 0 4px color-mix(in oklch, var(--accent) 22%, transparent);
  }
  .panel-title { font-family: var(--serif); font-size: 14px; font-weight: 700; letter-spacing: .4em; color: var(--accent); margin-bottom: 14px; }

  /* Top bar */
  .top { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  @media (min-width: 768px) { .top { flex-direction: row; align-items: center; justify-content: space-between; gap: 24px; } }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; border: 2px solid color-mix(in oklch, var(--accent) 60%, transparent); flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name-row { display: flex; align-items: baseline; gap: 8px; }
  .name-row h1 { font-family: var(--serif); font-size: 20px; font-weight: 700; letter-spacing: .1em; }
  .realm-line { font-family: var(--serif); font-size: 14px; color: var(--accent); }
  .stats { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  @media (min-width: 768px) { .stats { max-width: 448px; } }
  .stat { display: flex; align-items: center; gap: 8px; }
  .stat-label { width: 32px; flex-shrink: 0; font-family: var(--serif); font-size: 12px; color: var(--muted-fg); }
  .track { position: relative; flex: 1; height: 10px; overflow: hidden; border-radius: 999px; background: color-mix(in oklch, var(--background) 70%, transparent); box-shadow: 0 0 0 1px var(--border); }
  .fill { height: 100%; border-radius: 999px; transition: width .5s; }
  .stat-val { width: 64px; flex-shrink: 0; text-align: right; font-size: 12px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .wallet { display: flex; align-items: center; gap: 12px; }
  .wallet dl { display: flex; gap: 16px; font-size: 14px; }
  .wallet dl > div { display: flex; align-items: center; gap: 6px; }
  .wallet dt { display: flex; align-items: center; gap: 4px; color: var(--muted-fg); }
  .wallet dd { font-weight: 500; font-variant-numeric: tabular-nums; }
  .icon { width: 16px; height: 16px; flex-shrink: 0; }
  .icon-btn { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); color: var(--muted-fg); transition: color .2s, border-color .2s; }
  .icon-btn:hover { color: var(--accent); border-color: color-mix(in oklch, var(--accent) 60%, transparent); }

  /* Side nav */
  .nav { padding: 8px; }
  .nav ul { display: flex; gap: 4px; overflow-x: auto; }
  @media (min-width: 1024px) { .nav ul { flex-direction: column; } }
  .nav li { flex-shrink: 0; }
  .nav button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius); font-family: var(--serif); font-size: 14px; letter-spacing: .3em; color: var(--muted-fg); transition: background .2s, color .2s; }
  .nav button:hover { background: var(--secondary); color: var(--foreground); }
  .nav button[aria-current="page"] { background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); box-shadow: 0 0 0 1px color-mix(in oklch, var(--primary) 40%, transparent); }

  /* Core */
  main { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 16px 0; }
  .core { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .orb { position: relative; width: 288px; height: 288px; display: flex; align-items: center; justify-content: center; }
  @media (min-width: 640px) { .orb { width: 320px; height: 320px; } }
  .orb svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .glow { position: absolute; inset: 24px; border-radius: 50%; background: color-mix(in oklch, var(--primary) 20%, transparent); filter: blur(40px); animation: breathe 4s ease-in-out infinite; }
  .ready .glow { background: color-mix(in oklch, var(--accent) 30%, transparent); }
  .orbit { animation: orbit 24s linear infinite; }
  .secluded .orbit { animation-duration: 6s; }
  .ring-progress { transform: rotate(-90deg); }
  .ring-progress circle:last-child { transition: stroke-dashoffset .7s ease-out, stroke .3s; }
  .core-text { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .core-label { font-size: 12px; letter-spacing: .4em; color: var(--muted-fg); }
  .core-realm { font-family: var(--serif); font-size: 60px; line-height: 1.1; font-weight: 900; letter-spacing: .1em; }
  .ready .core-realm { color: var(--accent); }
  .core-layer { font-family: var(--serif); font-size: 18px; letter-spacing: .3em; color: var(--primary); }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .btn { min-width: 112px; padding: 10px 20px; border-radius: var(--radius); font-family: var(--serif); letter-spacing: .3em; transition: background .2s, opacity .2s, color .2s; }
  .btn:disabled { opacity: .4; }
  .btn-primary { border: 1px solid color-mix(in oklch, var(--primary) 50%, transparent); background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); }
  .btn-primary:not(:disabled):hover { background: color-mix(in oklch, var(--primary) 25%, transparent); }
  .btn-gold { background: var(--accent); color: var(--background); font-weight: 700; }
  .btn-gold:disabled { opacity: .3; }
  .btn-gold:not(:disabled):hover { opacity: .9; }
  .btn-gold small { margin-left: 8px; font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0; }
  .btn-ghost { border: 1px solid var(--border); color: var(--muted-fg); }
  .btn-ghost:hover { color: var(--foreground); }
  .btn-ghost[aria-pressed="true"] { border-color: color-mix(in oklch, var(--accent) 60%, transparent); color: var(--accent); }

  /* Right column */
  .right { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .info { padding: 16px; overflow-y: auto; }
  .attr { display: flex; flex-direction: column; gap: 4px; }
  .attr + .attr { margin-top: 12px; }
  .attr-head { display: flex; align-items: baseline; justify-content: space-between; }
  .attr-head dt { font-family: var(--serif); font-size: 14px; }
  .attr-head dd { font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .mini-track { height: 4px; border-radius: 999px; overflow: hidden; background: color-mix(in oklch, var(--background) 70%, transparent); }
  .mini-track div { height: 100%; background: color-mix(in oklch, var(--primary) 70%, transparent); }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--background) 40%, transparent); padding: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .col { display: flex; flex-direction: column; }
  .bold { font-family: var(--serif); font-size: 14px; font-weight: 700; }
  .seal { width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid var(--destructive); color: var(--destructive); font-family: var(--serif); }
  .tech { display: flex; align-items: flex-start; gap: 12px; }
  .small-btn { padding: 6px 12px; border-radius: var(--radius); border: 1px solid color-mix(in oklch, var(--primary) 50%, transparent); color: var(--primary); font-family: var(--serif); font-size: 12px; letter-spacing: .1em; white-space: nowrap; }
  .small-btn:not(:disabled):hover { background: color-mix(in oklch, var(--primary) 15%, transparent); }
  .small-btn:disabled { opacity: .4; }
  .sect-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* 背包 / 物品 */
  .cluster { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .item-list { display: flex; flex-direction: column; gap: 10px; }
  .item-card { display: flex; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--background) 40%, transparent); padding: 10px; }
  .item-icon { width: 40px; height: 40px; flex-shrink: 0; border-radius: var(--radius); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; background: color-mix(in oklch, var(--background) 60%, transparent); }

  /* 秘境 / 狩獵地點 */
  .location-card { cursor: pointer; transition: border-color .2s, background .2s; }
  .location-card:not(.locked):hover { border-color: color-mix(in oklch, var(--primary) 50%, transparent); background: color-mix(in oklch, var(--primary) 8%, transparent); }
  .location-card.locked { opacity: .55; cursor: not-allowed; }
  .monster-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid var(--border); background: color-mix(in oklch, var(--background) 60%, transparent); flex-shrink: 0; }

  /* 戰鬥 */
  .battle-row { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 8px 0; }
  .combatant { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .battle-log { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; max-height: 120px; overflow-y: auto; padding-right: 4px; }
  .battle-log li { border-left: 1px solid var(--border); padding-left: 8px; line-height: 1.5; }

  /* 交易所 / 拍賣場輸入框 */
  .exchange-input { flex: 1; background: color-mix(in oklch, var(--background) 60%, transparent); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--foreground); font: inherit; min-width: 0; }
  .exchange-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select.exchange-input { cursor: pointer; }

  /* 宗門選擇卡片 */
  .sect-card { cursor: pointer; transition: border-color .2s, background .2s; }
  .sect-card:hover { border-color: color-mix(in oklch, var(--primary) 50%, transparent); }
  .sect-card.selected { border-color: color-mix(in oklch, var(--accent) 60%, transparent); background: color-mix(in oklch, var(--accent) 8%, transparent); }

  .log-wrap { display: flex; flex-direction: column; height: 256px; min-height: 0; }
  @media (min-width: 1024px) { .log-wrap { height: auto; flex: 1; } }
  .log { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 16px; }
  .log ol { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; font-size: 14px; line-height: 1.65; }
  .log li { border-left: 1px solid var(--border); padding-left: 12px; animation: log-in .3s ease-out; }
  .tone-normal { color: color-mix(in oklch, var(--foreground) 80%, transparent); }
  .tone-success { color: var(--primary); }
  .tone-danger { color: var(--destructive); }
  .tone-gold { color: var(--accent); }

  /* Skill bar */
  .skills { padding: 12px; }
  .skills ul { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 640px) { .skills ul { grid-template-columns: repeat(4, 1fr); } }
  .skill { position: relative; width: 100%; display: flex; align-items: center; gap: 12px; overflow: hidden; padding: 8px; text-align: left; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--background) 40%, transparent); transition: border-color .2s; }
  .skill:not(:disabled):hover { border-color: color-mix(in oklch, var(--primary) 50%, transparent); }
  .skill .seal { width: 40px; height: 40px; border-width: 2px; font-size: 18px; font-weight: 900; }
  .skill:disabled .seal { opacity: .4; }
  .skill:disabled .skill-text { opacity: .5; }
  .skill-text { display: flex; flex-direction: column; min-width: 0; }
  .skill-text .bold { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  kbd { font-family: var(--sans); }
  .cd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: color-mix(in oklch, var(--background) 70%, transparent); font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

  @keyframes breathe { 0%, 100% { opacity: .45; transform: scale(.97); } 50% { opacity: .9; transform: scale(1.02); } }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes log-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .glow, .orbit, .log li { animation: none !important; } }
</style>
</head>
<body>

<!-- 1. 遊戲首頁畫面（封面） -->
<div id="start-screen" class="screen">
  <button id="btn-start" class="clickable-area" onclick="showLogin()" aria-label="開始遊戲"></button>
  <button id="btn-settings-home" class="clickable-area" onclick="alert('開啟設定選單')" aria-label="設定"></button>
</div>

<!-- 1.5 登入畫面（連線模式） -->
<div id="login-screen" class="screen hidden" style="z-index:20;display:flex;align-items:center;justify-content:center;background:color-mix(in oklch, var(--background) 82%, transparent);backdrop-filter:blur(6px)">
  <form id="loginForm" class="panel" style="width:min(360px,92vw);padding:24px" autocomplete="on">
    <h2 class="panel-title" style="text-align:center;font-size:18px">踏入修仙界</h2>
    <div class="stack">
      <input id="loginName" class="exchange-input" type="text" maxlength="12" placeholder="道號（2–12 字）" autocomplete="username" required />
      <input id="loginPw" class="exchange-input" type="password" minlength="4" placeholder="密碼（至少 4 字元）" autocomplete="current-password" required />
      <p class="xs muted">道號不存在時會自動建立新角色。</p>
      <p class="xs" id="loginErr" style="color:var(--destructive);min-height:1.2em" role="alert"></p>
      <button type="submit" class="btn btn-gold" id="loginBtn" style="width:100%">連線登入</button>
      <button type="button" class="btn btn-ghost" id="offlineBtn" style="width:100%">單機模式</button>
      <button type="button" class="small-btn" id="loginBack" style="align-self:center">返回</button>
    </div>
  </form>
</div>

<!-- 2. 遊戲主畫面（預設隱藏 .hidden） -->
<div id="game-screen" class="screen hidden">
  <div class="app">
    <img class="bg" src="./img/scene-peaks.png" alt="" />
    <div class="veil" aria-hidden="true"></div>

    <div class="shell">
      <header class="panel top">
        <div class="who">
          <div class="avatar"><img src="./img/cultivator.png" alt="角色頭像：雲逸" /></div>
          <div class="col">
            <div class="name-row">
              <h1 id="playerName">雲逸</h1>
              <span class="xs muted" id="sectBadge">青雲宗 · 內門弟子</span>
              <span class="xs" id="netBadge" style="color:var(--muted-fg)">單機</span>
            </div>
            <p class="realm-line" id="realmLine"></p>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-label">氣血</span>
            <div class="track" role="progressbar" aria-label="氣血" aria-valuemin="0" id="hpBar">
              <div class="fill" style="background: var(--destructive)"></div>
            </div>
            <span class="stat-val" id="hpVal"></span>
          </div>
          <div class="stat">
            <span class="stat-label">靈力</span>
            <div class="track" role="progressbar" aria-label="靈力" aria-valuemin="0" id="mpBar">
              <div class="fill" style="background: var(--primary)"></div>
            </div>
            <span class="stat-val" id="mpVal"></span>
          </div>
        </div>

        <div class="wallet">
          <dl>
            <div>
              <dt><svg class="icon" style="color: var(--primary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/></svg>靈石</dt>
              <dd id="stones"></dd>
            </div>
            <div>
              <dt><svg class="icon" style="color: var(--accent)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/></svg>仙玉</dt>
              <dd id="jade"></dd>
            </div>
          </dl>
          <button type="button" class="icon-btn" id="btnSave" aria-label="儲存進度" title="儲存進度">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7H7v7"/><path d="M7 3v4h8"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btnLoad" aria-label="讀取進度" title="讀取進度">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          </button>
          <button type="button" class="icon-btn" aria-label="設定">

  const isOnline = () => !!net.token
  const pname = () => net.name || '雲逸'
  const serverNow = () => Date.now() + net.offset
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const offlineNotice = () => '<p class="xs muted" style="line-height:1.8">此功能需要連線登入後使用。你目前是單機模式，重新整理頁面並選擇「連線登入」即可加入修仙界。</p>'

  async function api(path, payload) {
    try {
      const r = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ token: net.token }, payload)) })
      const j = await r.json().catch(() => ({}))
      if (!r.ok) return { ok: false, error: j.error || '請求失敗' }
      return j
    } catch (e) { return { ok: false, error: '無法連線到伺服器' } }
  }
  const snapshot = () => ({ realm: state.realm, layer: state.layer, xp: state.xp, hp: state.hp, mp: state.mp, stones: state.stones, jade: state.jade, inventory: state.inventory, sect: state.sect, contribution: state.contribution })
  const pushSave = () => api('save', { save: snapshot() })

  function setNet(up) {
    net.up = up
    const b = $('netBadge'); if (!b) return
    b.textContent = isOnline() ? (up ? `在線 · ${net.online.length} 人` : '重新連線中…') : '單機'
    b.style.color = isOnline() ? (up ? 'var(--primary)' : 'var(--destructive)') : 'var(--muted-fg)'
  }

  function applyMail(list) {
    const ids = []
    for (const m of list || []) {
      if (net.seenMail.has(m.id)) continue
      net.seenMail.add(m.id); ids.push(m.id)
      if (m.kind === 'stones') state.stones = Math.max(0, state.stones + m.amount)
      else if (m.kind === 'item') addItem(m.item, m.qty || 1)
      else if (m.kind === 'xp') state.xp = Math.min(required(), state.xp + m.amount)
      addLog(m.text || '收到一封傳書。', m.kind === 'stones' && m.amount < 0 ? 'danger' : 'gold')
    }
    if (ids.length) { api('mail/ack', { ids }); render(); if (['bag', 'market', 'auction'].includes(state.nav)) renderInfo() }
  }

  function connectStream() {
    const es = new EventSource('/api/stream?token=' + net.token)
    net.es = es
    const on = (ev, fn) => es.addEventListener(ev, (e) => { try { fn(JSON.parse(e.data)) } catch (err) {} })
    on('hello', (d) => { net.offset = d.serverTime - Date.now(); net.online = d.online; net.auctions = d.auctions; net.boss = d.boss; net.chat = d.chat; setNet(true); refreshNet('all') })
    on('presence', (d) => { net.online = d; setNet(true); refreshNet('presence') })
    on('chat', (m) => { net.chat.push(m); if (net.chat.length > 80) net.chat.shift(); refreshNet('chat') })
    on('auctions', (d) => { net.auctions = d; refreshNet('auctions') })
    on('boss', (d) => { net.boss = d; refreshNet('boss') })
    on('mail', (d) => applyMail(d.mail))
    es.onerror = () => {
      setNet(false)
      if (es.readyState === EventSource.CLOSED) addLog('與伺服器的連線已中斷，請重新整理頁面並重新登入。', 'danger')
    }
  }

  function refreshNet(kind) {
    if (kind === 'chat') { if (state.nav === 'world') updateChat(); return }
    if (kind === 'presence') { if (state.nav === 'world') updateOnline(); return }
    if (kind === 'auctions') { if (state.nav === 'auction') renderInfo(); return }
    if (kind === 'boss') { if (state.nav === 'boss') renderInfo(); return }
    renderInfo()
  }

  function updateChat() {
    const el = $('chatLog'); if (!el) return
    el.innerHTML = net.chat.map((m) => {
      const t = new Date(m.t).toTimeString().slice(0, 5)
      if (m.sys) return `<li style="color:var(--accent)">${t} 【天道】${esc(m.text)}</li>`
      if (m.to) return `<li style="color:var(--primary)">${t} [密語] ${esc(m.from)} → ${esc(m.to)}：${esc(m.text)}</li>`
      return `<li>${t} <span class="bold" style="font-size:12px">${esc(m.from)}</span>：${esc(m.text)}</li>`
    }).join('')
    el.scrollTop = el.scrollHeight
  }
  function updateOnline() {
    const el = $('onlineList'); if (!el) return
    $('onlineCount').textContent = `（${net.online.length}）`
    el.innerHTML = net.online.map((p) => {
      const me = p.name.toLowerCase() === (net.name || '').toLowerCase()
      const sect = (SECTS.find((s) => s.id === p.sect) || {}).name || ''
      return `<li class="row xs"><span><span class="bold" style="font-size:13px">${esc(p.name)}</span> <span class="muted">${REALMS[p.realm] || ''}期第${NUM[p.layer - 1] || ''}層 ${sect}</span></span>${me ? '<span class="muted">你</span>' : `<span style="display:flex;gap:6px"><button type="button" class="small-btn" data-whisper="${esc(p.name)}">密語</button><button type="button" class="small-btn" data-pvp="${esc(p.name)}">切磋</button></span>`}</li>`
    }).join('')
  }
  function renderWorld() {
    if (!isOnline()) return offlineNotice()
    return `
      <div class="card" style="margin-bottom:12px">
        <h3 class="xs muted" style="letter-spacing:.2em;margin-bottom:8px">線上修士<span id="onlineCount"></span></h3>
        <ul class="stack" id="onlineList" style="gap:8px;max-height:150px;overflow-y:auto"></ul>
      </div>
      <ol class="battle-log xs" id="chatLog" style="max-height:230px;margin-top:0" aria-live="polite"></ol>
      <form id="chatForm" class="row" style="gap:8px;margin-top:10px">
        <input id="chatInput" class="exchange-input" maxlength="100" placeholder="世界頻道發言，或 /w 道號 內容" autocomplete="off" aria-label="聊天訊息" />
        <button type="submit" class="small-btn">發送</button>
      </form>`
  }
  async function sendChat(raw) {
    let text = raw.trim(), to
    if (!text) return
    const m = text.match(/^\/w\s+(\S+)\s+([\s\S]+)/)
    if (m) { to = m[1]; text = m[2] }
    const r = await api('chat', { text, to })
    if (!r.ok) addLog(r.error, 'danger')
  }

  function renderBoss() {
    if (!isOnline()) return offlineNotice()
    const b = net.boss
    if (!b) return '<p class="xs muted">正在感應魔蛟氣息…</p>'
    const pct = Math.max(0, Math.min(100, (b.hp / b.maxHp) * 100))
    const top = (b.top || []).map((t, i) => `<li class="row xs"><span>${i + 1}. ${esc(t.name)}</span><span class="num muted">${t.dmg.toLocaleString()}</span></li>`).join('') || '<li class="xs muted">尚無人出手</li>'
    return `
      <div class="card" style="margin-bottom:14px;text-align:center">
        <div class="monster-icon" style="width:72px;height:72px;font-size:38px;margin:0 auto 8px">🐉</div>
        <div class="bold">${esc(b.name)}</div>
        <div class="track" style="margin:10px 0 4px"><div class="fill" style="background:var(--destructive);width:${pct}%"></div></div>
        <span class="xs muted num">${b.hp.toLocaleString()} / ${b.maxHp.toLocaleString()}</span>
        ${b.alive ? '' : `<p class="xs" style="color:var(--accent);margin-top:8px">已被擊殺 · <span data-respawn="${b.respawnAt}"></span> 後再現</p>`}
        <div class="actions" style="margin-top:12px"><button type="button" class="btn btn-gold" data-boss-attack ${b.alive ? '' : 'disabled'}>出手<small>10 靈力</small></button></div>
      </div>
      <h3 class="panel-title" style="font-size:12px;margin-bottom:8px">傷害榜</h3>
      <ul class="stack" style="gap:8px">${top}</ul>
      <p class="xs muted" style="margin-top:12px;line-height:1.7">擊殺獎勵：全體參與者依傷害占比獲得靈石與修為；最後一擊得雷晶，傷害第一得破損玉簡。</p>`
  }
  async function attackBoss() {
    if (state.mp < 10) { addLog('靈力不足，無法出手。', 'danger'); render(); return }
    const r = await api('boss/attack')
    if (!r.ok) { addLog(r.error, 'danger'); return }
    state.mp -= 10
    addLog(`你向「${net.boss ? net.boss.name : '魔蛟'}」發出一擊，造成 ${r.dmg} 點傷害。`, 'success')
    render()
  }
  async function challengePlayer(name) {
    const r = await api('pvp', { target: name })
    if (!r.ok) { addLog(r.error, 'danger'); return }
    addLog(r.win ? `你與「${name}」切磋，獲勝！` : `你與「${name}」切磋，惜敗。`, r.win ? 'success' : 'danger')
  }

  function renderNetAuction() {
    const me = (net.name || '').toLowerCase()
    const cards = net.auctions.map((a) => {
      const def = ITEMS[a.item]; if (!def) return ''
      const mineSell = a.seller.toLowerCase() === me, lead = a.bidder && a.bidder.toLowerCase() === me
      
      // 計算四種百分比的新出價金額 (10%, 30%, 50%, 100%)
      const basePrice = a.bidder ? a.current : a.start;
      const bid10 = basePrice + Math.ceil(basePrice * 0.1);
      const bid30 = basePrice + Math.ceil(basePrice * 0.3);
      const bid50 = basePrice + Math.ceil(basePrice * 0.5);
      const bid100 = basePrice + Math.ceil(basePrice * 1.0);
      return `
        <li class="card">
          <div class="row" style="align-items:flex-start">
            <div class="cluster"><div class="item-icon">${def.icon}</div>
              <div class="col"><span class="bold">${def.name} <span class="xs muted">× ${a.qty}</span></span>
              <span class="xs muted">賣家：${esc(a.seller)}${mineSell ? '（你）' : ''} · ${a.bidder ? `最高：${lead ? '你' : esc(a.bidder)}` : '尚無人出價'}</span></div></div>
            <span class="xs muted num" style="white-space:nowrap">剩餘 <span data-ends="${a.endsAt}"></span>s</span>
          </div>
          <div class="row" style="margin-top:8px">
            <span class="xs muted">目前 <span class="bold num" style="color:var(--accent)">${a.current}</span> 靈石</span>
          </div>
          <div class="actions" style="justify-content:flex-start; margin-top:8px; gap:4px; flex-wrap:wrap;">
            <button type="button" class="small-btn" data-net-bid-rate="${a.id}" data-rate="0.1" ${mineSell || lead ? 'disabled' : ''}>+10% (${bid10})</button>
            <button type="button" class="small-btn" data-net-bid-rate="${a.id}" data-rate="0.3" ${mineSell || lead ? 'disabled' : ''}>+30% (${bid30})</button>
            <button type="button" class="small-btn" data-net-bid-rate="${a.id}" data-rate="0.5" ${mineSell || lead ? 'disabled' : ''}>+50% (${bid50})</button>
            <button type="button" class="small-btn" data-net-bid-rate="${a.id}" data-rate="1.0" ${mineSell || lead ? 'disabled' : ''}>+100% (${bid100})</button>
          </div>
        </li>`
    }).join('') || '<li class="xs muted">目前沒有拍賣品，成為第一個上架的人吧。</li>'
    const eligible = Object.entries(state.inventory).filter(([id, q]) => q > 0 && !SHOP_ITEMS.includes(id) && ITEMS[id])
    const options = eligible.length ? eligible.map(([id, q]) => `<option value="${id}">${ITEMS[id].icon} ${ITEMS[id].name}（持有 ${q}）</option>`).join('') : '<option value="">（目前沒有可上架的物品）</option>'
    return `
      <h3 class="panel-title" style="font-size:12px;margin-bottom:8px">全服拍賣</h3>
      <ul class="stack" style="margin-bottom:18px">${cards}</ul>
      <div class="card">
        <h3 class="xs muted" style="letter-spacing:.2em;margin-bottom:10px">上架我的物品（每次 1 件，最多同時 5 件）</h3>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <select id="listItemSelect" class="exchange-input" style="flex:2;min-width:140px">${options}</select>
          <input id="listPrice" class="exchange-input" type="number" min="1" placeholder="起標靈石" style="flex:1;min-width:90px" />
          <button type="button" class="small-btn" data-net-list>上架</button>
        </div>
      </div>`
  }
  async function netBidWithRate(id, rate) {
    const a = net.auctions.find((x) => x.id === id); if (!a) return
    const basePrice = a.bidder ? a.current : a.start;
    const target = basePrice + Math.ceil(basePrice * Number(rate));

    if (state.stones < target) { addLog('靈石不足，無法出價。', 'danger'); render(); return }
    
    // 向後端發送出價請求，並帶上計算好的金額或百分比
    const r = await api('auction/bid', { id, amount: target })
    if (!r.ok) { addLog(r.error, 'danger'); return }
    
    state.stones = Math.max(0, state.stones - r.amount)
    addLog(`你出價 ${r.amount} 靈石（加價 ${Number(rate) * 100}%）。`, 'gold')
    render(); pushSave()
  }
  async function netList() {
    const itemId = $('listItemSelect') && $('listItemSelect').value
    const price = Math.max(0, Math.floor(Number($('listPrice') && $('listPrice').value) || 0))
    if (!itemId || (state.inventory[itemId] || 0) <= 0) { addLog('沒有可上架的物品。', 'danger'); return }
    if (SHOP_ITEMS.includes(itemId)) { addLog('交易所販售的道具無法上架拍賣場。', 'danger'); return }
    if (price <= 0) { addLog('請輸入有效的起標價格。', 'danger'); return }
    state.inventory[itemId] -= 1
    if (state.inventory[itemId] <= 0) delete state.inventory[itemId]
    const r = await api('auction/list', { item: itemId, price })
    if (!r.ok) { addItem(itemId, 1); addLog(r.error, 'danger') } else { addLog(`將「${ITEMS[itemId].name}」送上全服拍賣，起標 ${price} 靈石。`, 'gold'); pushSave() }
    render(); renderInfo()
  }
  function tickTimers() {
    document.querySelectorAll('[data-ends]').forEach((el) => { el.textContent = Math.max(0, Math.ceil((Number(el.dataset.ends) - serverNow()) / 1000)) })
    document.querySelectorAll('[data-respawn]').forEach((el) => { el.textContent = Math.max(0, Math.ceil((Number(el.dataset.respawn) - serverNow()) / 1000)) + 's' })
  }

  /* =========================================================
   * 存檔／讀檔：使用瀏覽器 localStorage
   * 想調整要保存哪些欄位，改 saveGame() 裡 data 物件的內容即可
   * ========================================================= */
  const SAVE_KEY = 'xiuxian-save-v1'
  function saveGame(silent) {
    if (isOnline()) { pushSave(); if (!silent) addLog('已同步進度到伺服器。', 'gold'); return }
    const data = {
      realm: state.realm, layer: state.layer, xp: state.xp, hp: state.hp, mp: state.mp,
      stones: state.stones, jade: state.jade,
      inventory: state.inventory, sect: state.sect, contribution: state.contribution,
    }
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(data))
      if (!silent) addLog('已儲存目前進度。', 'gold')
    } catch (e) {
      if (!silent) addLog('儲存失敗，瀏覽器可能不支援本機儲存。', 'danger')
    }
  }
  function loadGame(silent) {
    if (isOnline()) { if (!silent) { addLog('連線模式下進度由伺服器自動保存，無需手動讀取。'); render() } return false }
    let raw
    try {
      raw = localStorage.getItem(SAVE_KEY)
    } catch (e) {
      raw = null
    }
    if (!raw) {
      if (!silent) { addLog('尚未找到任何存檔。', 'danger'); render() }
      return false
    }
    try {
      const data = JSON.parse(raw)
      Object.assign(state, data)
      state.selectedLocation = null
      state.battle = null
      if (!silent) addLog('已讀取存檔進度。', 'gold')
      renderNav(); renderInfo(); render()
      return true
    } catch (e) {
      if (!silent) { addLog('讀取存檔失敗，存檔資料可能已損毀。', 'danger'); render() }
      return false
    }
  }

  // 開始畫面 → 登入畫面
  function showLogin() {
    $('start-screen').classList.add('hidden')
    $('login-screen').classList.remove('hidden')
    $('loginName').focus()
  }
  $('loginBack').addEventListener('click', () => { $('login-screen').classList.add('hidden'); $('start-screen').classList.remove('hidden') })
  $('offlineBtn').addEventListener('click', () => { $('login-screen').classList.add('hidden'); enterGame() })
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault()
    const err = $('loginErr'), btn = $('loginBtn')
    err.textContent = ''
    if (location.protocol === 'file:') { err.textContent = '連線模式需先執行 node server.js，並開啟 http://localhost:3000'; return }
    btn.disabled = true; btn.textContent = '連線中…'
    const r = await api('login', { name: $('loginName').value, password: $('loginPw').value })
    btn.disabled = false; btn.textContent = '連線登入'
    if (r.error || !r.token) { err.textContent = r.error || '登入失敗'; return }
    net.token = r.token; net.name = r.name
    if (r.save) Object.assign(state, r.save)
    state.selectedLocation = null; state.battle = null
    $('login-screen').classList.add('hidden')
    enterOnline(r)
  })
  function enterOnline(r) {
    $('game-screen').classList.remove('hidden')
    addLog(r.created ? `道友「${net.name}」初入修仙界，願你早登大道。` : `歡迎回來，${net.name}。`, 'gold')
    renderNav(); renderInfo(); render(); setNet(false)
    connectStream()
    applyMail(r.mail)
  }

  // 單機模式進入遊戲
  function enterGame() {
    $('start-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    $('game-screen').classList.remove('hidden');
    const loaded = loadGame(true)
    if (loaded) {
      addLog('靈氣流轉，你繼續先前的修行進度。', 'gold')
    } else {
      addLog('你於青雲峰洞府中盤膝而坐，靈氣緩緩流轉。');
      addLog('師尊玄真子傳音：「修行之道，貴在持之以恆。」', 'gold');
    }
    renderNav();
    renderInfo();
    render();
  }

  function addLog(text, tone = 'normal') {
    const li = document.createElement('li')
    li.className = 'tone-' + tone
    li.textContent = text
    const log = $('log')
    log.prepend(li)
    while (log.children.length > 40) log.lastChild.remove()
  }

  function setBar(id, valId, value, max) {
    const bar = $(id)
    bar.firstElementChild.style.width = Math.max(0, Math.min(100, (value / max) * 100)) + '%'
    bar.setAttribute('aria-valuemax', max)
    bar.setAttribute('aria-valuenow', Math.round(value))
    $(valId).textContent = `${Math.round(value)}/${max}`
  }

  function renderNav() {
    $('nav').innerHTML = NAV.map((n) => `
      <li><button type="button" data-nav="${n.id}" ${n.id === state.nav ? 'aria-current="page"' : ''}>${n.icon}${n.label}</button></li>`).join('')
  }

  function renderInfo() {
    $('info-title').textContent = NAV.find((n) => n.id === state.nav).label
    // 重繪前記住輸入框內容與焦點，避免被每次更新清掉
    const keep = {}
    for (const id of ['listPrice', 'listItemSelect', 'exchangeAmount', 'chatInput']) { const el = $(id); if (el) keep[id] = el.value }
    const focusId = document.activeElement && document.activeElement.id
    let html = ''
    switch (state.nav) {
      case 'character':
        html = '<dl>' + ATTRIBUTES.map((a) => `
          <div class="attr">
            <div class="attr-head"><dt>${a.label}</dt><dd>${a.value}</dd></div>
            <div class="mini-track" aria-hidden="true"><div style="width:${a.value}%"></div></div>
            <p class="xs muted">${a.hint}</p>
          </div>`).join('') + '</dl>'
        break
      case 'techniques':
        html = '<ul class="stack">' + SKILLS.map((s) => `
          <li class="tech">
            <span class="seal" aria-hidden="true">${s.element}</span>
            <div class="col"><span class="bold">${s.name}</span><span class="xs muted" style="line-height:1.6">${s.description} · 冷卻 ${s.cooldown} 息</span></div>
          </li>`).join('') + '</ul>'
        break
      case 'bag':
        html = renderBag()
        break
      case 'realm':
        html = renderRealm()
        break
      case 'market':
        html = renderMarket()
        break
      case 'auction':
        html = renderAuction()
        break
      case 'world':
        html = renderWorld()
        break
      case 'boss':
        html = renderBoss()
        break
      case 'sect':
        html = renderSect()
        break
    }
    $('infoBody').innerHTML = html
    for (const [id, v] of Object.entries(keep)) { const el = $(id); if (el) el.value = v }
    if (focusId && $(focusId)) $(focusId).focus()
    if (state.nav === 'world' && isOnline()) { updateChat(); updateOnline() }
    tickTimers()
  }

  function renderBag() {
    const equipped = ARTIFACTS.map((a) => `
      <li class="card">
        <div class="row" style="align-items:baseline"><span class="bold">${a.name}</span><span class="xs" style="color:var(--accent)">${a.grade}</span></div>
        <p class="xs muted" style="margin-top:4px">${a.note}</p>
      </li>`).join('')
    const entries = Object.entries(state.inventory).filter(([, q]) => q > 0)
    const items = entries.length ? entries.map(([id, qty]) => {
      const def = ITEMS[id]
      return `
        <li class="item-card">
          <div class="item-icon">${def.icon}</div>
          <div class="col" style="flex:1;min-width:0">
            <div class="row" style="align-items:baseline">
              <span class="bold">${def.name}</span>
              <span class="xs num muted">× ${qty}</span>
            </div>
            <span class="xs" style="color:${rarityColor(def.rarity)}">${def.rarity}</span>
            <p class="xs muted" style="margin-top:2px">${def.desc}</p>
            <div class="actions" style="justify-content:flex-start;margin-top:6px;gap:8px">
              ${def.effect ? `<button type="button" class="small-btn" data-use-item="${id}">使用</button>` : ''}
              <button type="button" class="small-btn" data-sell-item="${id}">出售（${def.sell} 靈石）</button>
            </div>
          </div>
        </li>`

      const target = a.highestBidder ? a.currentBid + a.increment : a.currentBid
      return `
        <li class="card">
          <div class="row" style="align-items:flex-start">
            <div class="cluster">

          <select id="listItemSelect" class="exchange-input" style="flex:2;min-width:140px">${options}</select>

          <button type="button" class="small-btn" data-list-item>上架</button>

  function renderSkills() {
    $('skills').innerHTML = SKILLS.map((s, i) => {
      const cd = state.cooldowns[s.id] || 0
      const disabled = cd > 0 || state.mp < s.cost
      return `
        <li><button type="button" class="skill" data-skill="${i}" ${disabled ? 'disabled' : ''}
            aria-label="${s.name}，消耗 ${s.cost} 靈力${cd > 0 ? `，冷卻 ${cd} 秒` : ''}">
          <span class="seal" aria-hidden="true">${s.element}</span>
          <span class="skill-text"><span class="bold">${s.name}</span><span class="xs muted">${s.cost} 靈力 · <kbd>${i + 1}</kbd></span></span>
          ${cd > 0 ? `<span class="cd" aria-hidden="true">${cd}</span>` : ''}
        </button></li>`
    }).join('')
  }

  function render() {
    const req = required()
    const ready = state.xp >= req
    const progress = Math.min(1, state.xp / req)

    const currentSect = SECTS.find((s) => s.id === state.sect) || SECTS[0]
    $('sectBadge').textContent = `${currentSect.name} · 內門弟子`
    $('playerName').textContent = pname()
    $('realmLine').textContent = `${REALMS[state.realm]}期 · 第${NUM[state.layer - 1]}層`
    setBar('hpBar', 'hpVal', state.hp, MAX_HP)
    setBar('mpBar', 'mpVal', state.mp, MAX_MP)
    $('stones').textContent = state.stones.toLocaleString()
    $('jade').textContent = state.jade.toLocaleString()

    const core = $('core')
    core.classList.toggle('ready', ready)
    core.classList.toggle('secluded', state.secluded)
    const ring = $('ring')
    ring.setAttribute('stroke-dasharray', CIRC)
    ring.setAttribute('stroke-dashoffset', CIRC * (1 - progress))
    ring.setAttribute('stroke', ready ? 'var(--accent)' : 'var(--primary)')
    $('coreRealm').textContent = REALMS[state.realm]
    $('coreLayer').textContent = `第${NUM[state.layer - 1]}層`
    $('coreXp').textContent = `修為 ${Math.floor(state.xp)} / ${req}`
    $('chance').textContent = Math.round(chance() * 100) + '%'

    $('btnCultivate').disabled = state.mp < CULTIVATE_COST || ready
    $('btnBreak').disabled = !ready
    const sec = $('btnSeclude')
    sec.textContent = state.secluded ? '出關' : '閉關'
    sec.setAttribute('aria-pressed', state.secluded)
    $('coreHint').textContent = state.secluded ? '閉關中 · 每息自動吸納天地靈氣' : '運功消耗 5 點靈力，修為圓滿方可突破'

    renderSkills()
    // 拍賣場／戰鬥中的畫面需要每秒即時更新，其餘分頁（背包、交易所…）的刷新由各自的操作函式自行呼叫 renderInfo()
    if ((state.nav === 'auction' && !isOnline()) || (state.nav === 'realm' && state.battle)) renderInfo()
  }

  function cultivate() {
    const req = required()
    if (state.mp < CULTIVATE_COST || state.xp >= req) return
    const gain = Math.round(req * (0.06 + Math.random() * 0.06))
    state.mp -= CULTIVATE_COST
    state.xp = Math.min(req, state.xp + gain)
    if (Math.random() < 0.35) addLog(`運轉周天，吸納天地靈氣，修為增加 ${gain}。`)
    render()
  }

  function breakthrough() {
    if (state.xp < required()) return
    if (Math.random() < chance()) {
      state.xp = 0
      if (state.layer < MAX_LAYER) {
        addLog(`突破成功！晉入${REALMS[state.realm]}期第${NUM[state.layer]}層。`, 'success')
        state.layer++
      } else if (state.realm < REALMS.length - 1) {
        state.realm++
        state.layer = 1
        addLog(`天降異象，霞光萬道！你成功踏入${REALMS[state.realm]}期！`, 'gold')
      } else {
        addLog('你已臻大乘圓滿，只待飛升之日。', 'gold')
      }
    } else {
      state.xp = Math.floor(state.xp * 0.6)
      state.hp = Math.max(1, state.hp - 40)
      addLog('衝擊瓶頸失敗，靈氣逆衝經脈，氣血受損。', 'danger')
    }
    render()
  }

  function toggleSeclusion() {
    state.secluded = !state.secluded
    addLog(state.secluded ? '你封閉洞府，開始閉關苦修。' : '你推開石門，結束閉關。', state.secluded ? 'normal' : 'gold')
    render()
  }

  function castSkill(skill) {
    if ((state.cooldowns[skill.id] || 0) > 0 || state.mp < skill.cost) return
    state.mp -= skill.cost
    state.cooldowns[skill.id] = skill.cooldown
    addLog(`施展「${skill.name}」—— ${skill.description}。`, 'success')
    render()
  }

  function useItem(id) {
    const qty = state.inventory[id] || 0
    const def = ITEMS[id]
    if (qty <= 0 || !def || !def.effect) return
    state.inventory[id] = qty - 1
    if (state.inventory[id] <= 0) delete state.inventory[id]
    if (def.effect.type === 'restoreMp') {
      state.mp = Math.min(MAX_MP, state.mp + def.effect.value)
      addLog(`服下「${def.name}」，${def.desc}。`, 'success')
    } else if (def.effect.type === 'addXpPercent') {
      const req = required()
      state.xp = Math.min(req, state.xp + req * def.effect.value)
      addLog(`服下「${def.name}」，${def.desc}。`, 'gold')
    }
    render()
    if (state.nav === 'bag' || state.nav === 'market') renderInfo()
  }

  function sellItem(id) {
    const qty = state.inventory[id] || 0
    const def = ITEMS[id]
    if (qty <= 0 || !def) return
    state.inventory[id] = qty - 1
    if (state.inventory[id] <= 0) delete state.inventory[id]
    state.stones += def.sell
    addLog(`售出「${def.name}」，獲得 ${def.sell} 靈石。`)
    render()
    if (state.nav === 'bag' || state.nav === 'market' || state.nav === 'auction') renderInfo()
  }

  function buyItem(id) {
    const def = ITEMS[id]
    if (!def || !def.buy) return
    const wallet = def.currency === 'jade' ? 'jade' : 'stones'
    if (state[wallet] < def.buy) {
      addLog(`${wallet === 'jade' ? '仙玉' : '靈石'}不足，無法購買「${def.name}」。`, 'danger')
      render()
      if (state.nav === 'market') renderInfo()
      return
    }
    state[wallet] -= def.buy
    addItem(id, 1)
    addLog(`花費 ${def.buy} ${wallet === 'jade' ? '仙玉' : '靈石'}，購得「${def.name}」。`, 'gold')
    render()
    if (state.nav === 'bag' || state.nav === 'market') renderInfo()
  }

  function exchangeCurrency(amount) {
    const rate = 500
    const jadeGain = Math.floor(amount / rate)
    if (jadeGain <= 0) {
      addLog('靈石數量不足以兌換仙玉。', 'danger')
      render()
      if (state.nav === 'market') renderInfo()
      return
    }
    const cost = jadeGain * rate
    if (state.stones < cost) {
      addLog('靈石不足，無法完成兌換。', 'danger')
      render()
      if (state.nav === 'market') renderInfo()
      return
    }
    state.stones -= cost
    state.jade += jadeGain
    addLog(`以 ${cost} 靈石兌換 ${jadeGain} 仙玉。`, 'gold')
    render()
    if (state.nav === 'market') renderInfo()
  }

  function enterLocation(id) {
    state.selectedLocation = id
    state.battle = null
    renderInfo()
  }
  function backToLocations() {
    state.selectedLocation = null
    state.battle = null
    renderInfo()
  }
  function playerAtkRange() {
    const base = 8 + state.realm * 10 + state.layer * 2
    const v = Math.round(base * 0.3)
    return [Math.max(1, base - v), base + v]
  }
  function startBattle(monster) {
    state.battle = { monster, monsterHp: monster.hp, log: [`你與「${monster.name}」遭遇了！`] }
    renderInfo()
  }
  function battleLog(text) {
    state.battle.log.unshift(text)
    if (state.battle.log.length > 6) state.battle.log.pop()
  }
  function attackMonster() {
    if (!state.battle) return
    const [lo, hi] = playerAtkRange()
    const dmg = randomInt(lo, hi)
    state.battle.monsterHp = Math.max(0, state.battle.monsterHp - dmg)
    battleLog(`你攻擊「${state.battle.monster.name}」，造成 ${dmg} 點傷害。`)
    if (state.battle.monsterHp <= 0) return victory()
    const mitigation = state.realm * 2
    const mdmg = Math.max(1, randomInt(state.battle.monster.atkMin, state.battle.monster.atkMax) - mitigation)
    state.hp = Math.max(0, state.hp - mdmg)
    battleLog(`「${state.battle.monster.name}」反擊，你受到 ${mdmg} 點傷害。`)
    if (state.hp <= 0) return defeat()
    render()
    renderInfo()
  }
  function victory() {
    const m = state.battle.monster
    const req = required()
    state.xp = Math.min(req, state.xp + m.exp)
    const loot = rollLoot(m)
    loot.forEach((l) => addItem(l.item, l.qty))
    const lootText = loot.length ? `，拾取 ${loot.map((l) => `${ITEMS[l.item].name} × ${l.qty}`).join('、')}` : ''
    addLog(`擊敗「${m.name}」，獲得 ${m.exp} 點修為${lootText}。`, 'success')
    state.battle = null
    render()
    renderInfo()
  }
  function defeat() {
    addLog(`不敵「${state.battle.monster.name}」，你身受重傷，狼狽撤退。`, 'danger')
    state.hp = Math.max(1, Math.round(MAX_HP * 0.2))
    state.battle = null
    render()
    renderInfo()
  }
  function fleeBattle() {
    addLog(`你從「${state.battle.monster.name}」身邊脫身而逃。`)
    state.battle = null
    render()
    renderInfo()
  }

  function npcBidAuction(a) {
    if (a.highestBidder === 'player') state.stones += a.currentBid
    const bidder = BIDDERS[randomInt(0, BIDDERS.length - 1)]
    a.currentBid += a.increment
    a.highestBidder = bidder
  }
  function playerBid(id) {
    const a = state.auctions.find((x) => x.id === id)
    if (!a || a.timeLeft <= 0 || a.highestBidder === 'player') return
    const target = a.highestBidder ? a.currentBid + a.increment : a.currentBid
    if (state.stones < target) {
      addLog('靈石不足，無法出價。', 'danger')
      render()
      return
    }
    state.stones -= target
    a.currentBid = target
    a.highestBidder = 'player'
    addLog(`你於拍賣場出價 ${target} 靈石，競得「${ITEMS[a.item].name}」目前最高價。`, 'gold')
    render()
  }
  function resolveAuction(a) {
    if (a.highestBidder === 'player') {
      addItem(a.item, a.qty)
      addLog(`拍賣結束！你以 ${a.currentBid} 靈石標得「${ITEMS[a.item].name}」× ${a.qty}。`, 'gold')
    } else if (a.highestBidder) {
      addLog(`拍賣結束，「${ITEMS[a.item].name}」被${a.highestBidder}以 ${a.currentBid} 靈石標走。`)
    } else {
      addLog(`「${ITEMS[a.item].name}」流拍，無人出價。`)
    }
  }

  // 玩家上架物品到拍賣場：交易所有在賣的道具（SHOP_ITEMS）不能上架
  function listPlayerItem() {
    const select = $('listItemSelect')
    const priceInput = $('listPrice')
    const itemId = select && select.value
    const price = Math.max(0, Math.floor(Number(priceInput && priceInput.value) || 0))
    if (!itemId) { addLog('沒有可上架的物品。', 'danger'); render(); if (state.nav === 'auction') renderInfo(); return }
    if (SHOP_ITEMS.includes(itemId)) { addLog('交易所販售的道具無法上架拍賣場。', 'danger'); render(); if (state.nav === 'auction') renderInfo(); return }
    if ((state.inventory[itemId] || 0) <= 0) { addLog('物品數量不足，無法上架。', 'danger'); render(); if (state.nav === 'auction') renderInfo(); return }
    if (price <= 0) { addLog('請輸入有效的起標價格。', 'danger'); render(); if (state.nav === 'auction') renderInfo(); return }
    state.inventory[itemId] -= 1
    if (state.inventory[itemId] <= 0) delete state.inventory[itemId]
    state.playerListings.push({
      id: 'p' + Date.now() + Math.random().toString(16).slice(2, 6),
      item: itemId, qty: 1, startPrice: price, currentBid: price,
      highestBidder: null, timeLeft: randomInt(60, 120),
    })
    addLog(`將「${ITEMS[itemId].name}」送上拍賣場，起標 ${price} 靈石。`, 'gold')
    render()
    renderInfo()
  }

  function selectSect(id) {
    if (state.sect === id) return
    const s = SECTS.find((x) => x.id === id)
    if (!s) return
    state.sect = id
    addLog(`你拜入「${s.name}」，正式成為門下弟子。`, 'gold')
    render()
    renderInfo()
  }

  function tick() {
    // 只有在遊戲畫面顯示時才自動運轉
    if ($('game-screen').classList.contains('hidden')) return;

    state.mp = Math.min(MAX_MP, state.mp + (state.secluded ? 1 : 2))
    state.hp = Math.min(MAX_HP, state.hp + 1)
    for (const k of Object.keys(state.cooldowns)) {
      if (state.cooldowns[k] > 1) state.cooldowns[k]--
      else delete state.cooldowns[k]
    }
    if (state.secluded) {
      const req = required()
      if (state.xp >= req) {
        state.secluded = false
        addLog('修為已至圓滿，你緩緩出關，準備衝擊瓶頸。', 'gold')
      } else {
        state.xp = Math.min(req, state.xp + req * 0.03)
        state.stones = Math.max(0, state.stones - 2)
      }
    }

    // NPC 拍賣攤位倒數與搶標（連線模式改用全服拍賣，此處略過）
    if (!isOnline()) state.auctions.forEach((a) => {
      if (a.timeLeft <= 0) return
      a.timeLeft--
      if (a.highestBidder !== 'player' && Math.random() < 0.14) npcBidAuction(a)
      else if (a.highestBidder === 'player' && Math.random() < 0.1) npcBidAuction(a)
      if (a.timeLeft <= 0) {
        resolveAuction(a)
        Object.assign(a, createAuctionListing(a.id))
      }
    })

    // 玩家自己上架的拍賣物品：倒數、NPC 隨機搶標、結標後結算
    if (!isOnline()) state.playerListings = state.playerListings.filter((l) => {
      if (l.timeLeft > 0) {
        l.timeLeft--
        if (Math.random() < 0.12) {
          const bidder = BIDDERS[randomInt(0, BIDDERS.length - 1)]
          const inc = Math.max(3, Math.round(l.currentBid * 0.1))
          l.currentBid += inc
          l.highestBidder = bidder
        }
      }
      if (l.timeLeft > 0) return true
      if (l.highestBidder) {
        state.stones += l.currentBid
        addLog(`你上架的「${ITEMS[l.item].name}」被${l.highestBidder}以 ${l.currentBid} 靈石標走，所得已入帳。`, 'gold')
      } else {
        addItem(l.item, l.qty)
        addLog(`你上架的「${ITEMS[l.item].name}」流拍，已退回背包。`)
      }
      return false
    })

    if (isOnline()) {
      if (++net.tickN % 5 === 0) pushSave() // 連線模式：每 5 秒同步到伺服器
      tickTimers()
    } else saveGame(true) // 單機模式：每秒自動存檔（靜默）
    render()
  }

  $('btnCultivate').addEventListener('click', cultivate)
  $('btnBreak').addEventListener('click', breakthrough)
  $('btnSeclude').addEventListener('click', toggleSeclusion)
  $('btnSave').addEventListener('click', () => saveGame(false))
  $('btnLoad').addEventListener('click', () => loadGame(false))
  $('nav').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-nav]')
  if (!btn) return

  // 如果點到的是「背包」，就開啟彈跳視窗並結束，不切換右側面板
  if (btn.dataset.nav === 'bag') {
    openBagModal()
    return
  }

  state.nav = btn.dataset.nav
  renderNav()
  renderInfo()
})

// 綁定彈窗右上角的「關閉」按鈕
$('closeBagBtn').addEventListener('click', () => {
  $('bag-modal').classList.add('hidden')
})

// （選用）點擊彈窗外圍的半透明黑底時，也能自動關閉視窗
$('bag-modal').addEventListener('click', (e) => {
  if (e.target === $('bag-modal')) {
    $('bag-modal').classList.add('hidden')
  }
})
  $('infoBody').addEventListener('click', (e) => {
    const useBtn = e.target.closest('[data-use-item]')
    if (useBtn) return useItem(useBtn.dataset.useItem)
    const sellBtn = e.target.closest('[data-sell-item]')
    if (sellBtn) return sellItem(sellBtn.dataset.sellItem)
    const buyBtn = e.target.closest('[data-buy-item]')
    if (buyBtn) return buyItem(buyBtn.dataset.buyItem)
    const exchangeBtn = e.target.closest('[data-exchange]')
    if (exchangeBtn) {
      const input = $('exchangeAmount')
      const amt = Math.max(0, Math.floor(Number(input && input.value) || 0))
      return exchangeCurrency(amt)
    }
    const listBtn = e.target.closest('[data-list-item]')
    if (listBtn) return listPlayerItem()
    const locBtn = e.target.closest('[data-location]')
    if (locBtn) return enterLocation(locBtn.dataset.location)
    const backBtn = e.target.closest('[data-back-location]')
    if (backBtn) return backToLocations()
    const challengeBtn = e.target.closest('[data-monster]')
    if (challengeBtn) {
      const loc = LOCATIONS.find((l) => l.id === state.selectedLocation)
      const mon = loc && loc.monsters.find((m) => m.id === challengeBtn.dataset.monster)
      if (mon) startBattle(mon)
      return
    }
    const atkBtn = e.target.closest('[data-attack]')
    if (atkBtn) return attackMonster()
    const fleeBtn = e.target.closest('[data-flee]')
    if (fleeBtn) return fleeBattle()
    const bidBtn = e.target.closest('[data-bid]')
    if (bidBtn) return playerBid(bidBtn.dataset.bid)
    const sectEl = e.target.closest('[data-sect]')
    if (sectEl) return selectSect(sectEl.dataset.sect)
    const nb = e.target.closest('[data-net-bid]')
    if (nb) return netBid(nb.dataset.netBid)
    if (e.target.closest('[data-net-list]')) return netList()
    const pv = e.target.closest('[data-pvp]')
    if (pv) return challengePlayer(pv.dataset.pvp)
    const wh = e.target.closest('[data-whisper]')
    if (wh) { const i = $('chatInput'); if (i) { i.value = `/w ${wh.dataset.whisper} `; i.focus() } return }
    if (e.target.closest('[data-boss-attack]')) return attackBoss()
  })
  $('infoBody').addEventListener('submit', (e) => {
    if (e.target.id !== 'chatForm') return
    e.preventDefault()
    const i = $('chatInput'); const v = i.value; i.value = ''
    sendChat(v)
  })
  $('skills').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-skill]')
    if (btn) castSkill(SKILLS[Number(btn.dataset.skill)])
  })
  window.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, [contenteditable="true"]')) return
    const i = Number(e.key) - 1
    if (i >= 0 && i < SKILLS.length) castSkill(SKILLS[i])
  })
  window.addEventListener('beforeunload', () => {
    if (isOnline()) navigator.sendBeacon('/api/save', new Blob([JSON.stringify({ token: net.token, save: snapshot() })], { type: 'application/json' }))
    else saveGame(true)
  })

  setInterval(tick, 1000)
</script>
</body>
</html>
