<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#14232b" />
<meta name="color-scheme" content="dark" />
<title>問道長生 · 修仙界</title>
<!-- 加上這三行手機 PWA 全螢幕設定 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />

<meta name="description" content="一款修仙風格的遊戲介面：修煉、突破境界、施展功法，踏上長生大道。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  /* 墨青 · 宣紙 · 翡翠 · 鎏金 · 硃砂 */
  :root {
    --background: oklch(0.17 0.025 220);
    --foreground: oklch(0.93 0.02 95);
    --card: oklch(0.21 0.028 215);
    --primary: oklch(0.76 0.11 165);
    --secondary: oklch(0.25 0.028 215);
    --muted-fg: oklch(0.72 0.02 200);
    --accent: oklch(0.83 0.12 85);
    --destructive: oklch(0.62 0.19 30);
    --border: oklch(0.76 0.11 165 / 20%);
    --radius: 6px;
    --sans: 'Noto Sans TC', sans-serif;
    --serif: 'Noto Serif TC', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--background); color: var(--foreground); font-family: var(--sans); -webkit-font-smoothing: antialiased; width: 100%; height: 100%; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul, ol { list-style: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .serif { font-family: var(--serif); }
  .muted { color: var(--muted-fg); }
  .xs { font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }

  /* 畫面切換控制 */
  .screen { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* 首頁封面樣式 */
  /* 封面：外層用模糊放大的 bg.jpg 填滿，內層 .start-stage 依原圖比例（1358×768）完整顯示，
     按鈕以 .start-stage 為基準定位，任何螢幕比例都會對準圖上畫的按鈕 */
  #start-screen {
    background: #0b131a;
    z-index: 10;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #start-screen::before {
    content: ''; position: absolute; inset: -40px;
    background: url('bg.jpg') center / cover no-repeat;
    filter: blur(18px) brightness(.55);
  }
  .start-stage {
    position: relative;
    width: min(100vw, calc(100dvh * 1358 / 768));
    aspect-ratio: 1358 / 768;
    background: url('bg.jpg') center / 100% 100% no-repeat;
  }
  .clickable-area {
    position: absolute;
    background: transparent;
    border: none;
    cursor: pointer;
    outline: none;
  }
  .clickable-area:hover {
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    border-radius: 8px;
  }
  /* 圖片上的按鈕精確位置（可依你的圖片位置微調百分比） */
  /* 位置為 bg.jpg 上「開始遊戲」「設定」按鈕的實際範圍（佔圖片寬高的百分比） */
  #btn-start { top: 82%; left: 22.8%; width: 17%; height: 9.7%; }
  #btn-settings-home { top: 82%; left: 60.5%; width: 17.2%; height: 9.7%; }

  /* 缺少 bg.jpg 時的備用封面（JS 偵測圖片載入失敗後加上 .no-art） */
  .start-fallback { display: none; }
  #start-screen.no-art { background: radial-gradient(ellipse at 50% 30%, oklch(0.3 0.06 180) 0%, var(--background) 70%); }
  #start-screen.no-art::before { display: none; }
  #start-screen.no-art .start-stage {
    background: none; aspect-ratio: auto; width: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;
  }
  #start-screen.no-art .start-fallback { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  #start-screen.no-art .clickable-area { position: static; width: auto; height: auto; }
  #start-screen.no-art .start-actions { display: flex; gap: 16px; }
  .start-title { font-family: var(--serif); font-size: clamp(40px, 10vw, 72px); font-weight: 900; letter-spacing: .3em; color: var(--accent); text-shadow: 0 0 30px color-mix(in oklch, var(--accent) 40%, transparent); }
  .start-sub { font-family: var(--serif); letter-spacing: .5em; color: var(--muted-fg); }
  /* 遊戲畫面缺圖時：背景改漸層、頭像改文字 */
  .app.no-bg { background: radial-gradient(ellipse at 50% 20%, oklch(0.26 0.05 190) 0%, var(--background) 75%); }
  .avatar-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 24px; font-weight: 900; color: var(--accent); background: var(--secondary); }

  .app { position: relative; min-height: 100dvh; overflow: hidden; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .veil { position: absolute; inset: 0; background: color-mix(in oklch, var(--background) 55%, transparent); }
  .shell { position: relative; max-width: 1280px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 16px; padding: 12px; }
  .grid { flex: 1; min-height: 0; display: grid; gap: 16px; }
  @media (min-width: 768px) { .shell { padding: 16px; } }
  @media (min-width: 1024px) {
    .shell { height: 100dvh; }
    .grid { grid-template-columns: 200px 1fr 300px; }
  }

  .panel {
    background: color-mix(in oklch, var(--card) 80%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow:
      inset 0 0 0 3px color-mix(in oklch, var(--background) 70%, transparent),
      inset 0 0 0 4px color-mix(in oklch, var(--accent) 22%, transparent);
  }
  .panel-title { font-family: var(--serif); font-size: 14px; font-weight: 700; letter-spacing: .4em; color: var(--accent); margin-bottom: 14px; }

  /* Top bar */
  .top { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  @media (min-width: 768px) { .top { flex-direction: row; align-items: center; justify-content: space-between; gap: 24px; } }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; border: 2px solid color-mix(in oklch, var(--accent) 60%, transparent); flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name-row { display: flex; align-items: baseline; gap: 8px; }
  .name-row h1 { font-family: var(--serif); font-size: 20px; font-weight: 700; letter-spacing: .1em; }
  .realm-line { font-family: var(--serif); font-size: 14px; color: var(--accent); }
  .stats { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  @media (min-width: 768px) { .stats { max-width: 448px; } }
  .stat { display: flex; align-items: center; gap: 8px; }
  .stat-label { width: 32px; flex-shrink: 0; font-family: var(--serif); font-size: 12px; color: var(--muted-fg); }
  .track { position: relative; flex: 1; height: 10px; overflow: hidden; border-radius: 999px; background: color-mix(in oklch, var(--background) 70%, transparent); box-shadow: 0 0 0 1px var(--border); }
  .fill { height: 100%; border-radius: 999px; transition: width .5s; }
  .stat-val { width: 64px; flex-shrink: 0; text-align: right; font-size: 12px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .wallet { display: flex; align-items: center; gap: 12px; }
  .wallet dl { display: flex; gap: 16px; font-size: 14px; }
  .wallet dl > div { display: flex; align-items: center; gap: 6px; }
  .wallet dt { display: flex; align-items: center; gap: 4px; color: var(--muted-fg); }
  .wallet dd { font-weight: 500; font-variant-numeric: tabular-nums; }
  .icon { width: 16px; height: 16px; flex-shrink: 0; }
  .icon-btn { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); color: var(--muted-fg); transition: color .2s, border-color .2s; }
  .icon-btn:hover { color: var(--accent); border-color: color-mix(in oklch, var(--accent) 60%, transparent); }

  /* Side nav */
  .nav { padding: 8px; }
  .nav ul { display: flex; gap: 4px; overflow-x: auto; }
  @media (min-width: 1024px) { .nav ul { flex-direction: column; } }
  .nav li { flex-shrink: 0; }
  .nav button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius); font-family: var(--serif); font-size: 14px; letter-spacing: .3em; color: var(--muted-fg); transition: background .2s, color .2s; }
  .nav button:hover { background: var(--secondary); color: var(--foreground); }
  .nav button[aria-current="page"] { background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); box-shadow: 0 0 0 1px color-mix(in oklch, var(--primary) 40%, transparent); }

  /* Core */
  main { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 16px 0; }
  .core { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .orb { position: relative; width: 288px; height: 288px; display: flex; align-items: center; justify-content: center; }
  @media (min-width: 640px) { .orb { width: 320px; height: 320px; } }
  .orb svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .glow { position: absolute; inset: 24px; border-radius: 50%; background: color-mix(in oklch, var(--primary) 20%, transparent); filter: blur(40px); animation: breathe 4s ease-in-out infinite; }
  .ready .glow { background: color-mix(in oklch, var(--accent) 30%, transparent); }
  .orbit { animation: orbit 24s linear infinite; }
  .secluded .orbit { animation-duration: 6s; }
  .ring-progress { transform: rotate(-90deg); }
  .ring-progress circle:last-child { transition: stroke-dashoffset .7s ease-out, stroke .3s; }
  .core-text { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .core-label { font-size: 12px; letter-spacing: .4em; color: var(--muted-fg); }
  .core-realm { font-family: var(--serif); font-size: 60px; line-height: 1.1; font-weight: 900; letter-spacing: .1em; }
  .ready .core-realm { color: var(--accent); }
  .core-layer { font-family: var(--serif); font-size: 18px; letter-spacing: .3em; color: var(--primary); }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .btn { min-width: 112px; padding: 10px 20px; border-radius: var(--radius); font-family: var(--serif); letter-spacing: .3em; transition: background .2s, opacity .2s, color .2s; }
  .btn:disabled { opacity: .4; }
  .btn-primary { border: 1px solid color-mix(in oklch, var(--primary) 50%, transparent); background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); }
  .btn-primary:not(:disabled):hover { background: color-mix(in oklch, var(--primary) 25%, transparent); }
  .btn-gold { background: var(--accent); color: var(--background); font-weight: 700; }
  .btn-gold:disabled { opacity: .3; }
  .btn-gold:not(:disabled):hover { opacity: .9; }
  .btn-gold small { margin-left: 8px; font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0; }
  .btn-ghost { border: 1px solid var(--border); color: var(--muted-fg); }
  .btn-ghost:hover { color: var(--foreground); }
  .btn-ghost[aria-pressed="true"] { border-color: color-mix(in oklch, var(--accent) 60%, transparent); color: var(--accent); }

  /* Right column */
  .right { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .info { padding: 16px; overflow-y: auto; }
  .attr { display: flex; flex-direction: column; gap: 4px; }
  .attr + .attr { margin-top: 12px; }
  .attr-head { display: flex; align-items: baseline; justify-content: space-between; }
  .attr-head dt { font-family: var(--serif); font-size: 14px; }
  .attr-head dd { font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .mini-track { height: 4px; border-radius: 999px; overflow: hidden; background: color-mix(in oklch, var(--background) 70%, transparent); }
  .mini-track div { height: 100%; background: color-mix(in oklch, var(--primary) 70%, transparent); }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--background) 40%, transparent); padding: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .col { display: flex; flex-direction: column; }
  .bold { font-family: var(--serif); font-size: 14px; font-weight: 700; }
  .seal { width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid var(--destructive); color: var(--destructive); font-family: var(--serif); }
  .tech { display: flex; align-items: flex-start; gap: 12px; }
  .small-btn { padding: 6px 12px; border-radius: var(--radius); border: 1px solid color-mix(in oklch, var(--primary) 50%, transparent); color: var(--primary); font-family: var(--serif); font-size: 12px; letter-spacing: .1em; white-space: nowrap; }
  .small-btn:not(:disabled):hover { background: color-mix(in oklch, var(--primary) 15%, transparent); }
  .small-btn:disabled { opacity: .4; }
  .sect-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* 背包 / 物品 */
  .cluster { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .item-list { display: flex; flex-direction: column; gap: 10px; }
  .item-card { display: flex; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--background) 40%, transparent); padding: 10px; }
  .item-icon { width: 40px; height: 40px; flex-shrink: 0; border-radius: var(--radius); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; background: color-mix(in oklch, var(--background) 60%, transparent); }

  /* 秘境 / 狩獵地點 */
  .location-card { cursor: pointer; transition: border-color .2s, background .2s; }
  .location-card:not(.locked):hover { border-color: color-mix(in oklch, var(--primary) 50%, transparent); background: color-mix(in oklch, var(--primary) 8%, transparent); }
  .location-card.locked { opacity: .55; cursor: not-allowed; }
  .monster-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid var(--border); background: color-mix(in oklch, var(--background) 60%, transparent); flex-shrink: 0; }

  /* 戰鬥 */
  .battle-row { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 8px 0; }
  .combatant { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .battle-log { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; max-height: 120px; overflow-y: auto; padding-right: 4px; }
  .battle-log li { border-left: 1px solid var(--border); padding-left: 8px; line-height: 1.5; }

  /* 交易所 / 拍賣場輸入框 */
  .exchange-input { flex: 1; background: color-mix(in oklch, var(--background) 60%, transparent); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--foreground); font: inherit; min-width: 0; }
  .exchange-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select.exchange-input { cursor: pointer; }

  /* 宗門選擇卡片 */
  .sect-card { cursor: pointer; transition: border-color .2s, background .2s; }
  .sect-card:hover { border-color: color-mix(in oklch, var(--primary) 50%, transparent); }
  .sect-card.selected { border-color: color-mix(in oklch, var(--accent) 60%, transparent); background: color-mix(in oklch, var(--accent) 8%, transparent); }

  .log-wrap { display: flex; flex-direction: column; height: 256px; min-height: 0; }
  @media (min-width: 1024px) { .log-wrap { height: auto; flex: 1; } }
  .log { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 16px; }
  .log ol { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; font-size: 14px; line-height: 1.65; }
  .log li { border-left: 1px solid var(--border); padding-left: 12px; animation: log-in .3s ease-out; }
  .tone-normal { color: color-mix(in oklch, var(--foreground) 80%, transparent); }
  .tone-success { color: var(--primary); }
  .tone-danger { color: var(--destructive); }
  .tone-gold { color: var(--accent); }

  /* Skill bar */
  .skills { padding: 12px; }
  .skills ul { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 640px) { .skills ul { grid-template-columns: repeat(4, 1fr); } }
  .skill { position: relative; width: 100%; display: flex; align-items: center; gap: 12px; overflow: hidden; padding: 8px; text-align: left; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--background) 40%, transparent); transition: border-color .2s; }
  .skill:not(:disabled):hover { border-color: color-mix(in oklch, var(--primary) 50%, transparent); }
  .skill .seal { width: 40px; height: 40px; border-width: 2px; font-size: 18px; font-weight: 900; }
  .skill:disabled .seal { opacity: .4; }
  .skill:disabled .skill-text { opacity: .5; }
  .skill-text { display: flex; flex-direction: column; min-width: 0; }
  .skill-text .bold { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  kbd { font-family: var(--sans); }
  .cd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: color-mix(in oklch, var(--background) 70%, transparent); font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

  @keyframes breathe { 0%, 100% { opacity: .45; transform: scale(.97); } 50% { opacity: .9; transform: scale(1.02); } }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes log-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .glow, .orbit, .log li { animation: none !important; } }
  /* ========== 手機版專屬響應式優化 (螢幕寬度小於 1023px) ========== */
@media (max-width: 1023px) {
  /* 1. 解除畫面鎖死，允許手機上下滑動瀏覽 */
  html, body {
    height: auto;
    min-height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .screen {
    position: relative;
    min-height: 100dvh;
    height: auto;
  }
  #start-screen {
    position: fixed; /* 封面維持滿版固定 */
    inset: 0;
  }
  .app {
    overflow: visible;
    padding-bottom: 24px;
  }

  /* 2. 縮小修為靈球尺寸，避免佔據整個手機螢幕 */
  .orb {
    width: 210px;
    height: 210px;
  }
  .core-realm {
    font-size: 44px;
  }
  .core {
    gap: 14px;
  }
  main {
    padding: 8px 0;
    gap: 14px;
  }

  /* 3. 優化左側導覽列：在手機上變成好滑動的橫向標籤列 */
  .nav {
    padding: 6px;
  }
  .nav ul {
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch; /* iOS 滑動慣性優化 */
  }
  .nav button {
    padding: 8px 12px;
    font-size: 13px;
    letter-spacing: .15em;
    gap: 6px;
  }

  /* 4. 調整資訊面板與日誌高度，避免需要兩層滾動條 */
  .info {
    max-height: 55vh;
  }
  .log-wrap {
    height: 200px;
  }

  /* 5. 按鈕加大觸控區域，方便手指點擊 */
  .btn {
    padding: 12px 16px;
    min-width: 96px;
  }
  .small-btn {
    padding: 8px 12px;
  }
}
</style>
</head>
<body>

<!-- 1. 遊戲首頁畫面（封面） -->
<div id="start-screen" class="screen">
 <div class="start-stage">
  <div class="start-fallback">
    <h1 class="start-title">問道長生</h1>
    <p class="start-sub">修仙界</p>
  </div>
  <div class="start-actions">
    <button id="btn-start" class="clickable-area" onclick="showLogin()" aria-label="開始遊戲"><span class="start-fallback btn btn-gold">開始遊戲</span></button>
    <button id="btn-settings-home" class="clickable-area" onclick="alert('開啟設定選單')" aria-label="設定"><span class="start-fallback btn btn-ghost">設定</span></button>
  </div>
 </div>
</div>
<script>
  // 封面圖 bg.jpg 載不到時，改用備用封面（文字標題＋可見按鈕）
  (function () {
    const img = new Image()
    img.onerror = () => document.getElementById('start-screen').classList.add('no-art')
    img.src = 'bg.jpg'
  })()
</script>

<!-- 1.5 登入畫面（連線模式） -->

   * 遊戲基礎數值設定
   * 要調整境界層數上限／氣血・靈力上限／運功消耗，改這裡即可。
   * ========================================================= */
  const REALMS = ['煉氣', '築基', '金丹', '元嬰', '化神', '渡劫', '大乘']
  const NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九']
  const MAX_LAYER = 9, CULTIVATE_COST = 5
  /* 氣血／靈力上限：隨境界與層數成長（總層數 lv = 境界 × 9 + 層數 − 1，大乘九層時 lv = 62）
   *   氣血上限 = BASE_HP + lv × HP_PER_LV（煉氣一層 260 → 大乘九層 1500）
   *   靈力上限 = BASE_MP + lv × MP_PER_LV（煉氣一層 120 → 大乘九層 368）
   * 伺服器 server.js 有同一組公式，修改時兩邊要一起改。 */
  const BASE_HP = 260, BASE_MP = 120, HP_PER_LV = 20, MP_PER_LV = 4
  const lvIdx = (realm, layer) => realm * MAX_LAYER + layer - 1
  const hpAt = (realm, layer) => BASE_HP + lvIdx(realm, layer) * HP_PER_LV
  const mpAt = (realm, layer) => BASE_MP + lvIdx(realm, layer) * MP_PER_LV
  const maxHp = () => hpAt(state.realm, state.layer)
  const maxMp = () => mpAt(state.realm, state.layer)
  const hpRatio = () => maxHp() / BASE_HP // 目前氣血上限是起始值的幾倍（丹藥、回復量、減傷都以此放大）
  const mpRatio = () => maxMp() / BASE_MP
  const CIRC = 2 * Math.PI * 120

  /* =========================================================
   * 功法列表（快捷欄）
   * 新增一筆就會多一個功法按鈕。欄位：

      m.atkMin = Math.round(m.atkMin * ka); m.atkMax = Math.round(m.atkMax * ka)
    })
  })

  const MAX_ACTIVE_QUESTS = 3 // 擊殺任務最多同時接取數

   * 玩家初始數值：開新遊戲、或找不到存檔時使用的起始狀態
   * ========================================================= */

    stones: 1000, jade: 1, secluded: false,
    cooldowns: {}, nav: 'character',
    inventory: { qi: 5, foundation: 2, spiritGrass: 3, commonEgg: 1, commonFeed: 5 },

    buffs: {},      // 限時增益 { stat: { value, left } }
    breakBonus: 0,  // 下一次突破額外機率
    sectTab: 'mine',
    selectedLocation: null, battle: null,
    pets: [], activePet: null, // 靈寵列表、出戰靈寵 uid

  const $ = (id) => document.getElementById(id)
  const required = () => Math.round(100 * Math.pow(1.6, state.realm) * (1 + state.layer * 0.25))

   *   XP_SLOW_BASE        1 級（煉氣 1 層）的減速倍數：原速 ÷ 20
   *   XP_SLOW_PER_LEVEL   每升一層，減速倍數增加的比例（等級序號 = 境界 × 9 + 層數 - 1，共 0～62）
   *   例：煉氣 1 層 ÷20、煉氣 9 層 ÷36、築基 1 層 ÷38、大乘 9 層 ÷144 */
  const XP_SLOW_BASE = 5
  const XP_SLOW_PER_LEVEL = 0.1
  const xpSlow = () => XP_SLOW_BASE * (1 + (state.realm * MAX_LAYER + state.layer - 1) * XP_SLOW_PER_LEVEL)
  const xpGain = (n) => Math.round(n / xpSlow() * 100) / 100
  /* ---------- 宗門加成／增益 ---------- */
  const currentSect = () => SECTS.find((s) => s.id === state.sect) || null

  const sectBonus = (type) => { const s = currentSect(); return s ? s.bonuses.filter((b) => b.type === type).reduce((a, b) => a + b.value, 0) : 0 }
  const buffVal = (stat) => (state.buffs[stat] ? state.buffs[stat].value : 0)
  const BUFF_LABELS = { atk: '攻擊', def: '減傷', cultivate: '修煉速度', petAtk: '靈寵攻擊' }
  const sellPrice = (id) => Math.round(ITEMS[id].sell * (1 + sectBonus('sell')))
  const buyPrice = (id) => Math.max(1, Math.round(ITEMS[id].buy * (1 - sectBonus('discount'))))
  const chance = () => {
    const base = state.layer === MAX_LAYER ? 0.55 - state.realm * 0.05 : 0.92 - state.layer * 0.03
    return Math.min(0.99, Math.max(0.2, Math.min(0.95, base)) + sectBonus('breakthrough') + (state.breakBonus || 0))
  }
  const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min
  const rarityColor = (r) => ({ '普通': 'var(--muted-fg)', '精良': 'var(--primary)', '稀有': 'var(--accent)', '史詩': 'var(--destructive)' }[r] || 'var(--muted-fg)')

  function addItem(id, qty = 1) {
    state.inventory[id] = (state.inventory[id] || 0) + qty
  }
  // GM：背包擁有全部物品，各 99999（伺服器存檔上限）；每息補滿，上架拍賣等直接扣數量的動作也不會用完
  function fillGMInventory() {
    for (const id of Object.keys(ITEMS)) state.inventory[id] = 99999
  }
  function consumeItem(id, qty = 1) {
    if (state.isGM) return // GM：物品無限
    state.inventory[id] = (state.inventory[id] || 0) - qty
    if (state.inventory[id] <= 0) delete state.inventory[id]
  }
  function rollTable(table, mul = 1) {
    const loot = []
    for (const entry of table) {
      if (Math.random() < entry.chance * mul) loot.push({ item: entry.item, qty: randomInt(entry.min, entry.max) })
    }
    return loot
  }
  const rollLoot = (monster) => rollTable(monster.loot, 1 + sectBonus('loot'))
  function rollLootbox(rolls) {
    const total = LOOTBOX_POOL.reduce((a, e) => a + e.weight, 0)
    const got = []
    for (let i = 0; i < rolls; i++) {
      let r = Math.random() * total
      const e = LOOTBOX_POOL.find((x) => (r -= x.weight) < 0) || LOOTBOX_POOL[0]
      got.push({ item: e.item, qty: randomInt(e.min, e.max) })
    }
    return got
  }
  const lootText = (loot) => loot.map((l) => `${ITEMS[l.item].name} × ${l.qty}`).join('、')

  /* ---------- 靈寵 ---------- */
  const realmText = (realm, layer) => `${REALMS[realm]}期第${NUM[layer - 1]}層`
  const petTpl = (p) => PET_TEMPLATES.find((t) => t.id === p.tpl) || PET_TEMPLATES[0]
  const petRequired = (p) => Math.round(80 * Math.pow(1.6, p.realm) * (1 + p.layer * 0.25))
  const petMaxed = (p) => p.realm >= p.cap && p.layer >= MAX_LAYER
  const petAtk = (p) => Math.round((4 + p.realm * 7 + p.layer * 1.2) * petTpl(p).atk * (1 + sectBonus('petAtk') + buffVal('petAtk')))
  const petStrike = (p) => { const a = petAtk(p); return randomInt(Math.round(a * 0.8), Math.round(a * 1.2)) }
  const activePet = () => state.pets.find((p) => p.uid === state.activePet) || null

  /* ---------- 靈寵存檔編碼（連線模式用） ----------
   * 伺服器 server.js 存檔只保留固定欄位，inventory 只收「英文字母 key（≤24 字）→ 0~99999 的數字」，
   * 所以連線模式把每隻靈寵編碼成一筆 inventory key 送上去，登入時再解回 state.pets：
   *   key   = 'zqpet' + 境界(a~g) + 層數(a~i) + 出戰(y/n) + uid(6 個小寫字母) + 模板 id
   *   value = 靈寵目前修為
   * 因此 PET_TEMPLATES 的 id 必須是純英文字母、最多 10 字。 */
  const PET_KEY = 'zqpet'
  const newPetUid = () => Array.from({ length: 6 }, () => String.fromCharCode(97 + randomInt(0, 25))).join('')
  const L = (n) => String.fromCharCode(97 + n), N = (c) => c.charCodeAt(0) - 97
  function encodePets(inv) {
    const out = Object.assign({}, inv)
    for (const p of state.pets) {
      if (!/^[a-z]{6}$/.test(p.uid)) { const old = p.uid; p.uid = newPetUid(); if (state.activePet === old) state.activePet = p.uid }
      out[PET_KEY + L(p.realm) + L(p.layer - 1) + (p.uid === state.activePet ? 'y' : 'n') + p.uid + p.tpl] = Math.min(99999, Math.floor(p.xp))
    }
    // 宗門擊殺任務進度也用同樣方式存：key = 'zqqst' + 任務 id，value = 進度
    for (const [qid, prog] of Object.entries(state.quests || {})) out[QUEST_KEY + qid] = Math.min(99999, prog)
    return out
  }
  const QUEST_KEY = 'zqqst'
  function decodePets(inv) {
    const pets = []
    let active = null
    for (const [k, v] of Object.entries(inv || {})) {
      if (!k.startsWith(PET_KEY)) continue
      delete inv[k]
      const body = k.slice(PET_KEY.length)
      const tpl = PET_TEMPLATES.find((t) => t.id === body.slice(9))
      if (!tpl || pets.length >= MAX_PETS) continue
      const cap = PET_GRADES[tpl.grade].cap
      const p = { uid: body.slice(3, 9), tpl: tpl.id, grade: tpl.grade, realm: Math.min(cap, Math.max(0, N(body[0]))), layer: Math.min(MAX_LAYER, Math.max(1, N(body[1]) + 1)), xp: Number(v) || 0, cap }
      pets.push(p)
      if (body[2] === 'y') active = p.uid
    }
    return { pets, active }
  }

  function hatchEgg(grade) {
    const g = PET_GRADES[grade]
    const pool = PET_TEMPLATES.filter((t) => t.grade === grade)
    const tpl = pool[randomInt(0, pool.length - 1)]
    // 初始境界：範圍內越高越稀有，權重依序為 n, n-1, …, 1
    const span = g.maxRealm - g.minRealm + 1
    let r = Math.random() * (span * (span + 1) / 2), realm = g.minRealm
    for (let i = 0; i < span; i++) { r -= span - i; if (r < 0) { realm = g.minRealm + i; break } }
    const pet = { uid: newPetUid(), tpl: tpl.id, grade, realm, layer: randomInt(1, 3), xp: 0, cap: g.cap }
    state.pets.push(pet)
    if (!activePet()) state.activePet = pet.uid
    return pet
  }

  // 增加靈寵修為，滿了自動晉層／晉境，直到資質上限
  function addPetXp(p, amount) {
    if (!p || petMaxed(p)) return
    p.xp += Math.round(amount * (1 + sectBonus('petXp')))
    let ups = 0
    while (!petMaxed(p) && p.xp >= petRequired(p)) {
      p.xp -= petRequired(p)
      if (p.layer < MAX_LAYER) p.layer++
      else { p.realm++; p.layer = 1 }
      ups++
    }
    if (petMaxed(p)) p.xp = 0
    if (ups) addLog(`靈寵「${petTpl(p).name}」修為精進，晉入${realmText(p.realm, p.layer)}${petMaxed(p) ? '，已達資質上限，圓滿無缺！' : '。'}`, 'success')
  }

  function refreshAfterItem() {
    render()
    if (['bag', 'market', 'auction', 'pets', 'sect', 'character'].includes(state.nav)) renderInfo()
  }

  function feedPet(uid, feedId) {
    const p = state.pets.find((x) => x.uid === uid)
    const def = ITEMS[feedId]
    if (!p || !def || !def.effect || def.effect.type !== 'feedPet') return
    if ((state.inventory[feedId] || 0) <= 0) { addLog(`沒有「${def.name}」了。`, 'danger'); return refreshAfterItem() }
    if (petMaxed(p)) { addLog(`「${petTpl(p).name}」已達資質上限（${REALMS[p.cap]}期圓滿），無法再精進。`, 'danger'); return refreshAfterItem() }
    consumeItem(feedId)
    addLog(`餵食「${petTpl(p).name}」${def.name}，靈寵修為 +${def.effect.value}。`)
    addPetXp(p, def.effect.value)
    refreshAfterItem()
  }

  function toggleActivePet(uid) {
    const p = state.pets.find((x) => x.uid === uid)
    if (!p) return
    if (state.activePet === uid) { state.activePet = null; addLog(`「${petTpl(p).name}」回到靈獸袋中休息。`) }
    else { state.activePet = uid; addLog(`「${petTpl(p).name}」隨你出戰。`, 'success') }
    refreshAfterItem()
  }

  function releasePet(uid) {
    const p = state.pets.find((x) => x.uid === uid)
    if (!p) return
    if (!confirm(`確定要放生「${petTpl(p).name}」（${realmText(p.realm, p.layer)}）嗎？放生後無法找回。`)) return
    state.pets = state.pets.filter((x) => x.uid !== uid)
    if (state.activePet === uid) state.activePet = null
    addLog(`你將「${petTpl(p).name}」放歸山林。`)
    refreshAfterItem()
  }
  /* =========================================================
   * 連線層（ORPG）：登入、SSE 即時推送、聊天、PvP、共享拍賣、世界 Boss
   * 連線模式：登入後 net.token 才有值
   * ========================================================= */
  const net = { token: null, name: null, es: null, up: false, online: [], auctions: [], boss: null, chat: [], offset: 0, seenMail: new Set(), tickN: 0 }
  const isOnline = () => !!net.token
  const pname = () => net.name || '雲逸'
  const serverNow = () => Date.now() + net.offset
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

  async function api(path, payload) {
    try {
      const r = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ token: net.token }, payload)) })
      const j = await r.json().catch(() => ({}))
      if (!r.ok) return { ok: false, error: j.error || '請求失敗' }
      return j
    } catch (e) { return { ok: false, error: '無法連線到伺服器' } }
  }
  const snapshot = () => ({ realm: state.realm, layer: state.layer, xp: state.xp, hp: state.hp, mp: state.mp, stones: state.stones, jade: state.jade, inventory: encodePets(state.inventory), sect: state.sect, contribution: state.contribution })
  const pushSave = () => api('save', { save: snapshot() })

  function setNet(up) {
    net.up = up
    const b = $('netBadge'); if (!b) return
    b.textContent = up ? `在線 · ${net.online.length} 人` : '連線中…'
    b.style.color = up ? 'var(--primary)' : 'var(--destructive)'
  }

  function applyMail(list) {
    const ids = []
    for (const m of list || []) {
      if (net.seenMail.has(m.id)) continue
      net.seenMail.add(m.id); ids.push(m.id)
      if (m.kind === 'stones') state.stones = Math.max(0, state.stones + m.amount)
      else if (m.kind === 'item') addItem(m.item, m.qty || 1)
      else if (m.kind === 'xp') state.xp = Math.min(required(), state.xp + xpGain(m.amount))
      addLog(m.text || '收到一封傳書。', m.kind === 'stones' && m.amount < 0 ? 'danger' : 'gold')
    }
    if (ids.length) { api('mail/ack', { ids }); render(); if (['bag', 'market', 'auction', 'pets'].includes(state.nav)) renderInfo() }
  }

  function connectStream() {
    const es = new EventSource('/api/stream?token=' + net.token)
    net.es = es
    const on = (ev, fn) => es.addEventListener(ev, (e) => { try { fn(JSON.parse(e.data)) } catch (err) {} })
    on('hello', (d) => { net.offset = d.serverTime - Date.now(); net.online = d.online; net.auctions = d.auctions; net.boss = d.boss; net.chat = d.chat; setNet(true); refreshNet('all') })
    on('presence', (d) => { net.online = d; setNet(true); refreshNet('presence') })
    on('chat', (m) => { net.chat.push(m); if (net.chat.length > 80) net.chat.shift(); refreshNet('chat') })
    on('auctions', (d) => { net.auctions = d; refreshNet('auctions') })
    on('boss', (d) => { net.boss = d; refreshNet('boss') })
    on('mail', (d) => applyMail(d.mail))
    es.onerror = () => {
      setNet(false)
      if (es.readyState === EventSource.CLOSED) addLog('與伺服器的連線已中斷，請重新整理頁面並重新登入。', 'danger')
    }
  }

  function refreshNet(kind) {
    if (kind === 'chat') { if (state.nav === 'world') updateChat(); return }
    if (kind === 'presence') { if (state.nav === 'world') updateOnline(); return }
    if (kind === 'auctions') { if (state.nav === 'auction') renderInfo(); return }
    if (kind === 'boss') { if (state.nav === 'boss') renderInfo(); return }
    renderInfo()
  }

  function updateChat() {
    const el = $('chatLog'); if (!el) return
    el.innerHTML = net.chat.map((m) => {
      const t = new Date(m.t).toTimeString().slice(0, 5)
      if (m.sys) return `<li style="color:var(--accent)">${t} 【天道】${esc(m.text)}</li>`
      if (m.to) return `<li style="color:var(--primary)">${t} [密語] ${esc(m.from)} → ${esc(m.to)}：${esc(m.text)}</li>`
      return `<li>${t} <span class="bold" style="font-size:12px">${esc(m.from)}</span>：${esc(m.text)}</li>`
    }).join('')
    el.scrollTop = el.scrollHeight
  }
  function updateOnline() {
    const el = $('onlineList'); if (!el) return
    $('onlineCount').textContent = `（${net.online.length}）`
    el.innerHTML = net.online.map((p) => {
      const me = p.name.toLowerCase() === (net.name || '').toLowerCase()
      const sect = (SECTS.find((s) => s.id === p.sect) || {}).name || ''
      return `<li class="row xs"><span><span class="bold" style="font-size:13px">${esc(p.name)}</span> <span class="muted">${REALMS[p.realm] || ''}期第${NUM[p.layer - 1] || ''}層 ${sect}</span></span>${me ? '<span class="muted">你</span>' : `<span style="display:flex;gap:6px"><button type="button" class="small-btn" data-whisper="${esc(p.name)}">密語</button><button type="button" class="small-btn" data-pvp="${esc(p.name)}">切磋</button></span>`}</li>`
    }).join('')
  }
  function renderWorld() {
    return `
      <div class="card" style="margin-bottom:12px">
        <h3 class="xs muted" style="letter-spacing:.2em;margin-bottom:8px">線上修士<span id="onlineCount"></span></h3>
        <ul class="stack" id="onlineList" style="gap:8px;max-height:150px;overflow-y:auto"></ul>
      </div>
      <ol class="battle-log xs" id="chatLog" style="max-height:230px;margin-top:0" aria-live="polite"></ol>
      <form id="chatForm" class="row" style="gap:8px;margin-top:10px">
        <input id="chatInput" class="exchange-input" maxlength="100" placeholder="世界頻道發言，或 /w 道號 內容" autocomplete="off" aria-label="聊天訊息" />
        <button type="submit" class="small-btn">發送</button>
      </form>`
  }
  async function sendChat(raw) {
    let text = raw.trim(), to
    if (!text) return
    const m = text.match(/^\/w\s+(\S+)\s+([\s\S]+)/)
    if (m) { to = m[1]; text = m[2] }
    const r = await api('chat', { text, to })
    if (!r.ok) addLog(r.error, 'danger')
  }

  function renderBoss() {
    const b = net.boss
    if (!b) return '<p class="xs muted">正在感應魔蛟氣息…</p>'
    const pct = Math.max(0, Math.min(100, (b.hp / b.maxHp) * 100))
    const top = (b.top || []).map((t, i) => `<li class="row xs"><span>${i + 1}. ${esc(t.name)}</span><span class="num muted">${t.dmg.toLocaleString()}</span></li>`).join('') || '<li class="xs muted">尚無人出手</li>'
    return `
      <div class="card" style="margin-bottom:14px;text-align:center">
        <div class="monster-icon" style="width:72px;height:72px;font-size:38px;margin:0 auto 8px">🐉</div>
        <div class="bold">${esc(b.name)}</div>
        <div class="track" style="margin:10px 0 4px"><div class="fill" style="background:var(--destructive);width:${pct}%"></div></div>
        <span class="xs muted num">${b.hp.toLocaleString()} / ${b.maxHp.toLocaleString()}</span>
        ${b.alive ? '' : `<p class="xs" style="color:var(--accent);margin-top:8px">已被擊殺 · <span data-respawn="${b.respawnAt}"></span> 後再現</p>`}
        ${b.alive && b.hp / b.maxHp < 0.3 ? '<p class="xs" style="color:var(--destructive);margin-top:8px">魔蛟已陷入狂暴，反擊傷害 ×1.5！</p>' : ''}
        <div class="track" style="margin:12px auto 4px;width:60%"><div class="fill" style="background:var(--primary);width:${Math.max(0, Math.min(100, (state.hp / maxHp()) * 100))}%"></div></div>
        <span class="xs muted num">你的氣血 ${state.hp} / ${maxHp()}　靈力 ${state.mp} / ${maxMp()}</span>
        <div class="actions" style="margin-top:12px"><button type="button" class="btn btn-gold" data-boss-attack ${b.alive ? '' : 'disabled'}>出手<small>${bossAtkCost()} 靈力</small></button></div>
        ${net.bossLog.length ? `<ol class="battle-log xs muted" style="margin-top:12px;text-align:left">${net.bossLog.map((l) => `<li>${esc(l)}</li>`).join('')}</ol>` : ''}
      </div>
      <h3 class="panel-title" style="font-size:12px;margin-bottom:8px">傷害榜</h3>
      <ul class="stack" style="gap:8px">${top}</ul>
      <p class="xs muted" style="margin-top:12px;line-height:1.7">擊殺獎勵：全體參與者依傷害占比獲得靈石與修為；最後一擊得雷晶，傷害第一得破損玉簡。</p>
      <p class="xs" style="margin-top:6px;line-height:1.7;color:var(--accent)">每次出手皆有機緣：神獸蛋 ${+(BOSS_PET_LOOT[0].chance * 100).toFixed(2)}%、神級寵物飼料 ${+(BOSS_PET_LOOT[1].chance * 100).toFixed(2)}%。出戰靈寵會協同攻擊。</p>
      <p class="xs" style="margin-top:6px;line-height:1.7;color:var(--destructive)">魔蛟會在你出手後反擊（蛟尾橫掃、噬魂利爪、滅世龍息、蛟嘯震魂）。氣血低於 ${Math.ceil(maxHp() * BOSS_MIN_HP_RATIO)} 時無法出手，記得備好療傷丹。</p>`
  }
  /* 世界王反擊：每次你出手後，魔蛟會隨機施展一種招式回敬。
   *   w 權重（越大越常出現）｜mul 傷害倍率｜mp 額外削減的靈力
   * 魔蛟氣血低於 30% 會進入狂暴，傷害 ×1.5 */
  const BOSS_SKILLS = [
    { name: '蛟尾橫掃', w: 55, mul: 1.0 },
    { name: '噬魂利爪', w: 25, mul: 1.4 },
    { name: '滅世龍息', w: 12, mul: 2.2 },
    { name: '蛟嘯震魂', w: 8, mul: 0.6, mp: 20 },
  ]
  const BOSS_DMG_PCT = [0.08, 0.13] // 基礎傷害 = 你的氣血上限的 8%～13%（再乘招式倍率、狂暴倍率）
  const bossAtkCost = () => Math.round(10 * mpRatio()) // 出手消耗靈力，隨靈力上限放大
  const BOSS_MIN_HP_RATIO = 0.25              // 氣血低於此比例，不可再向世界王出手
  net.bossLog = []
  const bossLogPush = (t) => { net.bossLog.unshift(t); if (net.bossLog.length > 6) net.bossLog.pop() }
  function bossCounter() {
    const b = net.boss
    const bn = b ? b.name : '魔蛟'
    const rage = !!(b && b.maxHp && b.hp / b.maxHp < 0.3)
    let roll = Math.random() * BOSS_SKILLS.reduce((a, k) => a + k.w, 0)
    const sk = BOSS_SKILLS.find((k) => (roll -= k.w) < 0) || BOSS_SKILLS[0]
    const reduce = Math.min(0.8, sectBonus('def') + buffVal('def'))
    const baseDmg = maxHp() * (BOSS_DMG_PCT[0] + Math.random() * (BOSS_DMG_PCT[1] - BOSS_DMG_PCT[0]))
    let dmg = Math.max(1, Math.round((baseDmg * sk.mul * (rage ? 1.5 : 1) - state.realm * 2 * hpRatio()) * (1 - reduce)))
    let text = `${rage ? '【狂暴】' : ''}「${bn}」施展「${sk.name}」`
    const pet = activePet()
    if (pet && Math.random() < 0.25) {
      dmg = Math.max(1, Math.round(dmg * 0.4))
      text += `，靈寵「${petTpl(pet).name}」捨身擋下大半`
    }
    state.hp = Math.max(0, state.hp - dmg)
    text += `，你受到 ${dmg} 點傷害`
    if (sk.mp) { const lost = Math.min(state.mp, Math.round(sk.mp * mpRatio())); state.mp -= lost; if (lost) text += `，靈力被震散 ${lost} 點` }
    text += '。'
    if (state.hp <= 0) {
      state.hp = 1
      text += `你被${bn}重創，僅存一口氣，需先調息或服丹再戰！`
    }
    addLog(text, 'danger')
    bossLogPush(text)
  }
  async function attackBoss() {
    if (state.mp < bossAtkCost()) { addLog('靈力不足，無法出手。', 'danger'); render(); return }
    if (state.hp < maxHp() * BOSS_MIN_HP_RATIO) { addLog(`氣血過低（需高於 ${Math.ceil(maxHp() * BOSS_MIN_HP_RATIO)}），再戰恐有性命之憂，先服丹療傷吧。`, 'danger'); render(); return }
    const r = await api('boss/attack')
    if (!r.ok) { addLog(r.error, 'danger'); return }
    state.mp -= bossAtkCost()
    addLog(`你向「${net.boss ? net.boss.name : '魔蛟'}」發出一擊，造成 ${r.dmg} 點傷害。`, 'success')
    bossLogPush(`你出手造成 ${r.dmg} 點傷害。`)
    const drops = rollTable(BOSS_PET_LOOT)
    if (drops.length) {
      drops.forEach((l) => addItem(l.item, l.qty))
      addLog(`魔蛟鱗甲崩落之間，你眼明手快拾得 ${lootText(drops)}！`, 'gold')
    }
    if (!r.killed && !(net.boss && net.boss.alive === false)) bossCounter()
    render()
    if (state.nav === 'boss') renderInfo()
    pushSave()
  }
  async function challengePlayer(name) {
    const r = await api('pvp', { target: name })
    if (!r.ok) { addLog(r.error, 'danger'); return }
    addLog(r.win ? `你與「${name}」切磋，獲勝！` : `你與「${name}」切磋，惜敗。`, r.win ? 'success' : 'danger')
  }

  function renderNetAuction() {
    const me = (net.name || '').toLowerCase()
    const cards = net.auctions.map((a) => {
      const def = ITEMS[a.item]; if (!def) return ''
      const mineSell = a.seller.toLowerCase() === me, lead = a.bidder && a.bidder.toLowerCase() === me
      
      // 計算四種百分比的新出價金額 (10%, 30%, 50%, 100%)
      const basePrice = a.bidder ? a.current : a.start;
      const bid10 = basePrice + Math.ceil(basePrice * 0.1);
      const bid30 = basePrice + Math.ceil(basePrice * 0.3);
      const bid50 = basePrice + Math.ceil(basePrice * 0.5);
      const bid100 = basePrice + Math.ceil(basePrice * 1.0);
      return `
        <li class="card">
          <div class="row" style="align-items:flex-start">
            <div class="cluster"><div class="item-icon">${def.icon}</div>
              <div class="col"><span class="bold">${def.name} <span class="xs muted">× ${a.qty}</span></span>
              <span class="xs muted">賣家：${esc(a.seller)}${mineSell ? '（你）' : ''} · ${a.bidder ? `最高：${lead ? '你' : esc(a.bidder)}` : '尚無人出價'}</span></div></div>
            <span class="xs muted num" style="white-space:nowrap">剩餘 <span data-ends="${a.endsAt}"></span>s</span>
          </div>
          <div class="row" style="margin-top:8px">
            <span class="xs muted">目前 <span class="bold num" style="color:var(--accent)">${a.current}</span> 靈石${a.qty > 1 ? `（每件約 ${Math.round(a.current / a.qty)}）` : ''}</span>
          </div>
          <div class="actions" style="justify-content:flex-start; margin-top:8px; gap:4px; flex-wrap:wrap;">
            <button type="button" class="small-btn" data-net-bid-rate="${a.id}" data-rate="0.1" ${mineSell || lead ? 'disabled' : ''}>+10% (${bid10})</button>
            <button type="button" class="small-btn" data-net-bid-rate="${a.id}" data-rate="0.3" ${mineSell || lead ? 'disabled' : ''}>+30% (${bid30})</button>
            <button type="button" class="small-btn" data-net-bid-rate="${a.id}" data-rate="0.5" ${mineSell || lead ? 'disabled' : ''}>+50% (${bid50})</button>
            <button type="button" class="small-btn" data-net-bid-rate="${a.id}" data-rate="1.0" ${mineSell || lead ? 'disabled' : ''}>+100% (${bid100})</button>
          </div>
        </li>`
    }).join('') || '<li class="xs muted">目前沒有拍賣品，成為第一個上架的人吧。</li>'
    const eligible = Object.entries(state.inventory).filter(([id, q]) => q > 0 && !SHOP_ITEMS.includes(id) && ITEMS[id])
    const options = eligible.length ? eligible.map(([id, q]) => `<option value="${id}">${ITEMS[id].icon} ${ITEMS[id].name}（持有 ${q}）</option>`).join('') : '<option value="">（目前沒有可上架的物品）</option>'
    return `
      <h3 class="panel-title" style="font-size:12px;margin-bottom:8px">全服拍賣</h3>
      <ul class="stack" style="margin-bottom:18px">${cards}</ul>
      <div class="card">
        <h3 class="xs muted" style="letter-spacing:.2em;margin-bottom:10px">上架我的物品（可選數量，價格為每件單價，最多同時 5 件）</h3>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <select id="listItemSelect" class="exchange-input" style="flex:2;min-width:140px">${options}</select>
          <input id="listQty" class="exchange-input" type="number" min="1" step="1" value="1" placeholder="數量" style="flex:0 0 70px;min-width:60px" aria-label="上架數量" />
          <input id="listPrice" class="exchange-input" type="number" min="1" placeholder="每件起標靈石" style="flex:1;min-width:100px" aria-label="每件起標價格" />
          <button type="button" class="small-btn" data-net-list>上架</button>
        </div>
      </div>`
  }
  async function netBidWithRate(id, rate) {
    const a = net.auctions.find((x) => x.id === id); if (!a) return
    const basePrice = a.bidder ? a.current : a.start;
    const target = basePrice + Math.ceil(basePrice * Number(rate));

    if (state.stones < target) { addLog('靈石不足，無法出價。', 'danger'); render(); return }
    
    // 向後端發送出價請求，並帶上計算好的金額或百分比
    const r = await api('auction/bid', { id, amount: target })
    if (!r.ok) { addLog(r.error, 'danger'); return }
    
    state.stones = Math.max(0, state.stones - r.amount)
    addLog(`你出價 ${r.amount} 靈石（加價 ${Number(rate) * 100}%）。`, 'gold')
    render(); pushSave()
  }
  async function netList() {
    const itemId = $('listItemSelect') && $('listItemSelect').value
    const price = Math.max(0, Math.floor(Number($('listPrice') && $('listPrice').value) || 0))
    if (!itemId || (state.inventory[itemId] || 0) <= 0) { addLog('沒有可上架的物品。', 'danger'); return }
    if (SHOP_ITEMS.includes(itemId)) { addLog('交易所販售的道具無法上架拍賣場。', 'danger'); return }
    const qty = Math.max(1, Math.floor(Number($('listQty') && $('listQty').value) || 1))
    if (price <= 0) { addLog('請輸入有效的每件起標價格。', 'danger'); return }
    if (qty > (state.inventory[itemId] || 0)) { addLog('物品數量不足，無法上架這麼多。', 'danger'); return }
    const total = price * qty // 伺服器的起標價為整組總價
    await pushSave() // 先把最新背包同步到伺服器，伺服器會驗證持有數量
    const r = await api('auction/list', { item: itemId, price: total, qty })
    if (!r.ok) { addLog(r.error, 'danger') } else { consumeItem(itemId, qty); addLog(`將「${ITEMS[itemId].name}」× ${qty} 送上全服拍賣，每件 ${price} 靈石，起標總價 ${total} 靈石。`, 'gold'); pushSave() }
    render(); renderInfo()
  }
  function tickTimers() {
    document.querySelectorAll('[data-ends]').forEach((el) => { el.textContent = Math.max(0, Math.ceil((Number(el.dataset.ends) - serverNow()) / 1000)) })
    document.querySelectorAll('[data-respawn]').forEach((el) => { el.textContent = Math.max(0, Math.ceil((Number(el.dataset.respawn) - serverNow()) / 1000)) + 's' })
  }

  /* 存檔：進度存於伺服器（Supabase），這裡只負責同步 */
  function saveGame(silent) {
    pushSave()
    if (!silent) addLog('已同步進度到伺服器。', 'gold')
  }

  // 舊存檔沒有靈寵欄位、或資料不完整時補齊
  function normalizeState() {
    if (!Array.isArray(state.pets)) state.pets = []
    // 連線存檔：靈寵以編碼 key 藏在 inventory 裡，解回 state.pets
    if (state.inventory && Object.keys(state.inventory).some((k) => k.startsWith(PET_KEY))) {
      const d = decodePets(state.inventory)
      state.pets = d.pets
      state.activePet = d.active
    }
    state.pets = state.pets.filter((p) => p && PET_TEMPLATES.some((t) => t.id === p.tpl))
    if (!state.pets.some((p) => p.uid === state.activePet)) state.activePet = null
    if (!state.inventory || typeof state.inventory !== 'object') state.inventory = {}
    // 連線存檔：宗門任務進度藏在 inventory 裡，解回 state.quests
    if (!state.quests || typeof state.quests !== 'object') state.quests = {}
    for (const [k, v] of Object.entries(state.inventory)) {
      if (!k.startsWith(QUEST_KEY)) continue
      state.quests[k.slice(QUEST_KEY.length)] = Number(v) || 0
      delete state.inventory[k]
    }
    for (const id of Object.keys(state.inventory)) if (!ITEMS[id]) delete state.inventory[id]
    // 宗門：舊版宗門（天機閣、玄陰宗…）已移除 → 變回散修、貢獻歸零
    if (!currentSect()) { state.sect = ''; state.contribution = 0; state.quests = {} }
    const sect = currentSect()
    for (const qid of Object.keys(state.quests)) if (!sect || !sect.quests.some((q) => q.id === qid && q.type === 'kill')) delete state.quests[qid]
    if (!state.buffs || typeof state.buffs !== 'object') state.buffs = {}
    state.breakBonus = Number(state.breakBonus) || 0
    state.contribution = Math.max(0, Number(state.contribution) || 0)
  }

  function showLogin() {
    $('start-screen').classList.add('hidden')

    $('loginName').focus()
  }
  $('loginBack').addEventListener('click', () => { $('login-screen').classList.add('hidden'); $('start-screen').classList.remove('hidden') })
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault()
    const err = $('loginErr'), btn = $('loginBtn')
    err.textContent = ''
    if (location.protocol === 'file:') { err.textContent = '連線模式需先執行 node server.js，並開啟 http://localhost:3000'; return }
    btn.disabled = true; btn.textContent = '連線中…'
    const r = await api('login', { name: $('loginName').value, password: $('loginPw').value })
    btn.disabled = false; btn.textContent = '連線登入'
    if (r.error || !r.token) { err.textContent = r.error || '登入失敗'; return }
    net.token = r.token; net.name = r.name
    state.isGM = !!r.gm
    if (r.save) Object.assign(state, r.save)
    normalizeState()
    if (state.isGM) fillGMInventory()
    state.selectedLocation = null; state.battle = null
    $('login-screen').classList.add('hidden')
    enterOnline(r)
  })
  function enterOnline(r) {
    $('game-screen').classList.remove('hidden')
    addLog(r.created ? `道友「${net.name}」初入修仙界，願你早登大道。` : `歡迎回來，${net.name}。`, 'gold')
    renderNav(); renderInfo(); render(); setNet(false)
    connectStream()
    applyMail(r.mail)
  }

  function addLog(text, tone = 'normal') {
    const li = document.createElement('li')
    li.className = 'tone-' + tone
    li.textContent = text
    const log = $('log')
    log.prepend(li)
    while (log.children.length > 40) log.lastChild.remove()
  }

  function setBar(id, valId, value, max) {
    const bar = $(id)
    bar.firstElementChild.style.width = Math.max(0, Math.min(100, (value / max) * 100)) + '%'
    bar.setAttribute('aria-valuemax', max)
    bar.setAttribute('aria-valuenow', Math.round(value))
    $(valId).textContent = `${Math.round(value)}/${max}`
  }

        break

      let need, status
      if (q.type === 'kill') {
        const info = monsterById(q.monster)
        const mName = info ? `${info.m.icon} ${info.m.name}` : q.monster
        const where = info ? `（${info.loc.name}，${REALMS[info.loc.reqRealm]}期可入）` : ''
        const accepted = q.id in state.quests
        const prog = state.quests[q.id] || 0
        need = `擊殺 ${mName} × ${q.qty}${where}`
        status = !accepted
          ? `<button type="button" class="small-btn" data-quest-accept="${q.id}" ${active >= MAX_ACTIVE_QUESTS ? 'disabled title="擊殺任務最多同時接 ' + MAX_ACTIVE_QUESTS + ' 個"' : ''}>接取</button>`
          : `<span class="xs num" style="color:${prog >= q.qty ? 'var(--accent)' : 'var(--muted-fg)'}">${prog} / ${q.qty}</span>
             ${prog >= q.qty ? `<button type="button" class="small-btn" data-quest-done="${q.id}">交付</button>` : ''}
             <button type="button" class="small-btn" data-quest-abandon="${q.id}">放棄</button>`
      } else {
        const def = ITEMS[q.item], have = state.inventory[q.item] || 0
        need = `上交 ${def.icon} ${def.name} × ${q.qty}`
        status = `<span class="xs num" style="color:${have >= q.qty ? 'var(--accent)' : 'var(--muted-fg)'}">持有 ${have} / ${q.qty}</span>
                  <button type="button" class="small-btn" data-quest-done="${q.id}" ${have >= q.qty ? '' : 'disabled'}>上交</button>`
      }
      return `
        <li class="card">
          <div class="row" style="align-items:baseline"><span class="bold">${q.name}</span><span class="xs muted">${q.type === 'kill' ? '討伐' : '上交'}</span></div>
          <p class="xs muted" style="margin-top:4px">${q.desc}</p>
          <p class="xs" style="margin-top:6px">${need}</p>
          <p class="xs" style="margin-top:2px;color:var(--accent)">獎勵：${rewardText(q.reward)}</p>
          <div class="actions" style="justify-content:flex-start;align-items:center;gap:8px;margin-top:8px">${status}</div>
        </li>`
    }).join('')
    return `
      <p class="xs muted" style="margin-bottom:10px">貢獻：<span class="bold num" style="color:var(--accent)">${state.contribution.toLocaleString()}</span>　任務可重複完成；討伐任務需先接取（同時最多 ${MAX_ACTIVE_QUESTS} 個）。</p>
      <ul class="stack">${cards}</ul>`
  }

  function renderSectShop(s) {
    const cards = s.shop.map(({ item, cost }) => {
      const def = ITEMS[item], have = state.inventory[item] || 0
      return `
        <li class="item-card">
          <div class="item-icon">${def.icon}</div>
          <div class="col" style="flex:1;min-width:0">
            <div class="row" style="align-items:baseline"><span class="bold">${def.name}</span><span class="xs muted">持有 ${have}</span></div>
            <span class="xs" style="color:${rarityColor(def.rarity)}">${def.rarity}${def.sect ? ' · 本宗專屬' : ''}</span>
            <p class="xs muted" style="margin-top:2px">${def.desc}</p>
            <div class="actions" style="justify-content:flex-start;margin-top:6px">
              <button type="button" class="small-btn" data-sect-buy="${item}" ${state.contribution >= cost ? '' : 'disabled'}>兌換（${cost} 貢獻）</button>
            </div>
          </div>
        </li>`
    }).join('')
    return `
      <p class="xs muted" style="margin-bottom:10px">貢獻：<span class="bold num" style="color:var(--accent)">${state.contribution.toLocaleString()}</span></p>
      <ul class="item-list">${cards}</ul>`
  }

  function renderSectList() {
    const groups = Object.entries(SECT_ALIGNS).map(([key, a]) => {
      const list = SECTS.filter((s) => s.align === key).map((s) => {
        const mine = state.sect === s.id
        return `
          <li class="card sect-card ${mine ? 'selected' : ''}">
            <div class="row" style="align-items:flex-start">
              <div class="col" style="min-width:0">
                <span class="bold">${s.name}</span>
                <span class="xs muted" style="margin-top:4px;line-height:1.6">${s.desc}</span>
                <span class="xs" style="color:var(--accent);margin-top:4px">${bonusText(s)}</span>
              </div>
              ${mine ? '<span class="xs" style="color:var(--primary);white-space:nowrap">目前宗門</span>' : `<button type="button" class="small-btn" data-sect="${s.id}">${state.sect ? '改投' : '拜入'}</button>`}
            </div>
          </li>`
      }).join('')
      return `<h3 class="panel-title" style="font-size:12px;margin:14px 0 8px;color:${a.color}">${a.label}</h3><ul class="stack">${list}</ul>`
    }).join('')
    return `${state.sect ? '' : '<p class="xs muted" style="line-height:1.7">你目前是散修。拜入宗門即可獲得宗門特色狀態，並能承接宗門任務、以貢獻兌換天材地寶。</p>'}${groups}`
  }

  function refreshSect() { render(); if (state.nav === 'sect') renderInfo() }

  // 角色分頁：目前宗門特色與增益狀態
  function renderStatus() {
    const s = currentSect()
    const buffs = Object.entries(state.buffs).map(([k, b]) => `${BUFF_LABELS[k] || k} +${Math.round(b.value * 100)}%（剩 ${b.left} 息）`)
    if (state.breakBonus) buffs.push(`下一次突破機率 +${Math.round(state.breakBonus * 100)}%`)
    return `
      <div class="card" style="margin-top:16px">
        <h3 class="xs" style="color:var(--accent);letter-spacing:.2em">宗門特色</h3>
        <p class="xs" style="margin-top:4px;line-height:1.7">${s ? `${s.name}：${bonusText(s)}` : '散修，無宗門加成'}</p>
        <h3 class="xs" style="color:var(--accent);letter-spacing:.2em;margin-top:10px">增益狀態</h3>
        <p class="xs muted" style="margin-top:4px;line-height:1.7">${buffs.join('<br>') || '無'}</p>
      </div>`
  }

  function joinSect(id) {
    const s = SECTS.find((x) => x.id === id)
    if (!s || state.sect === id) return
    const old = currentSect()
    if (old && !confirm(`改投「${s.name}」將離開「${old.name}」，目前 ${state.contribution} 點貢獻會歸零、進行中的任務作廢。確定嗎？`)) return
    if (old) addLog(`你離開了「${old.name}」，宗門貢獻歸零。`, 'danger')
    state.sect = id; state.contribution = 0; state.quests = {}; state.sectTab = 'mine'
    addLog(`你拜入「${s.name}」，獲得宗門特色：${bonusText(s)}。`, 'gold')
    refreshSect()
  }
  function leaveSect() {
    const s = currentSect()
    if (!s || !confirm(`確定要離開「${s.name}」嗎？目前 ${state.contribution} 點貢獻會歸零、進行中的任務作廢。`)) return
    state.sect = ''; state.contribution = 0; state.quests = {}
    addLog(`你離開了「${s.name}」，重歸散修，宗門貢獻歸零。`, 'danger')
    refreshSect()
  }
  const findQuest = (qid) => { const s = currentSect(); return s ? s.quests.find((q) => q.id === qid) : null }
  function acceptQuest(qid) {
    const q = findQuest(qid)
    if (!q || q.type !== 'kill' || qid in state.quests) return
    if (Object.keys(state.quests).length >= MAX_ACTIVE_QUESTS) { addLog(`討伐任務最多同時接取 ${MAX_ACTIVE_QUESTS} 個。`, 'danger'); return refreshSect() }
    state.quests[qid] = 0
    addLog(`接取宗門任務「${q.name}」。`)
    refreshSect()
  }
  function abandonQuest(qid) {
    const q = findQuest(qid)
    if (!q || !(qid in state.quests)) return
    delete state.quests[qid]
    addLog(`放棄宗門任務「${q.name}」。`)
    refreshSect()
  }
  function completeQuest(qid) {
    const q = findQuest(qid)
    if (!q) return
    if (q.type === 'kill') {
      if ((state.quests[qid] || 0) < q.qty) return
      delete state.quests[qid]
    } else {
      if ((state.inventory[q.item] || 0) < q.qty) { addLog(`「${ITEMS[q.item].name}」數量不足。`, 'danger'); return refreshSect() }
      consumeItem(q.item, q.qty)
    }
    const r = q.reward
    state.contribution += r.contribution
    if (r.stones) state.stones += r.stones
    if (r.xp) { const req = required(); state.xp = Math.min(req, state.xp + xpGain(req * r.xp)) }
    addLog(`完成宗門任務「${q.name}」，獲得${rewardText(r)}。`, 'gold')
    refreshSect()
  }
  function buySectItem(item) {
    const s = currentSect()
    const entry = s && s.shop.find((x) => x.item === item)
    if (!entry) return
    if (state.contribution < entry.cost) { addLog('宗門貢獻不足。', 'danger'); return refreshSect() }
    state.contribution -= entry.cost
    addItem(item, 1)
    addLog(`以 ${entry.cost} 點貢獻兌換「${ITEMS[item].name}」。`, 'gold')
    refreshSect()
  }
  // 擊殺妖獸時推進討伐任務
  function progressKillQuests(monsterId) {
    for (const qid of Object.keys(state.quests)) {
      const q = findQuest(qid)
      if (!q || q.monster !== monsterId || state.quests[qid] >= q.qty) continue
      state.quests[qid]++
      if (state.quests[qid] >= q.qty) addLog(`宗門任務「${q.name}」已達成，回宗門交付吧。`, 'gold')
    }
  }

  function renderSkills() {
    $('skills').innerHTML = SKILLS.map((s, i) => {
      const cd = state.cooldowns[s.id] || 0
      const disabled = cd > 0 || state.mp < s.cost
      return `
        <li><button type="button" class="skill" data-skill="${i}" ${disabled ? 'disabled' : ''}
            aria-label="${s.name}，消耗 ${s.cost} 靈力${cd > 0 ? `，冷卻 ${cd} 秒` : ''}">
          <span class="seal" aria-hidden="true">${s.element}</span>
          <span class="skill-text"><span class="bold">${s.name}</span><span class="xs muted">${s.cost} 靈力 · <kbd>${i + 1}</kbd></span></span>
          ${cd > 0 ? `<span class="cd" aria-hidden="true">${cd}</span>` : ''}
        </button></li>`
    }).join('')
  }

  function render() {
    const req = required()
    const ready = state.xp >= req
    const progress = Math.min(1, state.xp / req)

    const sect = currentSect()
    $('sectBadge').textContent = sect ? `${sect.name} · 門下弟子` : '散修'
    $('playerName').textContent = pname()
    $('realmLine').textContent = `${REALMS[state.realm]}期 · 第${NUM[state.layer - 1]}層`
    setBar('hpBar', 'hpVal', state.hp, maxHp())
    setBar('mpBar', 'mpVal', state.mp, maxMp())
    $('stones').textContent = state.stones.toLocaleString()
    $('jade').textContent = state.jade.toLocaleString()

    const core = $('core')
    core.classList.toggle('ready', ready)
    core.classList.toggle('secluded', state.secluded)
    const ring = $('ring')
    ring.setAttribute('stroke-dasharray', CIRC)
    ring.setAttribute('stroke-dashoffset', CIRC * (1 - progress))
    ring.setAttribute('stroke', ready ? 'var(--accent)' : 'var(--primary)')
    $('coreRealm').textContent = REALMS[state.realm]
    $('coreLayer').textContent = `第${NUM[state.layer - 1]}層`
    $('coreXp').textContent = `修為 ${Math.floor(state.xp)} / ${req}`
    $('chance').textContent = Math.round(chance() * 100) + '%'

    $('btnCultivate').disabled = state.mp < CULTIVATE_COST || ready
    $('btnBreak').disabled = !ready
    const sec = $('btnSeclude')
    sec.textContent = state.secluded ? '出關' : '閉關'
    sec.setAttribute('aria-pressed', state.secluded)
    const buffs = Object.entries(state.buffs).map(([k, b]) => `${BUFF_LABELS[k] || k}+${Math.round(b.value * 100)}%(${b.left})`)
    if (state.breakBonus) buffs.push(`突破+${Math.round(state.breakBonus * 100)}%`)
    $('coreHint').textContent = (state.secluded ? '閉關中 · 每息自動吸納天地靈氣' : '運功消耗 5 點靈力，修為圓滿方可突破') + (buffs.length ? ` ｜ 增益：${buffs.join('、')}` : '')

    renderSkills()
    // 拍賣場／戰鬥中的畫面需要每秒即時更新，其餘分頁（背包、交易所…）的刷新由各自的操作函式自行呼叫 renderInfo()
    if (state.nav === 'realm' && state.battle) renderInfo()
  }

  function cultivate() {
    const req = required()
    if (state.mp < CULTIVATE_COST || state.xp >= req) return
    const gain = xpGain(req * (0.06 + Math.random() * 0.06) * (1 + sectBonus('cultivate') + buffVal('cultivate')))
    state.mp -= CULTIVATE_COST
    state.xp = Math.min(req, state.xp + gain)
    if (Math.random() < 0.35) addLog(`運轉周天，吸納天地靈氣，修為增加 ${gain}。`)
    render()
  }

  function breakthrough() {
    if (state.xp < required()) return
    const ok = Math.random() < chance()
    const oldHp = maxHp(), oldMp = maxMp()
    if (state.breakBonus) { state.breakBonus = 0; addLog('突破加持之力已消耗。') }
    if (ok) {
      state.xp = 0
      if (state.layer < MAX_LAYER) {
        addLog(`突破成功！晉入${REALMS[state.realm]}期第${NUM[state.layer]}層。`, 'success')
        state.layer++
      } else if (state.realm < REALMS.length - 1) {
        state.realm++
        state.layer = 1
        addLog(`天降異象，霞光萬道！你成功踏入${REALMS[state.realm]}期！`, 'gold')
      } else {
        addLog('你已臻大乘圓滿，只待飛升之日。', 'gold')
      }
    } else {
      state.xp = Math.floor(state.xp * 0.6)
      state.hp = Math.max(1, state.hp - Math.round(40 * hpRatio()))
      addLog('衝擊瓶頸失敗，靈氣逆衝經脈，氣血受損。', 'danger')
    }
    if (ok) { // 氣血、靈力上限提高，增加的部分一併補滿
      state.hp = Math.min(maxHp(), state.hp + Math.max(0, maxHp() - oldHp))
      state.mp = Math.min(maxMp(), state.mp + Math.max(0, maxMp() - oldMp))
    }
    render()
  }

  function toggleSeclusion() {
    state.secluded = !state.secluded
    addLog(state.secluded ? '你封閉洞府，開始閉關苦修。' : '你推開石門，結束閉關。', state.secluded ? 'normal' : 'gold')
    render()
  }

  function castSkill(skill) {
    if ((state.cooldowns[skill.id] || 0) > 0 || state.mp < skill.cost) return
    state.mp -= skill.cost
    state.cooldowns[skill.id] = skill.cooldown
    addLog(`施展「${skill.name}」—— ${skill.description}。`, 'success')
    render()
  }

  function useItem(id) {
    const qty = state.inventory[id] || 0
    const def = ITEMS[id]
    if (qty <= 0 || !def || !def.effect) return
    if (def.effect.type === 'hatch') {
      if (state.pets.length >= MAX_PETS) { addLog(`靈寵已達上限 ${MAX_PETS} 隻，請先放生部分靈寵。`, 'danger'); return refreshAfterItem() }
      consumeItem(id)
      const p = hatchEgg(def.effect.grade)
      const g = PET_GRADES[p.grade]
      addLog(`${def.name}破殼而出——獲得${g.label}靈寵「${petTpl(p).icon} ${petTpl(p).name}」（${realmText(p.realm, p.layer)}，資質上限：${REALMS[p.cap]}期）！`, 'gold')
      return refreshAfterItem()
    }
    if (def.effect.type === 'feedPet') {
      const p = activePet()
      if (!p) { addLog('尚無出戰靈寵，請先到「靈寵」分頁指定出戰靈寵再餵食。', 'danger'); return refreshAfterItem() }
      return feedPet(p.uid, id)
    }
    consumeItem(id)
    const effects = Array.isArray(def.effect) ? def.effect : [def.effect]
    const pillMul = 1 + sectBonus('pill') // 丹鼎谷：丹藥回復與修為效果加成
    const notes = []
    for (const ef of effects) {
      if (ef.type === 'restoreMp') {
        const v = Math.round(ef.value * pillMul * mpRatio()); state.mp = Math.min(maxMp(), state.mp + v); notes.push(`靈力 +${v}`)
      } else if (ef.type === 'restoreHp') {
        const v = Math.round(ef.value * pillMul * hpRatio()); state.hp = Math.min(maxHp(), state.hp + v); notes.push(ef.value >= 9999 ? '氣血全滿' : `氣血 +${v}`)
      } else if (ef.type === 'restoreAll') {
        state.hp = maxHp(); state.mp = maxMp(); notes.push('氣血靈力全滿')
      } else if (ef.type === 'addXpPercent') {
        const req = required(), v = xpGain(req * ef.value * pillMul)
        state.xp = Math.min(req, state.xp + v); notes.push(`修為 +${v}`)
      } else if (ef.type === 'buff') {
        const cur = state.buffs[ef.stat]
        // 同類增益取數值較高者，並刷新為較長的時間
        state.buffs[ef.stat] = { value: Math.max(ef.value, cur ? cur.value : 0), left: Math.max(ef.sec, cur ? cur.left : 0) }
        notes.push(`${BUFF_LABELS[ef.stat]} +${Math.round(ef.value * 100)}%，持續 ${ef.sec} 息`)
      } else if (ef.type === 'breakBonus') {
        state.breakBonus = Math.max(state.breakBonus || 0, ef.value); notes.push(`下次突破機率 +${Math.round(state.breakBonus * 100)}%`)
      } else if (ef.type === 'stones') {
        const v = randomInt(ef.min, ef.max); state.stones += v; notes.push(`獲得 ${v} 靈石`)
      } else if (ef.type === 'jade') {
        const v = randomInt(ef.min, ef.max); state.jade += v; notes.push(`獲得 ${v} 仙玉`)
      } else if (ef.type === 'lootbox') {
        const got = rollLootbox(ef.rolls); got.forEach((l) => addItem(l.item, l.qty)); notes.push(`開出 ${lootText(got)}`)
      }
    }
    const verb = ['bag', 'treasure'].includes(def.type) && effects.some((e) => ['stones', 'jade', 'lootbox'].includes(e.type)) ? '打開' : '使用'
    addLog(`${verb}「${def.name}」：${notes.join('，')}。`, effects.some((e) => ['addXpPercent', 'breakBonus', 'lootbox', 'jade'].includes(e.type)) ? 'gold' : 'success')
    refreshAfterItem()
  }

  function sellItem(id) {
    const qty = state.inventory[id] || 0
    const def = ITEMS[id]
    if (qty <= 0 || !def) return
    consumeItem(id)
    const price = sellPrice(id)
    state.stones += price
    addLog(`售出「${def.name}」，獲得 ${price} 靈石。`)
    render()
    if (state.nav === 'bag' || state.nav === 'market' || state.nav === 'auction') renderInfo()
  }

  function buyItem(id) {
    const def = ITEMS[id]
    if (!def || !def.buy) return
    const wallet = def.currency === 'jade' ? 'jade' : 'stones'
    const price = buyPrice(id)
    if (state[wallet] < price) {
      addLog(`${wallet === 'jade' ? '仙玉' : '靈石'}不足，無法購買「${def.name}」。`, 'danger')
      render()
      if (state.nav === 'market') renderInfo()
      return
    }
    state[wallet] -= price
    addItem(id, 1)
    addLog(`花費 ${price} ${wallet === 'jade' ? '仙玉' : '靈石'}，購得「${def.name}」。`, 'gold')
    render()
    if (state.nav === 'bag' || state.nav === 'market') renderInfo()
  }

  function exchangeCurrency(amount) {
    const rate = 500
    const jadeGain = Math.floor(amount / rate)
    if (jadeGain <= 0) {
      addLog('靈石數量不足以兌換仙玉。', 'danger')
      render()
      if (state.nav === 'market') renderInfo()
      return
    }
    const cost = jadeGain * rate
    if (state.stones < cost) {
      addLog('靈石不足，無法完成兌換。', 'danger')
      render()
      if (state.nav === 'market') renderInfo()
      return
    }
    state.stones -= cost
    state.jade += jadeGain
    addLog(`以 ${cost} 靈石兌換 ${jadeGain} 仙玉。`, 'gold')
    render()
    if (state.nav === 'market') renderInfo()
  }

  function enterLocation(id) {
    state.selectedLocation = id
    state.battle = null
    renderInfo()
  }
  function backToLocations() {
    state.selectedLocation = null
    state.battle = null
    renderInfo()
  }
  function playerAtkRange() {
    const base = Math.round((8 + state.realm * 10 + state.layer * 2) * (1 + sectBonus('atk') + buffVal('atk')))
    const v = Math.round(base * 0.3)
    return [Math.max(1, base - v), base + v]
  }
  function startBattle(monster) {
    state.battle = { monster, monsterHp: monster.hp, log: [`你與「${monster.name}」遭遇了！`] }
    renderInfo()
  }
  function battleLog(text) {
    state.battle.log.unshift(text)
    if (state.battle.log.length > 6) state.battle.log.pop()
  }
  function attackMonster() {
    if (!state.battle) return
    const [lo, hi] = playerAtkRange()
    const dmg = randomInt(lo, hi)
    state.battle.monsterHp = Math.max(0, state.battle.monsterHp - dmg)
    battleLog(`你攻擊「${state.battle.monster.name}」，造成 ${dmg} 點傷害。`)
    const pet = activePet()
    if (pet && state.battle.monsterHp > 0) {
      const pd = petStrike(pet)
      state.battle.monsterHp = Math.max(0, state.battle.monsterHp - pd)
      battleLog(`靈寵「${petTpl(pet).name}」撲擊，造成 ${pd} 點傷害。`)
    }
    if (state.battle.monsterHp <= 0) return victory()
    const mitigation = Math.round(state.realm * 2 * hpRatio())
    const reduce = Math.min(0.8, sectBonus('def') + buffVal('def')) // 減傷上限 80%
    const mdmg = Math.max(1, Math.round((randomInt(state.battle.monster.atkMin, state.battle.monster.atkMax) - mitigation) * (1 - reduce)))
    state.hp = Math.max(0, state.hp - mdmg)
    battleLog(`「${state.battle.monster.name}」反擊，你受到 ${mdmg} 點傷害。`)
    if (state.hp <= 0) return defeat()
    render()
    renderInfo()
  }
  function victory() {
    const m = state.battle.monster
    const req = required()
    const exp = xpGain(m.exp * (1 + sectBonus('exp')))
    state.xp = Math.min(req, state.xp + exp)
    const loot = rollLoot(m)
    loot.forEach((l) => addItem(l.item, l.qty))
    addLog(`擊敗「${m.name}」，獲得 ${exp} 點修為${loot.length ? `，拾取 ${lootText(loot)}` : ''}。`, 'success')
    if (loot.some((l) => l.item === 'advancedEgg')) addLog('妖獸巢穴中竟藏著一顆高級靈獸蛋！', 'gold')
    const heal = Math.round(maxHp() * sectBonus('lifesteal'))
    if (heal > 0) { state.hp = Math.min(maxHp(), state.hp + heal); addLog(`血煞之力反哺，回復 ${heal} 點氣血。`, 'danger') }
    progressKillQuests(m.id)
    addPetXp(activePet(), m.exp)
    state.battle = null
    render()
    renderInfo()
  }
  function defeat() {
    addLog(`不敵「${state.battle.monster.name}」，你身受重傷，狼狽撤退。`, 'danger')
    state.hp = Math.max(1, Math.round(maxHp() * 0.2))
    state.battle = null
    render()
    renderInfo()
  }
  function fleeBattle() {
    addLog(`你從「${state.battle.monster.name}」身邊脫身而逃。`)
    state.battle = null
    render()
    renderInfo()
  }

  function tick() {
    // 只有在遊戲畫面顯示時才自動運轉
    if ($('game-screen').classList.contains('hidden')) return;

    if (state.isGM) fillGMInventory()
    state.mp = Math.min(maxMp(), state.mp + Math.max(1, Math.round(((state.secluded ? 1 : 2) + sectBonus('mpRegen')) * mpRatio())))
    state.hp = Math.min(maxHp(), state.hp + Math.max(1, Math.round((1 + sectBonus('hpRegen')) * hpRatio())))
    for (const k of Object.keys(state.cooldowns)) {
      if (state.cooldowns[k] > 1) state.cooldowns[k]--
      else delete state.cooldowns[k]
    }
    // 限時增益倒數
    for (const [k, b] of Object.entries(state.buffs)) {
      if (--b.left <= 0) { delete state.buffs[k]; addLog(`${BUFF_LABELS[k] || k}增益的效力消散了。`) }
    }
    if (state.secluded) {
      const req = required()
      if (state.xp >= req) {
        state.secluded = false
        addLog('修為已至圓滿，你緩緩出關，準備衝擊瓶頸。', 'gold')
      } else {
        state.xp = Math.min(req, state.xp + req * 0.03 / xpSlow() * (1 + sectBonus('cultivate') + buffVal('cultivate')))
        state.stones = Math.max(0, state.stones - 2)
      }
    }

    if (++net.tickN % 5 === 0) pushSave() // 每 5 秒同步到伺服器
    tickTimers()
    render()
  }

  $('btnCultivate').addEventListener('click', cultivate)
  $('btnBreak').addEventListener('click', breakthrough)
  $('btnSeclude').addEventListener('click', toggleSeclusion)
  $('btnSave').addEventListener('click', () => saveGame(false))
  $('nav').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-nav]')
  if (!btn) return

  // 如果點到的是「背包」，就開啟彈跳視窗並結束，不切換右側面板
  if (btn.dataset.nav === 'bag') {
    openBagModal()
    return
  }

  state.nav = btn.dataset.nav
  renderNav()
  renderInfo()
})

// 綁定彈窗右上角的「關閉」按鈕
$('closeBagBtn').addEventListener('click', () => {
  $('bag-modal').classList.add('hidden')
})

// （選用）點擊彈窗外圍的半透明黑底時，也能自動關閉視窗
$('bag-modal').addEventListener('click', (e) => {
  if (e.target === $('bag-modal')) {
    $('bag-modal').classList.add('hidden')
  }
})
  $('infoBody').addEventListener('click', (e) => {
    const nbRate = e.target.closest('[data-net-bid-rate]')
    if (nbRate) return netBidWithRate(nbRate.dataset.netBidRate, nbRate.dataset.rate)
    const useBtn = e.target.closest('[data-use-item]')
    if (useBtn) return useItem(useBtn.dataset.useItem)
    const sellBtn = e.target.closest('[data-sell-item]')
    if (sellBtn) return sellItem(sellBtn.dataset.sellItem)
    const buyBtn = e.target.closest('[data-buy-item]')
    if (buyBtn) return buyItem(buyBtn.dataset.buyItem)
    const exchangeBtn = e.target.closest('[data-exchange]')
    if (exchangeBtn) {
      const input = $('exchangeAmount')
      const amt = Math.max(0, Math.floor(Number(input && input.value) || 0))
      return exchangeCurrency(amt)
    }
    const locBtn = e.target.closest('[data-location]')
    if (locBtn) return enterLocation(locBtn.dataset.location)
    const backBtn = e.target.closest('[data-back-location]')
    if (backBtn) return backToLocations()
    const challengeBtn = e.target.closest('[data-monster]')
    if (challengeBtn) {
      const loc = LOCATIONS.find((l) => l.id === state.selectedLocation)
      const mon = loc && loc.monsters.find((m) => m.id === challengeBtn.dataset.monster)
      if (mon) startBattle(mon)
      return
    }
    const atkBtn = e.target.closest('[data-attack]')
    if (atkBtn) return attackMonster()
    const fleeBtn = e.target.closest('[data-flee]')
    if (fleeBtn) return fleeBattle()
    const sectEl = e.target.closest('[data-sect]')
    if (sectEl) return joinSect(sectEl.dataset.sect)
    const sectTab = e.target.closest('[data-sect-tab]')
    if (sectTab) { state.sectTab = sectTab.dataset.sectTab; return renderInfo() }
    if (e.target.closest('[data-sect-leave]')) return leaveSect()
    const qAccept = e.target.closest('[data-quest-accept]')
    if (qAccept) return acceptQuest(qAccept.dataset.questAccept)
    const qDone = e.target.closest('[data-quest-done]')
    if (qDone) return completeQuest(qDone.dataset.questDone)
    const qAbandon = e.target.closest('[data-quest-abandon]')
    if (qAbandon) return abandonQuest(qAbandon.dataset.questAbandon)
    const sectBuy = e.target.closest('[data-sect-buy]')
    if (sectBuy) return buySectItem(sectBuy.dataset.sectBuy)
    const hatchBtn = e.target.closest('[data-hatch]')
    if (hatchBtn) return useItem(hatchBtn.dataset.hatch)
    const feedBtn = e.target.closest('[data-pet-feed]')
    if (feedBtn) return feedPet(feedBtn.dataset.petFeed, feedBtn.dataset.feed)
    const petActBtn = e.target.closest('[data-pet-active]')
    if (petActBtn) return toggleActivePet(petActBtn.dataset.petActive)
    const petRelBtn = e.target.closest('[data-pet-release]')
    if (petRelBtn) return releasePet(petRelBtn.dataset.petRelease)
    if (e.target.closest('[data-net-list]')) return netList()
    const pv = e.target.closest('[data-pvp]')
    if (pv) return challengePlayer(pv.dataset.pvp)
    const wh = e.target.closest('[data-whisper]')
    if (wh) { const i = $('chatInput'); if (i) { i.value = `/w ${wh.dataset.whisper} `; i.focus() } return }
    if (e.target.closest('[data-boss-attack]')) return attackBoss()
  })
  $('infoBody').addEventListener('submit', (e) => {
    if (e.target.id !== 'chatForm') return
    e.preventDefault()
    const i = $('chatInput'); const v = i.value; i.value = ''
    sendChat(v)
  })
  $('skills').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-skill]')
    if (btn) castSkill(SKILLS[Number(btn.dataset.skill)])
  })
  window.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, [contenteditable="true"]')) return
    const i = Number(e.key) - 1
    if (i >= 0 && i < SKILLS.length) castSkill(SKILLS[i])
  })
  window.addEventListener('beforeunload', () => {
    if (isOnline()) navigator.sendBeacon('/api/save', new Blob([JSON.stringify({ token: net.token, save: snapshot() })], { type: 'application/json' }))
  })

  setInterval(tick, 1000)
</script>
</body>
</html>
