<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>修仙亂亂修</title>
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }

  /* 封面首頁容器：鎖死 1920x1080 居中顯示 */
  #start-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: url('bg.jpg') no-repeat center center;
    background-size: cover;
    z-index: 10;
  }

  /* 針對 1920x1080 解析度精準定位的開始按鈕 */
  .start-btn {
  position: absolute;
  /* 針對 1920x1080 畫面上的「開始遊戲」按鈕位置微調 */
  bottom: 40px; /* 距離底部的高度 */
  left: 450px;   /* 距離左側的距離（從原本的 720px 改到左邊） */
  width: 320px;  /* 按鈕寬度 */
  height: 93px;  /* 按鈕高度 */
  background: rgba(255, 0, 0, 0.4); /* 半透明紅色方便你確認位置 */
  border: 2px solid yellow; /* 黃框 */
  cursor: pointer;
  z-index: 20;
}

  #game-canvas {
    display: none;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>

  <!-- 首頁封面 -->
  <div id="start-screen">
    <button class="start-btn" onclick="startGame()"></button>
  </div>

  <!-- 遊戲畫布 -->
  <canvas id="game-canvas"></canvas>

  <script>
    function startGame() {
      // 1. 隱藏首頁封面
      document.getElementById('start-screen').style.display = 'none';
      
      // 2. 顯示遊戲畫面
      const canvas = document.getElementById('game-canvas');
      canvas.style.display = 'block';

      // 3. 這裡放入你原本的遊戲初始化與繪製邏輯
      initGame();
    }

    function initGame() {
      console.log("成功進入遊戲，開始與後端連線！");
      // TODO: 載入你的遊戲 Canvas 渲染與 API 連線程式碼
    }
  </script>
</body>
</html>
