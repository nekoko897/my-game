<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#14232b" />
<meta name="color-scheme" content="dark" />
<title>問道長生 · 修仙界</title>
<meta name="description" content="修仙風格的 RPG：在地圖上探索、擊殺妖獸、掉寶升級、突破境界。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  /* 墨青 · 宣紙 · 翡翠 · 鎏金 · 硃砂 */
  :root {
    --background: oklch(0.17 0.025 220);
    --foreground: oklch(0.93 0.02 95);
    --card: oklch(0.21 0.028 215);
    --primary: oklch(0.76 0.11 165);
    --secondary: oklch(0.25 0.028 215);
    --muted-fg: oklch(0.72 0.02 200);
    --accent: oklch(0.83 0.12 85);
    --destructive: oklch(0.62 0.19 30);
    --border: oklch(0.76 0.11 165 / 20%);
    --radius: 6px;
    --sans: 'Noto Sans TC', sans-serif;
    --serif: 'Noto Serif TC', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--background); color: var(--foreground); font-family: var(--sans); -webkit-font-smoothing: antialiased; width: 100%; height: 100%; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul, ol { list-style: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .serif { font-family: var(--serif); }
  .muted { color: var(--muted-fg); }
  .xs { font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }

  /* 畫面切換控制 */
  .screen { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hidden { display: none !important; }
  #game-screen { overflow-y: auto; }

  /* 首頁封面樣式 */
  #start-screen {
    background-image: url('bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 10;
  }
  .clickable-area { position: absolute; background: transparent; border: none; cursor: pointer; outline: none; }
  .clickable-area:hover { box-shadow: 0 0 15px rgba(255, 255, 255, 0.6); border-radius: 8px; }
  /* 圖片上的按鈕精確位置（可依你的圖片位置微調百分比） */
  #btn-start { bottom: 1%; left: 22.8%; width: 17%; height: 12%; }
  #btn-settings-home { bottom: 1%; right: 22.8%; width: 17%; height: 12%; }

  .app { position: relative; min-height: 100dvh; overflow: hidden; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .veil { position: absolute; inset: 0; background: color-mix(in oklch, var(--background) 55%, transparent); }
  .shell { position: relative; max-width: 1360px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 16px; padding: 12px; }
  .grid { flex: 1; min-height: 0; display: grid; gap: 16px; }
  @media (min-width: 768px) { .shell { padding: 16px; } }
  @media (min-width: 1024px) {
    .shell { height: 100dvh; }
    .grid { grid-template-columns: 180px 1fr 300px; }
  }

  .panel {
    background: color-mix(in oklch, var(--card) 80%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow:
      inset 0 0 0 3px color-mix(in oklch, var(--background) 70%, transparent),
      inset 0 0 0 4px color-mix(in oklch, var(--accent) 22%, transparent);
  }
  .panel-title { font-family: var(--serif); font-size: 14px; font-weight: 700; letter-spacing: .4em; color: var(--accent); margin-bottom: 14px; }

  /* Top bar */
  .top { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  @media (min-width: 768px) { .top { flex-direction: row; align-items: center; justify-content: space-between; gap: 24px; } }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; border: 2px solid color-mix(in oklch, var(--accent) 60%, transparent); flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name-row { display: flex; align-items: baseline; gap: 8px; }
  .name-row h1 { font-family: var(--serif); font-size: 20px; font-weight: 700; letter-spacing: .1em; }
  .realm-line { font-family: var(--serif); font-size: 14px; color: var(--accent); }
  .stats { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  @media (min-width: 768px) { .stats { max-width: 448px; } }
  .stat { display: flex; align-items: center; gap: 8px; }
  .stat-label { width: 32px; flex-shrink: 0; font-family: var(--serif); font-size: 12px; color: var(--muted-fg); }
  .track { position: relative; flex: 1; height: 10px; overflow: hidden; border-radius: 999px; background: color-mix(in oklch, var(--background) 70%, transparent); box-shadow: 0 0 0 1px var(--border); }
  .fill { height: 100%; border-radius: 999px; transition: width .2s; }
  .stat-val { width: 64px; flex-shrink: 0; text-align: right; font-size: 12px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .wallet { display: flex; align-items: center; gap: 12px; }
  .wallet dl { display: flex; gap: 16px; font-size: 14px; }
  .wallet dl > div { display: flex; align-items: center; gap: 6px; }
  .wallet dt { display: flex; align-items: center; gap: 4px; color: var(--muted-fg); }
  .wallet dd { font-weight: 500; font-variant-numeric: tabular-nums; }
  .icon { width: 16px; height: 16px; flex-shrink: 0; }
  .icon-btn { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); color: var(--muted-fg); transition: color .2s, border-color .2s; }
  .icon-btn:hover { color: var(--accent); border-color: color-mix(in oklch, var(--accent) 60%, transparent); }

  /* Side nav */
  .nav { padding: 8px; }
  .nav ul { display: flex; gap: 4px; overflow-x: auto; }
  @media (min-width: 1024px) { .nav ul { flex-direction: column; } }
  .nav li { flex-shrink: 0; }
  .nav button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius); font-family: var(--serif); font-size: 14px; letter-spacing: .3em; color: var(--muted-fg); transition: background .2s, color .2s; }
  .nav button:hover { background: var(--secondary); color: var(--foreground); }
  .nav button[aria-current="page"] { background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); box-shadow: 0 0 0 1px color-mix(in oklch, var(--primary) 40%, transparent); }

  /* 中央：遊戲地圖舞台 */
  main { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
  .stage { position: relative; height: 56vh; min-height: 300px; overflow: hidden; border-radius: var(--radius); border: 1px solid var(--border); background: #070b0e; touch-action: none; }
  @media (min-width: 1024px) { .stage { flex: 1; height: auto; } }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage-title { position: absolute; left: 10px; top: 10px; padding: 6px 12px; pointer-events: none; display: flex; align-items: baseline; gap: 8px; }
  .stage-title .bold { font-size: 15px; }
  .stage-hint { position: absolute; left: 10px; right: 10px; bottom: 8px; font-size: 11px; color: rgba(255,255,255,.7); text-shadow: 0 1px 3px #000; pointer-events: none; }

  .ctrl { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .xp-row { display: flex; align-items: center; gap: 10px; }
  .xp-row .stat-label { width: auto; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .btn { min-width: 96px; padding: 8px 18px; border-radius: var(--radius); font-family: var(--serif); letter-spacing: .3em; transition: background .2s, opacity .2s, color .2s; }
  .btn:disabled { opacity: .4; }
  .btn-primary { border: 1px solid color-mix(in oklch, var(--primary) 50%, transparent); background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); }
  .btn-primary:not(:disabled):hover { background: color-mix(in oklch, var(--primary) 25%, transparent); }
  .btn-gold { background: var(--accent); color: var(--background); font-weight: 700; }
  .btn-gold:disabled { opacity: .3; }
  .btn-gold:not(:disabled):hover { opacity: .9; }
  .btn-gold small { margin-left: 8px; font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0; }
  .btn-ghost { border: 1px solid var(--border); color: var(--muted-fg); }
  .btn-ghost:hover:not(:disabled) { color: var(--foreground); }
  .btn-ghost[aria-pressed="true"] { border-color: color-mix(in oklch, var(--accent) 60%, transparent); color: var(--accent); }

  /* Right column */
  .right { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .info { padding: 16px; overflow-y: auto; }
  @media (min-width: 1024px) { .info { flex: 1.3; min-height: 0; } }
  .attr { display: flex; flex-direction: column; gap: 4px; }
  .attr + .attr { margin-top: 12px; }
  .attr-head { display: flex; align-items: baseline; justify-content: space-between; }
  .attr-head dt { font-family: var(--serif); font-size: 14px; }
  .attr-head dd { font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .mini-track { height: 4px; border-radius: 999px; overflow: hidden; background: color-mix(in oklch, var(--background) 70%, transparent); }
  .mini-track div { height: 100%; background: color-mix(in oklch, var(--primary) 70%, transparent); }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--background) 40%, transparent); padding: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .col { display: flex; flex-direction: column; }
  .bold { font-family: var(--serif); font-size: 14px; font-weight: 700; }
  .seal { width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid var(--destructive); color: var(--destructive); font-family: var(--serif); }
  .tech { display: flex; align-items: flex-start; gap: 12px; }
  .small-btn { padding: 6px 12px; border-radius: var(--radius); border: 1px solid color-mix(in oklch, var(--primary) 50%, transparent); color: var(--primary); font-family: var(--serif); font-size: 12px; letter-spacing: .1em; white-space: nowrap; }
  .small-btn:not(:disabled):hover { background: color-mix(in oklch, var(--primary) 15%, transparent); }
  .small-btn:disabled { opacity: .4; }
  .sect-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* 背包 / 物品 */
  .cluster { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .item-list { display: flex; flex-direction: column; gap: 10px; }
  .item-card { display: flex; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--background) 40%, transparent); padding: 10px; }
  .item-icon { width: 40px; height: 40px; flex-shrink: 0; border-radius: var(--radius); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; background: color-mix(in oklch, var(--background) 60%, transparent); }
  .monster-chip { display: inline-flex; align-items: center; gap: 2px; margin: 2px 8px 0 0; }

  /* 交易所 / 拍賣場輸入框 */
  .exchange-input { flex: 1; background: color-mix(in oklch, var(--background) 60%, transparent); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--foreground); font: inherit; min-width: 0; }
  .exchange-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select.exchange-input { cursor: pointer; }

  /* 宗門選擇卡片 */
  .sect-card { cursor: pointer; transition: border-color .2s, background .2s; }
  .sect-card:hover { border-color: color-mix(in oklch, var(--primary) 50%, transparent); }
  .sect-card.selected { border-color: color-mix(in oklch, var(--accent) 60%, transparent); background: color-mix(in oklch, var(--accent) 8%, transparent); }

  .log-wrap { display: flex; flex-direction: column; height: 220px; min-height: 0; }
  @media (min-width: 1024px) { .log-wrap { height: auto; flex: 1; } }
  .log { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 16px; }
  .log ol { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; font-size: 13px; line-height: 1.6; }
  .log li { border-left: 1px solid var(--border); padding-left: 12px; animation: log-in .3s ease-out; }
  .tone-normal { color: color-mix(in oklch, var(--foreground) 80%, transparent); }
  .tone-success { color: var(--primary); }
  .tone-danger { color: var(--destructive); }
  .tone-gold { color: var(--accent); }

  /* Skill bar */
  .skills { padding: 12px; }
  .skills ul { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 640px) { .skills ul { grid-template-columns: repeat(4, 1fr); } }
  .skill { position: relative; width: 100%; display: flex; align-items: center; gap: 12px; overflow: hidden; padding: 8px; text-align: left; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--background) 40%, transparent); transition: border-color .2s; }
  .skill:not(:disabled):hover { border-color: color-mix(in oklch, var(--primary) 50%, transparent); }
  .skill .seal { width: 40px; height: 40px; border-width: 2px; font-size: 18px; font-weight: 900; }
  .skill:disabled .seal { opacity: .4; }
  .skill:disabled .skill-text { opacity: .5; }
  .skill-text { display: flex; flex-direction: column; min-width: 0; }
  .skill-text .bold { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  kbd { font-family: var(--sans); }
  .cd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: color-mix(in oklch, var(--background) 70%, transparent); font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

  @keyframes log-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .log li { animation: none !important; } }
</style>
</head>
<body>

<!-- 1. 遊戲首頁畫面（封面） -->
<div id="start-screen" class="screen">
  <button id="btn-start" class="clickable-area" onclick="enterGame()" aria-label="開始遊戲"></button>
  <button id="btn-settings-home" class="clickable-area" onclick="alert('開啟設定選單')" aria-label="設定"></button>
</div>

<!-- 2. 遊戲主畫面（預設隱藏 .hidden） -->
<div id="game-screen" class="screen hidden">
  <div class="app">
    <img class="bg" src="./img/scene-peaks.png" alt="" />
    <div class="veil" aria-hidden="true"></div>

    <div class="shell">
      <header class="panel top">
        <div class="who">
          <div class="avatar"><img src="./img/cultivator.png" alt="角色頭像：雲逸" /></div>
          <div class="col">
            <div class="name-row">
              <h1>雲逸</h1>
              <span class="xs muted" id="sectBadge">青雲宗 · 內門弟子</span>
            </div>
            <p class="realm-line" id="realmLine"></p>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-label">氣血</span>
            <div class="track" role="progressbar" aria-label="氣血" aria-valuemin="0" id="hpBar">
              <div class="fill" style="background: var(--destructive)"></div>
            </div>
            <span class="stat-val" id="hpVal"></span>
          </div>
          <div class="stat">
            <span class="stat-label">靈力</span>
            <div class="track" role="progressbar" aria-label="靈力" aria-valuemin="0" id="mpBar">
              <div class="fill" style="background: var(--primary)"></div>
            </div>
            <span class="stat-val" id="mpVal"></span>
          </div>
        </div>

        <div class="wallet">
          <dl>
            <div>
              <dt><svg class="icon" style="color: var(--primary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/></svg>靈石</dt>
              <dd id="stones"></dd>
            </div>
            <div>
              <dt><svg class="icon" style="color: var(--accent)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/></svg>仙玉</dt>
              <dd id="jade"></dd>
            </div>
          </dl>
          <button type="button" class="icon-btn" id="btnSave" aria-label="儲存進度" title="儲存進度">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7H7v7"/><path d="M7 3v4h8"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btnLoad" aria-label="讀取進度" title="讀取進度">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          </button>
        </div>
      </header>

      <div class="grid">
        <aside>
          <nav class="panel nav" aria-label="遊戲選單"><ul id="nav"></ul></nav>
        </aside>

        <main>
          <section class="stage" id="stage" aria-label="遊戲地圖">
            <canvas id="game"></canvas>
            <div class="stage-title panel"><span class="bold" id="mapName"></span><span class="xs muted" id="mapSub"></span></div>
            <p class="stage-hint">WASD／方向鍵移動 · 空白鍵攻擊 · 1–4 功法 · E 互動 · Q 打坐 · Z 回春丹 · X 回氣丹 · 滑鼠點地面移動、點怪物攻擊</p>
          </section>
          <section class="panel ctrl" aria-label="修為與操作">
            <div class="xp-row">
              <span class="stat-label">修為</span>
              <div class="track" role="progressbar" aria-label="修為" aria-valuemin="0" id="xpBar"><div class="fill" style="background: var(--accent)"></div></div>
              <span class="stat-val" id="xpVal" style="width:96px"></span>
            </div>
            <div class="actions">
              <button type="button" class="btn btn-primary" id="btnAttack">攻擊</button>
              <button type="button" class="btn btn-gold" id="btnBreak">突破<small id="chance"></small></button>
              <button type="button" class="btn btn-ghost" id="btnSit" aria-pressed="false">打坐</button>
              <button type="button" class="btn btn-ghost" id="btnHome">回城</button>
            </div>
          </section>
        </main>

        <aside class="right">
          <section class="panel info" aria-labelledby="info-title">
            <h2 class="panel-title" id="info-title"></h2>
            <div id="infoBody"></div>
          </section>
          <div class="log-wrap">
            <section class="panel log" aria-labelledby="log-title">
              <h2 class="panel-title" id="log-title" style="margin-bottom:12px">修仙日誌</h2>
              <ol id="log" aria-live="polite"></ol>
            </section>
          </div>
        </aside>
      </div>

      <section class="panel skills" aria-label="功法快捷欄"><ul id="skills"></ul></section>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
 *  問道長生 · 修仙 RPG
 *  ──────────────────────────────────────────────────────────────────────
 *  檔案結構（想改哪裡，直接搜尋下面的標題）：
 *   一、基礎數值設定      ← 移動速度、攻擊距離、死亡懲罰、各種常數
 *   二、功法 SKILLS       ← 新增／修改功法與效果
 *   三、道具 ITEMS        ← 新增／修改道具、商店、拍賣池
 *   四、宗門 SECTS        ← 新增／修改宗門與加成
 *   五、怪物 MONSTERS     ← 新增／修改怪物（血量、攻擊、掉落…）
 *   六、地形 TILES        ← 新增地形字元（地圖用的「圖例」）
 *   七、地圖 MAPS         ← ★ 新增地圖關卡主要改這裡 ★
 *   八、以下是遊戲程式（一般不用改）
 * ========================================================================== */


/* ==========================================================================
 * 一、基礎數值設定
 * ========================================================================== */
const REALMS = ['煉氣', '築基', '金丹', '元嬰', '化神', '渡劫', '大乘']   // 境界名稱（陣列索引 = 境界編號，地圖的 reqRealm 對應這裡）
const NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九']          // 層數的中文數字

/* ==========================================================================
 * 八、以下是遊戲程式（一般不用改）
 * ========================================================================== */

/* ---------- 玩家資料（新遊戲的初始數值；有存檔時會被存檔覆蓋） ---------- */
const state = {
  realm: 1, layer: 3, xp: 120, hp: 220, mp: 86,   // 境界編號、層數、修為、氣血、靈力
  stones: 12860, jade: 36,                          // 靈石、仙玉
  cooldowns: {}, nav: 'character',
  inventory: { heal: 5, qi: 5, foundation: 2, spiritGrass: 3 },   // 初始背包：道具id → 數量
  sect: 'qingyun', contribution: 1280,
  auctions: [], playerListings: [],
}

/* 即時運作中的資料（不會存檔） */
const player = { x: 0, y: 0, face: { x: 1, y: 0 }, atkCd: 0, iframes: 0, shield: 0, shieldT: 0, target: null, sitting: false, portalLock: true, portalMsgCd: 0, returnCd: 0, stuckT: 0 }
let world = null           // 目前所在的地圖（loadMap 建立）
let started = false        // 是否已按下開始遊戲
let pendingDeath = null    // 本幀被擊倒時記錄是誰
let hoverMonster = null, hoverNpc = null
const keys = {}

const $ = (id) => document.getElementById(id)
const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min
const rarityColor = (r) => ({ '普通': 'var(--muted-fg)', '精良': 'var(--primary)', '稀有': 'var(--accent)', '史詩': 'var(--destructive)' }[r] || 'var(--muted-fg)')
const required = () => Math.round(100 * Math.pow(1.6, state.realm) * (1 + state.layer * 0.25))
const chance = () => {
  const base = state.layer === MAX_LAYER ? 0.55 - state.realm * 0.05 : 0.92 - state.layer * 0.03
  return Math.max(0.2, Math.min(0.95, base))
}
const currentSect = () => SECTS.find((s) => s.id === state.sect) || SECTS[0]
const sectMods = () => Object.assign({ atkMul: 1, maxHpMul: 1, dropMul: 1, killMp: 0 }, currentSect().mods)
const maxHp = () => Math.round((MAX_HP + state.realm * HP_PER_REALM) * sectMods().maxHpMul)
const maxMp = () => MAX_MP + state.realm * MP_PER_REALM
const startMapId = () => (MAPS[START_MAP] ? START_MAP : Object.keys(MAPS)[0])
const canTrade = () => !!(world && world.def.town)

function playerAtkRange() {
  const base = (8 + state.realm * 10 + state.layer * 2) * sectMods().atkMul
  const v = Math.round(base * 0.3)
  return [Math.max(1, Math.round(base - v)), Math.round(base + v)]
}
function rollPlayerDamage(mul = 1) {
  const [lo, hi] = playerAtkRange()
  let dmg = randomInt(lo, hi) * mul
  const crit = Math.random() < CRIT_CHANCE
  if (crit) dmg *= CRIT_MULTIPLIER
  return { dmg: Math.max(1, Math.round(dmg)), crit }
}

function addItem(id, qty = 1) { state.inventory[id] = (state.inventory[id] || 0) + qty }

function createAuctionListing(id) {
  const pick = AUCTION_POOL[randomInt(0, AUCTION_POOL.length - 1)]
  const base = Math.max(10, pick.base + randomInt(-5, 15))
  return { id, item: pick.item, qty: randomInt(1, 2), currentBid: base, highestBidder: null, timeLeft: randomInt(45, 90), increment: Math.max(5, Math.round(base * 0.12)) }
}
state.auctions = ['a1', 'a2', 'a3'].map(createAuctionListing)


/* ---------- 資料檢查：新增地圖／怪物／道具設定錯誤時，開始遊戲會在日誌用紅字提示 ---------- */
function validateGameData() {
  const w = []
  const EFFECTS = ['restoreHp', 'restoreMp', 'addXpPercent']
  const ACTIONS = ['market', 'auction', 'sect', 'heal', 'talk']
  if (!MAPS[START_MAP]) w.push(`START_MAP「${START_MAP}」不存在於 MAPS`)
  for (const [id, it] of Object.entries(ITEMS)) if (it.effect && !EFFECTS.includes(it.effect.type)) w.push(`道具「${id}」的 effect.type「${it.effect.type}」不存在`)
  for (const id of SHOP_ITEMS) if (!ITEMS[id] || !ITEMS[id].buy) w.push(`SHOP_ITEMS 的「${id}」不存在，或沒有設定 buy 價格`)
  for (const a of AUCTION_POOL) if (!ITEMS[a.item]) w.push(`AUCTION_POOL 的道具「${a.item}」不存在於 ITEMS`)
  if (!ITEMS[QUICK_HP_ITEM]) w.push(`QUICK_HP_ITEM「${QUICK_HP_ITEM}」不存在於 ITEMS`)
  if (!ITEMS[QUICK_MP_ITEM]) w.push(`QUICK_MP_ITEM「${QUICK_MP_ITEM}」不存在於 ITEMS`)
  for (const [id, m] of Object.entries(MONSTERS)) for (const l of m.loot || []) if (!ITEMS[l.item]) w.push(`怪物「${id}」的掉落道具「${l.item}」不存在於 ITEMS`)
  for (const [id, m] of Object.entries(MAPS)) {
    const tag = `地圖「${id}」`
    if (!Array.isArray(m.tiles) || !m.tiles.length) { w.push(`${tag}沒有 tiles`); continue }
    const width = m.tiles[0].length
    m.tiles.forEach((r, y) => {
      if (r.length !== width) w.push(`${tag}第 ${y} 行長度 ${r.length}，與第 0 行（${width}）不同`)
      for (const ch of r) if (!TILES[ch]) { w.push(`${tag}第 ${y} 行有未定義的地形字元「${ch}」`); break }
    })
    const walkable = (x, y) => { const ch = m.tiles[y] && m.tiles[y][x]; return ch !== undefined && TILES[ch] && !TILES[ch].solid }
    const inMap = (x, y) => y >= 0 && y < m.tiles.length && x >= 0 && x < width
    if (!m.spawn || !walkable(m.spawn.x, m.spawn.y)) w.push(`${tag}的 spawn 不是可走的格子`)
    if ((m.reqRealm || 0) >= REALMS.length) w.push(`${tag}的 reqRealm 超出 REALMS 範圍`)
    for (const p of m.portals || []) {
      if (!walkable(p.x, p.y)) w.push(`${tag}的傳送點 (${p.x},${p.y}) 不是可走的格子`)
      const dest = MAPS[p.to]
      if (!dest) { w.push(`${tag}的傳送點 (${p.x},${p.y}) 目標地圖「${p.to}」不存在`); continue }
      const dch = dest.tiles && dest.tiles[p.ty] && dest.tiles[p.ty][p.tx]
      if (dch === undefined || !TILES[dch] || TILES[dch].solid) w.push(`${tag}的傳送點 (${p.x},${p.y}) 落點 (${p.tx},${p.ty}) 在「${p.to}」不是可走的格子`)
    }
    for (const n of m.npcs || []) {
      if (!walkable(n.x, n.y)) w.push(`${tag}的 NPC「${n.name}」(${n.x},${n.y}) 不在可走的格子上`)
      if (!ACTIONS.includes(n.action)) w.push(`${tag}的 NPC「${n.name}」action「${n.action}」不存在`)
    }
    for (const s of m.spawns || []) {
      if (!MONSTERS[s.monster]) w.push(`${tag}的刷怪區用了不存在的怪物「${s.monster}」`)
      if (!inMap(s.x1, s.y1) || !inMap(s.x2, s.y2)) w.push(`${tag}的「${s.monster}」刷怪範圍超出地圖`)
    }
  }
  return w
}


/* ---------- 存檔／讀檔（localStorage） ---------- */
const SAVE_KEY = 'xiuxian-save-v2'
const OLD_SAVE_KEY = 'xiuxian-save-v1'
function saveGame(silent) {
  if (!started || !world) return
  const data = {
    realm: state.realm, layer: state.layer, xp: state.xp, hp: state.hp, mp: state.mp,
    stones: state.stones, jade: state.jade, inventory: state.inventory,
    sect: state.sect, contribution: state.contribution,
    auctions: state.auctions, playerListings: state.playerListings,
    mapId: world.id, px: Math.round(player.x), py: Math.round(player.y),
  }
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data))
    if (!silent) addLog('已儲存目前進度。', 'gold')
  } catch (e) {
    if (!silent) addLog('儲存失敗，瀏覽器可能不支援本機儲存。', 'danger')
  }
}
function validAuction(a) {
  return a && ITEMS[a.item] && Number.isFinite(a.currentBid) && Number.isFinite(a.timeLeft) && Number.isFinite(a.qty) && Number.isFinite(a.increment)
}
function applySave(d) {
  const num = (v, dflt, min, max) => (Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : dflt)
  state.realm = Math.floor(num(d.realm, state.realm, 0, REALMS.length - 1))
  state.layer = Math.floor(num(d.layer, state.layer, 1, MAX_LAYER))
  state.sect = SECTS.some((s) => s.id === d.sect) ? d.sect : SECTS[0].id
  state.xp = num(d.xp, 0, 0, 1e12)
  state.hp = num(d.hp, maxHp(), 1, maxHp())
  state.mp = num(d.mp, maxMp(), 0, maxMp())
  state.stones = Math.floor(num(d.stones, 0, 0, 1e12))
  state.jade = Math.floor(num(d.jade, 0, 0, 1e12))
  state.contribution = Math.floor(num(d.contribution, 0, 0, 1e12))
  state.inventory = {}
  for (const [id, q] of Object.entries(d.inventory || {})) if (ITEMS[id] && Number.isFinite(q) && q > 0) state.inventory[id] = Math.floor(q)   // 已從 ITEMS 刪除的道具會被丟棄
  if (Array.isArray(d.auctions)) {
    state.auctions = ['a1', 'a2', 'a3'].map((id, i) => (validAuction(d.auctions[i]) ? Object.assign({}, d.auctions[i], { id }) : createAuctionListing(id)))
  }
  state.playerListings = (Array.isArray(d.playerListings) ? d.playerListings : []).filter((l) => l && ITEMS[l.item] && Number.isFinite(l.currentBid) && Number.isFinite(l.timeLeft))
    .map((l) => ({ id: String(l.id || 'p' + Math.random()), item: l.item, qty: Math.max(1, Math.floor(l.qty || 1)), startPrice: l.startPrice || l.currentBid, currentBid: l.currentBid, highestBidder: l.highestBidder || null, timeLeft: l.timeLeft }))
  state.cooldowns = {}
  const mapId = MAPS[d.mapId] ? d.mapId : startMapId()
  loadMap(mapId, Number.isFinite(d.px) && Number.isFinite(d.py) ? { x: d.px, y: d.py } : {})
  player.shield = 0
}
function loadGame(silent) {
  let raw = null
  try { raw = localStorage.getItem(SAVE_KEY) || localStorage.getItem(OLD_SAVE_KEY) } catch (e) { raw = null }
  if (!raw) {
    if (!silent) addLog('尚未找到任何存檔。', 'danger')
    return false
  }
  try {
    applySave(JSON.parse(raw))
    if (!silent) addLog('已讀取存檔進度。', 'gold')
    if (started) { renderNav(); renderInfo(); renderHud() }
    return true
  } catch (e) {
    console.error(e)
    if (!silent) addLog('讀取存檔失敗，存檔資料可能已損毀。', 'danger')
    return false
  }
}


/* ---------- 地圖載入 ---------- */
function solidTile(tx, ty) {
  if (!world || tx < 0 || ty < 0 || tx >= world.w || ty >= world.h) return true
  return !!world.grid[ty][tx].solid
}
function solidPx(x, y) { return solidTile(Math.floor(x / TILE), Math.floor(y / TILE)) }
function blocked(x, y, r) { return solidPx(x - r, y - r) || solidPx(x + r, y - r) || solidPx(x - r, y + r) || solidPx(x + r, y + r) }
function moveEntity(e, dx, dy, r) {
  if (dx && !blocked(e.x + dx, e.y, r)) e.x += dx
  if (dy && !blocked(e.x, e.y + dy, r)) e.y += dy
}
function findWalkableNear(tx, ty) {
  for (let rad = 0; rad <= 10; rad++)
    for (let dy = -rad; dy <= rad; dy++)
      for (let dx = -rad; dx <= rad; dx++)
        if (Math.max(Math.abs(dx), Math.abs(dy)) === rad && !solidTile(tx + dx, ty + dy)) return { x: tx + dx, y: ty + dy }
  for (let y = 0; y < world.h; y++) for (let x = 0; x < world.w; x++) if (!solidTile(x, y)) return { x, y }
  return { x: 1, y: 1 }
}
function nearTile(list, tx, ty, d) { return list.some((o) => Math.abs(o.x - tx) <= d && Math.abs(o.y - ty) <= d) }

function makeMonster(id, zi, x, y) {
  const d = MONSTERS[id]
  return { id, def: d, zi, x, y, homeX: x, homeY: y, hp: d.hp, maxHp: d.hp, r: 11 * (d.size || 1), state: 'idle', atkCd: Math.random(), flash: 0, wanderT: Math.random() * 3, tx: x, ty: y, provoked: false, dead: false }
}
function spawnZoneMonster(zi) {
  const z = world.def.spawns[zi]
  if (!z || !MONSTERS[z.monster]) return null
  for (let tries = 0; tries < 80; tries++) {
    const tx = randomInt(Math.min(z.x1, z.x2), Math.max(z.x1, z.x2)), ty = randomInt(Math.min(z.y1, z.y2), Math.max(z.y1, z.y2))
    if (solidTile(tx, ty) || nearTile(world.portals, tx, ty, 4) || nearTile(world.npcs, tx, ty, 4)) continue
    const x = (tx + 0.5) * TILE, y = (ty + 0.5) * TILE
    if (tries < 60 && Math.hypot(x - player.x, y - player.y) < 200) continue   // 盡量不要刷在玩家身上
    return makeMonster(z.monster, zi, x, y)
  }
  return null
}
function buildMini() {
  const s = Math.max(2, Math.min(4, Math.floor(190 / world.w)))
  const c = document.createElement('canvas')
  c.width = world.w * s; c.height = world.h * s
  const g = c.getContext('2d')
  for (let y = 0; y < world.h; y++) for (let x = 0; x < world.w; x++) { g.fillStyle = world.grid[y][x].color; g.fillRect(x * s, y * s, s, s) }
  world.mini = { c, s }
}
/* opt 可帶 { tx, ty }（格子座標）或 { x, y }（像素座標） */
function loadMap(id, opt = {}) {
  if (!MAPS[id]) id = startMapId()
  const def = MAPS[id]
  const rows = Array.isArray(def.tiles) ? def.tiles : []
  const h = Math.max(1, rows.length), w = Math.max(1, ...rows.map((r) => r.length))
  const grid = []
  for (let y = 0; y < h; y++) {
    const line = []
    for (let x = 0; x < w; x++) {
      const ch = rows[y] && rows[y][x] !== undefined ? rows[y][x] : '#'
      line.push(TILES[ch] || TILES['.'])
    }
    grid.push(line)
  }
  world = {
    id, def, w, h, grid, time: 0, fade: 1, mini: null, banner: 2.6,
    monsters: [], respawns: [], projectiles: [], effects: [],
    npcs: (def.npcs || []).map((n) => Object.assign({}, n, { tx: n.x, ty: n.y, x: (n.x + 0.5) * TILE, y: (n.y + 0.5) * TILE })),

  else {

  }
  Object.assign(player, { x: px, y: py, target: null, sitting: false, portalLock: true, atkCd: 0, iframes: 0, stuckT: 0 })
  ;(def.spawns || []).forEach((z, zi) => { for (let i = 0; i < (z.count || 1); i++) { const m = spawnZoneMonster(zi); if (m) world.monsters.push(m) } })

  }

/* ---------- 特效 ---------- */
function floatText(x, y, text, color, size = 14) { world.effects.push({ type: 'text', x, y, text, color, size, life: 1, max: 1 }) }
function ringFx(x, y, r, color, life = 0.35) { world.effects.push({ type: 'ring', x, y, r, color, life, max: life }) }


/* ---------- 戰鬥 ---------- */
function damageMonster(m, dmg, crit, color) {
  if (m.dead) return
  m.hp -= dmg; m.flash = 0.12; m.provoked = true
  if (m.state !== 'chase') m.state = 'chase'
  floatText(m.x, m.y - m.r - 10, (crit ? '暴擊 ' : '') + dmg, crit ? '#ffb74d' : (color || '#ffffff'), crit ? 20 : 15)
  if (m.hp <= 0) killMonster(m)
}
function killMonster(m) {
  m.dead = true
  const d = m.def, mods = sectMods()
  world.respawns.push({ zi: m.zi, t: d.respawn !== undefined ? d.respawn : 20 })
  const req = required(), before = state.xp
  state.xp = Math.min(req, state.xp + d.exp)
  const st = d.stones || [0, 0]
  const stones = st[1] > 0 ? randomInt(st[0], st[1]) : 0
  state.stones += stones
  const loot = []
  for (const e of d.loot || []) {
    if (ITEMS[e.item] && Math.random() < Math.min(1, e.chance * mods.dropMul)) { const q = randomInt(e.min, e.max); addItem(e.item, q); loot.push({ item: e.item, qty: q }) }
  }
  if (mods.killMp) state.mp = Math.min(maxMp(), state.mp + mods.killMp)
  floatText(m.x, m.y - 30, `+${d.exp} 修為`, '#ffd54f', 14)
  if (stones) floatText(m.x + 30, m.y - 14, `+${stones} 靈石`, '#80cbc4', 13)
  loot.forEach((l, i) => floatText(m.x, m.y - 48 - i * 16, `${ITEMS[l.item].icon} ${ITEMS[l.item].name} ×${l.qty}`, '#b2ff59', 13))
  ringFx(m.x, m.y, 40 * (d.size || 1), '#ffd54f', 0.4)
  const lootText = loot.length ? `，拾取 ${loot.map((l) => `${ITEMS[l.item].name}×${l.qty}`).join('、')}` : ''
  addLog(`${d.boss ? '【BOSS】' : ''}擊敗「${d.name}」，修為 +${d.exp}，靈石 +${stones}${lootText}。`, d.boss ? 'gold' : 'success')
  if (state.xp >= req && before < req) addLog('修為已圓滿，可以嘗試突破了！', 'gold')
  if (player.target && player.target.m === m) player.target = null
  if (state.nav === 'bag') renderInfo()
  renderHud()
}
function damagePlayer(raw, m) {
  if (player.iframes > 0 || pendingDeath) return
  player.sitting = false
  let dmg = Math.max(1, raw - state.realm * 2)
  if (player.shield > 0) {
    const absorb = Math.min(player.shield, dmg)
    player.shield -= absorb; dmg -= absorb
    floatText(player.x + 14, player.y - 30, `吸收 ${absorb}`, '#64b5f6', 13)
  }
  if (dmg > 0) {
    state.hp -= dmg
    floatText(player.x, player.y - 28, `-${dmg}`, '#ff5252', 18)
    ringFx(player.x, player.y, 22, '#ff5252', 0.2)
  }
  if (state.hp <= 0) { state.hp = 0; pendingDeath = m.def.name }
}
function playerDie(by) {
  const loss = Math.floor(state.xp * DEATH_XP_LOSS)
  state.xp -= loss
  state.hp = Math.max(1, Math.round(maxHp() * 0.3))
  const id = startMapId()
  addLog(`你被「${by}」擊倒，修為損失 ${loss}，被傳送回${MAPS[id].name}。`, 'danger')
  loadMap(id, { tx: MAPS[id].spawn.x, ty: MAPS[id].spawn.y })
  saveGame(true)
}

function playerAttack(pref) {
  if (!world || player.atkCd > 0) return
  player.sitting = false
  let m = pref && !pref.dead && Math.hypot(pref.x - player.x, pref.y - player.y) - pref.r <= PLAYER_ATTACK_RANGE ? pref : null
  if (!m) {
    let best = Infinity
    for (const n of world.monsters) {
      if (n.dead) continue
      const d = Math.hypot(n.x - player.x, n.y - player.y) - n.r
      if (d <= PLAYER_ATTACK_RANGE && d < best) { best = d; m = n }
    }
  }
  if (m) { const dx = m.x - player.x, dy = m.y - player.y, d = Math.hypot(dx, dy) || 1; player.face = { x: dx / d, y: dy / d } }
  player.atkCd = PLAYER_ATTACK_COOLDOWN
  world.effects.push({ type: 'slash', x: player.x, y: player.y, ang: Math.atan2(player.face.y, player.face.x), life: 0.18, max: 0.18 })
  if (m) { const r = rollPlayerDamage(1); damageMonster(m, r.dmg, r.crit) }
}
function nearestMonster(range) {
  let best = null, bd = range
  for (const n of world.monsters) { if (n.dead) continue; const d = Math.hypot(n.x - player.x, n.y - player.y); if (d < bd) { bd = d; best = n } }
  return best
}
function castSkill(skill) {
  if (!world || !skill || (state.cooldowns[skill.id] || 0) > 0 || state.mp < skill.cost) return
  const fx = skill.effect || {}
  player.sitting = false
  state.mp -= skill.cost
  state.cooldowns[skill.id] = skill.cooldown
  floatText(player.x, player.y - 40, skill.name, skill.color || '#fff', 15)
  switch (fx.type) {
    case 'projectile': {
      const t = nearestMonster(360)
      if (t) { const dx = t.x - player.x, dy = t.y - player.y, d = Math.hypot(dx, dy) || 1; player.face = { x: dx / d, y: dy / d } }
      const sp = fx.speed || 450
      world.projectiles.push({ x: player.x, y: player.y, vx: player.face.x * sp, vy: player.face.y * sp, speed: sp, dist: 0, range: fx.range || 300, r: fx.radius || 10, dmgMul: fx.dmgMul || 1.5, color: skill.color || '#ff7043' })
      break
    }
    case 'dash': {
      const steps = Math.ceil((fx.distance || 120) / 8)
      for (let i = 0; i < steps; i++) { const nx = player.x + player.face.x * 8, ny = player.y + player.face.y * 8; if (blocked(nx, ny, PLAYER_RADIUS)) break; player.x = nx; player.y = ny }
      player.iframes = Math.max(player.iframes, fx.invincible || 0.3)
      ringFx(player.x, player.y, 30, skill.color || '#80deea', 0.3)
      break
    }
    case 'aoe': {
      const rad = fx.radius || 120
      ringFx(player.x, player.y, rad, skill.color || '#ffee58', 0.45)
      for (const m of world.monsters.slice()) {
        if (m.dead || Math.hypot(m.x - player.x, m.y - player.y) > rad + m.r) continue
        const r = rollPlayerDamage(fx.dmgMul || 2); damageMonster(m, r.dmg, r.crit, skill.color)
      }
      break
    }
    case 'shield':
      player.shield = (fx.value || 50) + state.realm * (fx.perRealm || 0)
      player.shieldT = fx.duration || 8
      ringFx(player.x, player.y, 34, skill.color || '#64b5f6', 0.4)
      break

  renderHud()
}


/* ---------- 每幀更新 ---------- */
function stepToward(m, ux, uy, step) { moveEntity(m, ux * step, uy * step, m.r * 0.8) }
function updateMonster(m, dt) {
  if (m.dead) return
  const d = m.def
  m.atkCd = Math.max(0, m.atkCd - dt); m.flash = Math.max(0, m.flash - dt)
  const speed = d.speed !== undefined ? d.speed : 90
  const dxp = player.x - m.x, dyp = player.y - m.y, dp = Math.hypot(dxp, dyp) || 0.001
  const dHome = Math.hypot(m.x - m.homeX, m.y - m.homeY)
  const aggro = d.aggro !== undefined ? d.aggro : 150, leash = d.leash !== undefined ? d.leash : 420
  const wantChase = !pendingDeath && dHome <= leash && (dp <= aggro || (m.provoked && dp <= aggro * 3))
  if (m.state === 'return') {
    const hx = m.homeX - m.x, hy = m.homeY - m.y, hd = Math.hypot(hx, hy)
    if (hd < 8) { m.state = 'idle'; m.hp = m.maxHp; m.provoked = false }
    else stepToward(m, hx / hd, hy / hd, speed * 1.6 * dt)
  } else if (wantChase) {
    m.state = 'chase'
    const reach = (d.range !== undefined ? d.range : 32) + PLAYER_RADIUS
    if (dp > reach) stepToward(m, dxp / dp, dyp / dp, speed * dt)
    else if (m.atkCd <= 0) { m.atkCd = d.atkCd !== undefined ? d.atkCd : 1.1; damagePlayer(randomInt(d.atkMin, d.atkMax), m) }
  } else if (m.state === 'chase') {
    m.state = 'return'; m.provoked = false
  } else {
    m.wanderT -= dt
    if (m.wanderT <= 0) { const a = Math.random() * Math.PI * 2, r = Math.random() * 90; m.tx = m.homeX + Math.cos(a) * r; m.ty = m.homeY + Math.sin(a) * r; m.wanderT = 2 + Math.random() * 3 }
    const wx = m.tx - m.x, wy = m.ty - m.y, wd = Math.hypot(wx, wy)
    if (wd > 4) stepToward(m, wx / wd, wy / wd, speed * 0.35 * dt)
  }
}
function separateMonsters() {
  const L = world.monsters
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
    const a = L[i], b = L[j]
    if (a.dead || b.dead) continue
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = (a.r + b.r) * 0.9
    if (d < min && d > 0.01) { const push = (min - d) / 2, ux = dx / d, uy = dy / d; moveEntity(a, -ux * push, -uy * push, a.r * 0.8); moveEntity(b, ux * push, uy * push, b.r * 0.8) }
  }
}
function updatePlayer(dt) {
  const ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0)
  const iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0)
  let mvx = 0, mvy = 0
  if (ix || iy) {
    const l = Math.hypot(ix, iy); mvx = ix / l; mvy = iy / l
    player.target = null; player.sitting = false
  } else if (player.target) {
    const t = player.target
    if (t.type === 'monster') {
      if (t.m.dead) player.target = null
      else {
        const dx = t.m.x - player.x, dy = t.m.y - player.y, d = Math.hypot(dx, dy) || 1
        if (d - t.m.r > PLAYER_ATTACK_RANGE * 0.8) { mvx = dx / d; mvy = dy / d } else playerAttack(t.m)
      }
    } else if (t.type === 'npc') {
      const dx = t.npc.x - player.x, dy = t.npc.y - player.y, d = Math.hypot(dx, dy) || 1
      if (d > 52) { mvx = dx / d; mvy = dy / d } else { player.target = null; doNpc(t.npc) }
    } else {
      const dx = t.x - player.x, dy = t.y - player.y, d = Math.hypot(dx, dy)
      if (d < 6) player.target = null; else { mvx = dx / d; mvy = dy / d }
    }
  }
  if (mvx || mvy) {
    player.sitting = false
    const sx = player.x, sy = player.y, step = PLAYER_SPEED * dt
    moveEntity(player, mvx * step, mvy * step, PLAYER_RADIUS)
    player.face = { x: mvx, y: mvy }
    if (player.target && Math.hypot(player.x - sx, player.y - sy) < step * 0.3) { player.stuckT += dt; if (player.stuckT > 0.4) player.target = null } else player.stuckT = 0
  }
}
function updateProjectiles(dt) {
  for (const pr of world.projectiles) {
    pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.dist += pr.speed * dt
    if (pr.dist > pr.range || solidPx(pr.x, pr.y)) { pr.dead = true; continue }
    for (const m of world.monsters) {
      if (m.dead || Math.hypot(m.x - pr.x, m.y - pr.y) >= pr.r + m.r) continue
      const r = rollPlayerDamage(pr.dmgMul); damageMonster(m, r.dmg, r.crit, pr.color)
      ringFx(pr.x, pr.y, 26, pr.color, 0.25); pr.dead = true; break
    }
  }
  world.projectiles = world.projectiles.filter((p) => !p.dead)
}
function updateEffects(dt) {
  for (const e of world.effects) { e.life -= dt; if (e.type === 'text') e.y -= 38 * dt }
  world.effects = world.effects.filter((e) => e.life > 0)
}
function updateRespawns(dt) {
  for (const r of world.respawns) {
    r.t -= dt
    if (r.t <= 0) { const m = spawnZoneMonster(r.zi); if (m) { world.monsters.push(m); r.done = true } else r.t = 3 }
  }
  world.respawns = world.respawns.filter((r) => !r.done)
}
function checkPortals() {
  const tx = Math.floor(player.x / TILE), ty = Math.floor(player.y / TILE)
  const p = world.portals.find((q) => q.x === tx && q.y === ty)
  if (!p) { player.portalLock = false; return }
  if (player.portalLock) return
  const dest = MAPS[p.to]
  if (!dest) return
  if (state.realm < (dest.reqRealm || 0)) {
    if (player.portalMsgCd <= 0) { addLog(`「${dest.name}」妖氣沖天，需達到${REALMS[dest.reqRealm]}期才能進入。`, 'danger'); player.portalMsgCd = 3 }
    return
  }
  addLog(`你踏入傳送陣，前往「${dest.name}」。`, 'gold')
  loadMap(p.to, { tx: p.tx, ty: p.ty })
  saveGame(true)
}
function update(dt) {
  world.time += dt
  world.fade = Math.max(0, world.fade - dt * 2.2)
  world.banner = Math.max(0, world.banner - dt)
  for (const k of Object.keys(state.cooldowns)) { state.cooldowns[k] -= dt; if (state.cooldowns[k] <= 0) delete state.cooldowns[k] }
  player.atkCd = Math.max(0, player.atkCd - dt)
  player.iframes = Math.max(0, player.iframes - dt)
  player.returnCd = Math.max(0, player.returnCd - dt)
  player.portalMsgCd = Math.max(0, player.portalMsgCd - dt)
  if (player.shieldT > 0) { player.shieldT -= dt; if (player.shieldT <= 0) player.shield = 0 }
  updatePlayer(dt)
  for (const m of world.monsters) updateMonster(m, dt)
  if (pendingDeath) { const by = pendingDeath; pendingDeath = null; playerDie(by); return }
  separateMonsters()
  world.monsters = world.monsters.filter((m) => !m.dead)
  updateRespawns(dt)
  updateProjectiles(dt)
  updateEffects(dt)
  checkPortals()
}


/* ---------- NPC 互動 ---------- */
function switchNav(id) { state.nav = id; renderNav(); renderInfo() }
function doNpc(n) {
  switch (n.action) {
    case 'market': addLog(`${n.name}：${n.say || ''}`, 'gold'); switchNav('market'); break
    case 'auction': addLog(`${n.name}：${n.say || ''}`, 'gold'); switchNav('auction'); break
    case 'sect': addLog(`${n.name}：${n.say || ''}`, 'gold'); switchNav('sect'); break
    case 'heal':
      if (state.hp >= maxHp() && state.mp >= maxMp()) { addLog(`${n.name}：「道友氣血靈力充盈，無需診治。」`); break }
      if (state.stones < HEAL_NPC_COST) { addLog(`${n.name}：「診金需 ${HEAL_NPC_COST} 靈石，道友囊中羞澀啊。」`, 'danger'); break }
      state.stones -= HEAL_NPC_COST; state.hp = maxHp(); state.mp = maxMp()
      addLog(`${n.name}施針運功，花費 ${HEAL_NPC_COST} 靈石，你的氣血與靈力完全恢復。`, 'success')
      renderHud(); break
    default: {
      const lines = n.lines && n.lines.length ? n.lines : [n.say || '…']
      addLog(`${n.name}：「${lines[randomInt(0, lines.length - 1)].replace(/^「|」$/g, '')}」`)

}
function interactNearest() {
  let best = null, bd = 70
  for (const n of world.npcs) { const d = Math.hypot(n.x - player.x, n.y - player.y); if (d < bd) { bd = d; best = n } }
  if (best) doNpc(best)
}


/* ---------- 畫布繪製 ---------- */
const cv = $('game'), ctx = cv.getContext('2d')
let viewW = 800, viewH = 500, dpr = 1
const cam = { x: 0, y: 0 }
const UI_FONT = '"Noto Sans TC","Microsoft JhengHei",sans-serif'
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'
const playerImg = new Image(); let playerImgOk = false
playerImg.onload = () => { playerImgOk = true }
playerImg.src = './img/cultivator.png'

function resizeCanvas() {
  const r = $('stage').getBoundingClientRect()
  dpr = Math.min(2, window.devicePixelRatio || 1)
  viewW = Math.max(100, Math.floor(r.width)); viewH = Math.max(100, Math.floor(r.height))
  cv.width = Math.floor(viewW * dpr); cv.height = Math.floor(viewH * dpr)
}
if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe($('stage')); else window.addEventListener('resize', resizeCanvas)

function outlineText(t, x, y, color, size, bold) {
  ctx.font = `${bold ? '700 ' : ''}${size}px ${UI_FONT}`
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.strokeText(t, x, y)
  ctx.fillStyle = color; ctx.fillText(t, x, y)
}
function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - w / 2, y, w, h)
  ctx.fillStyle = color; ctx.fillRect(x - w / 2, y, w * Math.max(0, Math.min(1, frac)), h)
}
function shadow(x, y, rx) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y, rx, rx * 0.4, 0, 0, Math.PI * 2); ctx.fill() }

function drawTiles() {
  const x0 = Math.max(0, Math.floor(cam.x / TILE)), x1 = Math.min(world.w - 1, Math.floor((cam.x + viewW) / TILE))
  const y0 = Math.max(0, Math.floor(cam.y / TILE)), y1 = Math.min(world.h - 1, Math.floor((cam.y + viewH) / TILE))
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const t = world.grid[y][x], px = x * TILE, py = y * TILE
    ctx.fillStyle = ((x * 73856093) ^ (y * 19349663)) & 1 ? t.alt : t.color
    ctx.fillRect(px, py, TILE, TILE)
    if (t.water) {
      ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 1.5; ctx.beginPath()
      const o = Math.sin(world.time * 2 + x + y) * 3
      ctx.moveTo(px + 6, py + 14 + o); ctx.quadraticCurveTo(px + 14, py + 8 + o, px + 22, py + 14 + o); ctx.moveTo(px + 16, py + 28 - o); ctx.quadraticCurveTo(px + 24, py + 22 - o, px + 32, py + 28 - o); ctx.stroke()
    } else if (t.glow) {
      ctx.fillStyle = t.glow; ctx.globalAlpha = 0.18 + 0.1 * Math.sin(world.time * 2 + x * 2 + y); ctx.fillRect(px + 4, py + 4, TILE - 8, TILE - 8); ctx.globalAlpha = 1
    } else if (t.solid && !t.deco) {
      ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(px, py, TILE, 3)
    }
    if (t.deco) { ctx.font = `${t.decoSize || 30}px ${EMOJI_FONT}`; ctx.fillStyle = '#fff'; ctx.fillText(t.deco, px + TILE / 2, py + TILE / 2 + 2) }
  }
}
function drawPortal(p) {
  const cx = (p.x + 0.5) * TILE, cy = (p.y + 0.5) * TILE
  if (cx < cam.x - 60 || cx > cam.x + viewW + 60 || cy < cam.y - 60 || cy > cam.y + viewH + 60) return
  const pulse = 1 + 0.12 * Math.sin(world.time * 3)
  const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, 22 * pulse)
  g.addColorStop(0, 'rgba(190,255,240,.95)'); g.addColorStop(0.6, 'rgba(80,200,255,.45)'); g.addColorStop(1, 'rgba(80,200,255,0)')
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 22 * pulse, 0, Math.PI * 2); ctx.fill()
  ctx.setLineDash([4, 5]); ctx.lineDashOffset = -world.time * 20; ctx.strokeStyle = 'rgba(200,255,250,.9)'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([])
  const dest = MAPS[p.to]
  outlineText('→ ' + (p.label || (dest ? dest.name : '?')), cx, cy - 30, '#b2ebf2', 12, true)
}
function drawPlayer() {
  const { x, y } = player

  for (const m of world.monsters) { if (m.dead) continue; const d = Math.hypot(m.x - wx, m.y - wy); if (d < m.r + 8 && d < bd) { bd = d; best = m } }

}

    put(li, '.au-who', a.highestBidder ? `目前最高：${mine ? '你' : a.highestBidder}` : '尚無人出價')
    put(li, '.au-time', `剩餘 ${a.timeLeft}s`); put(li, '.au-bid', String(a.currentBid))
    const b = li.querySelector('.au-btn'); put(li, '.au-btn', mine ? '領先中' : `出價 ${target}`); b.disabled = mine
  }
  for (const l of state.playerListings) {
    const li = document.querySelector(`[data-pl="${l.id}"]`); if (!li) continue
    put(li, '.au-who', l.highestBidder ? `目前出價者：${l.highestBidder}` : '尚無人出價')
    put(li, '.au-time', `剩餘 ${l.timeLeft}s`); put(li, '.au-bid', String(l.currentBid))
  }
}
function renderSect() {
  const cards = SECTS.map((s) => `
    <li class="card sect-card ${state.sect === s.id ? 'selected' : ''}" data-sect="${s.id}">
      <div class="row" style="align-items:flex-start">
        <div class="col">
          <span class="bold">${s.name}</span>
          <span class="xs muted" style="margin-top:4px">${s.desc}</span>
          <span class="xs" style="color:var(--accent);margin-top:4px">${s.bonus || ''}</span>
        </div>
        <span class="xs" style="color:${state.sect === s.id ? 'var(--primary)' : 'var(--muted-fg)'};white-space:nowrap">${state.sect === s.id ? '目前宗門' : '點擊加入'}</span>
      </div>
    </li>`).join('')
  const cur = currentSect()
  const info = [['宗門', cur.name], ['職位', '內門弟子'], ['貢獻', state.contribution.toLocaleString()], ['師尊', cur.master]]
  return `
    <ul class="stack" style="margin-bottom:18px">${cards}</ul>
    <h3 class="panel-title" style="font-size:12px;margin-bottom:8px">宗門資料</h3>
    <dl class="sect-grid">${info.map(([k, v]) => `<div class="card"><dt class="xs muted">${k}</dt><dd class="bold">${v}</dd></div>`).join('')}</dl>`
}

/* ---------- 功法列 ---------- */
function buildSkills() {
  $('skills').innerHTML = SKILLS.map((s, i) => `
    <li><button type="button" class="skill" data-skill="${i}">
      <span class="seal" aria-hidden="true">${s.element}</span>
      <span class="skill-text"><span class="bold">${s.name}</span><span class="xs muted">${s.cost} 靈力 · <kbd>${i + 1}</kbd></span></span>
      <span class="cd hidden" aria-hidden="true"></span>
    </button></li>`).join('')
}
function updateSkillBar() {
  $('skills').querySelectorAll('.skill').forEach((b, i) => {
    const s = SKILLS[i], cd = state.cooldowns[s.id] || 0, dis = cd > 0 || state.mp < s.cost
    if (b.disabled !== dis) b.disabled = dis
    const el = b.querySelector('.cd')
    if (cd > 0) { el.classList.remove('hidden'); const t = String(Math.ceil(cd)); if (el.textContent !== t) el.textContent = t } else el.classList.add('hidden')
  })
}

/* ---------- 上方狀態列／修為列 ---------- */
function renderHud() {
  if (!started || !world) return
  const req = required(), mh = maxHp(), mm = maxMp()
  state.hp = Math.min(state.hp, mh); state.mp = Math.min(state.mp, mm)
  setText('sectBadge', `${currentSect().name} · 內門弟子`)
  setText('realmLine', `${REALMS[state.realm]}期 · 第${NUM[state.layer - 1]}層`)
  setBar('hpBar', 'hpVal', state.hp, mh)
  setBar('mpBar', 'mpVal', state.mp, mm)
  setText('stones', state.stones.toLocaleString()); setText('jade', state.jade.toLocaleString())
  const ready = state.xp >= req
  $('xpBar').firstElementChild.style.width = Math.min(100, (state.xp / req) * 100) + '%'
  $('xpBar').firstElementChild.style.background = ready ? 'var(--accent)' : 'var(--primary)'
  setText('xpVal', `${Math.floor(state.xp)} / ${req}`)
  setText('chance', Math.round(chance() * 100) + '%')
  $('btnBreak').disabled = !ready
  setText('mapName', `${world.def.icon || ''} ${world.def.name}`)
  setText('mapSub', world.def.town ? '城鎮 · 安全區' : `建議 ${REALMS[world.def.reqRealm || 0]}期以上`)
  const sit = $('btnSit'); setText('btnSit', player.sitting ? '起身' : '打坐'); sit.setAttribute('aria-pressed', player.sitting)
  const hd = Math.ceil(player.returnCd); setText('btnHome', hd > 0 ? `回城 ${hd}` : '回城'); $('btnHome').disabled = hd > 0
  updateSkillBar()
}

/* ---------- 修煉／道具／交易 ---------- */
function breakthrough() {
  if (state.xp < required()) return
  if (Math.random() < chance()) {
    state.xp = 0
    if (state.layer < MAX_LAYER) {
      state.layer++
      addLog(`突破成功！晉入${REALMS[state.realm]}期第${NUM[state.layer - 1]}層。`, 'success')
    } else if (state.realm < REALMS.length - 1) {
      state.realm++; state.layer = 1
      addLog(`天降異象，霞光萬道！你成功踏入${REALMS[state.realm]}期！`, 'gold')
    } else {
      addLog('你已臻大乘圓滿，只待飛升之日。', 'gold')
    }
    state.hp = maxHp(); state.mp = maxMp()     // 突破成功：氣血與靈力全滿
    ringFx(player.x, player.y, 60, '#ffd54f', 0.6); floatText(player.x, player.y - 50, '突破！', '#ffd54f', 22)
  } else {
    state.xp = Math.floor(state.xp * 0.6)
    state.hp = Math.max(1, state.hp - 40)
    addLog('衝擊瓶頸失敗，靈氣逆衝經脈，氣血受損。', 'danger')
  }
  renderHud()
  if (state.nav === 'character' || state.nav === 'world' || state.nav === 'techniques') renderInfo()
}
function toggleSit() {
  if (!world) return
  player.sitting = !player.sitting
  if (player.sitting) player.target = null
  renderHud()
}
function goHome() {
  if (!world || player.returnCd > 0) return
  const id = startMapId()
  if (world.id === id) { addLog('你已經在城鎮中了。'); return }
  addLog('你捏碎回城符，身形化作流光，返回城鎮。', 'gold')
  loadMap(id, { tx: MAPS[id].spawn.x, ty: MAPS[id].spawn.y })
  player.returnCd = RETURN_COOLDOWN
  saveGame(true)
}
function useItem(id) {
  const qty = state.inventory[id] || 0, def = ITEMS[id]
  if (qty <= 0 || !def || !def.effect) return
  const fx = def.effect
  if (fx.type === 'restoreHp' && state.hp >= maxHp()) { addLog('氣血已滿，無需服用。'); return }
  if (fx.type === 'restoreMp' && state.mp >= maxMp()) { addLog('靈力已滿，無需服用。'); return }
  state.inventory[id] = qty - 1
  if (state.inventory[id] <= 0) delete state.inventory[id]
  if (fx.type === 'restoreHp') { state.hp = Math.min(maxHp(), state.hp + fx.value); floatText(player.x, player.y - 30, `+${fx.value}`, '#69f0ae', 16); addLog(`服下「${def.name}」，${def.desc.replace(/（.*）/, '')}。`, 'success') }
  else if (fx.type === 'restoreMp') { state.mp = Math.min(maxMp(), state.mp + fx.value); floatText(player.x, player.y - 30, `+${fx.value} 靈力`, '#4fc3f7', 15); addLog(`服下「${def.name}」，${def.desc.replace(/（.*）/, '')}。`, 'success') }
  else if (fx.type === 'addXpPercent') { const req = required(); state.xp = Math.min(req, state.xp + req * fx.value); addLog(`服下「${def.name}」，${def.desc}。`, 'gold') }
  renderHud()
  if (state.nav === 'bag' || state.nav === 'market') renderInfo()
}
function quickUse(id) {
  if (!(state.inventory[id] > 0)) { addLog(`背包裡沒有「${ITEMS[id] ? ITEMS[id].name : id}」了。`, 'danger'); return }
  useItem(id)
}
function sellItem(id) {
  if (!canTrade()) { addLog('需要回到城鎮才能出售物品。', 'danger'); return }
  const qty = state.inventory[id] || 0, def = ITEMS[id]
  if (qty <= 0 || !def) return
  state.inventory[id] = qty - 1
  if (state.inventory[id] <= 0) delete state.inventory[id]
  state.stones += def.sell
  addLog(`售出「${def.name}」，獲得 ${def.sell} 靈石。`)
  renderHud()
  if (['bag', 'market'].includes(state.nav)) renderInfo()
  else if (state.nav === 'auction') { const sel = $('listItemSelect'); if (sel) { const keep = sel.value; sel.innerHTML = listOptionsHtml(); if ([...sel.options].some((o) => o.value === keep)) sel.value = keep } }
}
function buyItem(id) {
  if (!canTrade()) { addLog('需要在城鎮才能購買物品。', 'danger'); return }
  const def = ITEMS[id]
  if (!def || !def.buy) return
  const wallet = def.currency === 'jade' ? 'jade' : 'stones', label = wallet === 'jade' ? '仙玉' : '靈石'
  if (state[wallet] < def.buy) { addLog(`${label}不足，無法購買「${def.name}」。`, 'danger'); return }
  state[wallet] -= def.buy
  addItem(id, 1)
  addLog(`花費 ${def.buy} ${label}，購得「${def.name}」。`, 'gold')
  renderHud()
  if (state.nav === 'market') renderInfo()
}
function exchangeCurrency(amount) {
  if (!canTrade()) { addLog('需要在城鎮才能兌換仙玉。', 'danger'); return }
  const rate = 500, jadeGain = Math.floor(amount / rate)
  if (jadeGain <= 0) { addLog('靈石數量不足以兌換仙玉。', 'danger'); return }
  const cost = jadeGain * rate
  if (state.stones < cost) { addLog('靈石不足，無法完成兌換。', 'danger'); return }
  state.stones -= cost; state.jade += jadeGain
  addLog(`以 ${cost} 靈石兌換 ${jadeGain} 仙玉。`, 'gold')
  renderHud()
}

/* ---------- 拍賣 ---------- */
function npcBidAuction(a) {
  if (a.highestBidder === 'player') state.stones += a.currentBid       // 被超標：退還玩家押的靈石
  a.currentBid += a.increment
  a.highestBidder = BIDDERS[randomInt(0, BIDDERS.length - 1)]
}
function playerBid(id) {
  if (!canTrade()) return
  const a = state.auctions.find((x) => x.id === id)
  if (!a || a.timeLeft <= 0 || a.highestBidder === 'player') return
  const target = a.highestBidder ? a.currentBid + a.increment : a.currentBid
  if (state.stones < target) { addLog('靈石不足，無法出價。', 'danger'); return }
  state.stones -= target; a.currentBid = target; a.highestBidder = 'player'
  addLog(`你於拍賣場出價 ${target} 靈石，目前領先「${ITEMS[a.item].name}」。`, 'gold')
  renderHud(); updateAuctionLive()
}
function resolveAuction(a) {
  if (a.highestBidder === 'player') { addItem(a.item, a.qty); addLog(`拍賣結束！你以 ${a.currentBid} 靈石標得「${ITEMS[a.item].name}」× ${a.qty}。`, 'gold') }
  else if (a.highestBidder) addLog(`拍賣結束，「${ITEMS[a.item].name}」被${a.highestBidder}以 ${a.currentBid} 靈石標走。`)
  else addLog(`「${ITEMS[a.item].name}」流拍，無人出價。`)
}
function listPlayerItem() {
  if (!canTrade()) return
  const itemId = $('listItemSelect') && $('listItemSelect').value
  const price = Math.max(0, Math.floor(Number($('listPrice') && $('listPrice').value) || 0))
  if (!itemId || !ITEMS[itemId]) { addLog('沒有可上架的物品。', 'danger'); return }
  if (SHOP_ITEMS.includes(itemId)) { addLog('交易所販售的道具無法上架拍賣場。', 'danger'); return }
  if ((state.inventory[itemId] || 0) <= 0) { addLog('物品數量不足，無法上架。', 'danger'); return }
  if (price <= 0) { addLog('請輸入有效的起標價格。', 'danger'); return }
  state.inventory[itemId] -= 1
  if (state.inventory[itemId] <= 0) delete state.inventory[itemId]
  state.playerListings.push({ id: 'p' + Date.now() + Math.random().toString(16).slice(2, 6), item: itemId, qty: 1, startPrice: price, currentBid: price, highestBidder: null, timeLeft: randomInt(60, 120) })
  addLog(`將「${ITEMS[itemId].name}」送上拍賣場，起標 ${price} 靈石。`, 'gold')
  renderHud(); renderInfo()
}
function tickPlayerListings() {
  state.playerListings = state.playerListings.filter((l) => {
    if (l.timeLeft > 0) {
      l.timeLeft--
      // 出價越接近「商店出售價」越容易有人加價；超過 PLAYER_AUCTION_MAX_RATIO 倍就沒人理
      const fair = ITEMS[l.item].sell * l.qty, ratio = l.currentBid / fair
      if (ratio < PLAYER_AUCTION_MAX_RATIO) {
        const p = ratio < 0.8 ? 0.2 : ratio < 1.5 ? 0.1 : 0.04
        if (Math.random() < p) {
          if (l.highestBidder) l.currentBid += Math.max(1, Math.round(fair * 0.08))
          l.highestBidder = BIDDERS[randomInt(0, BIDDERS.length - 1)]
        }
      }
    }
    if (l.timeLeft > 0) return true
    if (l.highestBidder) {
      const fee = Math.floor(l.currentBid * AUCTION_FEE), gain = l.currentBid - fee
      state.stones += gain
      addLog(`你上架的「${ITEMS[l.item].name}」被${l.highestBidder}以 ${l.currentBid} 靈石標走，扣除抽成 ${fee}，入帳 ${gain} 靈石。`, 'gold')
    } else { addItem(l.item, l.qty); addLog(`你上架的「${ITEMS[l.item].name}」流拍，已退回背包。`) }
    return false
  })
}
function selectSect(id) {
  const s = SECTS.find((x) => x.id === id)
  if (!s || state.sect === id) return
  state.sect = id
  state.hp = Math.min(state.hp, maxHp())
  addLog(`你拜入「${s.name}」，正式成為門下弟子。${s.bonus ? '（' + s.bonus + '）' : ''}`, 'gold')
  renderHud(); renderInfo()
}


/* ---------- 開始遊戲 ---------- */
function enterGame() {
  $('start-screen').classList.add('hidden')
  $('game-screen').classList.remove('hidden')
  resizeCanvas()
  buildSkills()
  const warnings = validateGameData()
  const loaded = loadGame(true)
  if (!world) loadMap(startMapId())
  started = true
  if (loaded) addLog('靈氣流轉，你繼續先前的修行進度。', 'gold')
  else { addLog('你於青雲村中睜開雙眼，山風拂面，靈氣緩緩流轉。'); addLog('師尊玄真子傳音：「修行之道，貴在持之以恆。」', 'gold') }
  warnings.forEach((t) => { addLog('資料檢查：' + t, 'danger'); console.warn('[資料檢查]', t) })
  renderNav(); renderInfo(); renderHud()
}


/* ---------- 主迴圈／每秒計時 ---------- */
let lastFrame = performance.now(), hudT = 0
function frame(now) {
  requestAnimationFrame(frame)
  const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now
  if (!started || !world) return
  update(dt); draw()
  hudT += dt; if (hudT >= 0.1) { hudT = 0; renderHud() }
}
requestAnimationFrame(frame)

let autosaveT = 0
function tick() {
  if (!started) return
  const sit = player.sitting
  state.mp = Math.min(maxMp(), state.mp + (sit ? 5 : 2))
  state.hp = Math.min(maxHp(), state.hp + (sit ? 5 : 1))

  state.auctions.forEach((a) => {
    if (a.timeLeft <= 0) return
    a.timeLeft--
    if (Math.random() < (a.highestBidder === 'player' ? 0.1 : 0.14)) npcBidAuction(a)
    if (a.timeLeft <= 0) { resolveAuction(a); Object.assign(a, createAuctionListing(a.id)) }
  })
  tickPlayerListings()

  if (++autosaveT >= AUTOSAVE_SECONDS) { autosaveT = 0; saveGame(true) }
  renderHud()
  updateAuctionLive()
}
setInterval(tick, 1000)


/* ---------- 事件綁定 ---------- */
$('btnAttack').addEventListener('click', () => playerAttack())
$('btnBreak').addEventListener('click', breakthrough)
$('btnSit').addEventListener('click', toggleSit)
$('btnHome').addEventListener('click', goHome)
$('btnSave').addEventListener('click', () => saveGame(false))
$('btnLoad').addEventListener('click', () => loadGame(false))
$('nav').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-nav]')
  if (btn) switchNav(btn.dataset.nav)
})
$('infoBody').addEventListener('click', (e) => {
  const q = (s) => e.target.closest(s)
  let el
  if ((el = q('[data-use-item]'))) return useItem(el.dataset.useItem)
  if ((el = q('[data-sell-item]'))) return sellItem(el.dataset.sellItem)
  if ((el = q('[data-buy-item]'))) return buyItem(el.dataset.buyItem)
  if (q('[data-exchange]')) { const i = $('exchangeAmount'); return exchangeCurrency(Math.max(0, Math.floor(Number(i && i.value) || 0))) }
  if (q('[data-list-item]')) return listPlayerItem()
  if ((el = q('[data-bid]'))) return playerBid(el.dataset.bid)
  if ((el = q('[data-sect]'))) return selectSect(el.dataset.sect)
  if (q('[data-go-home]')) return goHome()
})
$('skills').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-skill]')
  if (btn) castSkill(SKILLS[Number(btn.dataset.skill)])
})
const MOVE_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'])
const typing = (e) => e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]')
window.addEventListener('keydown', (e) => {
  if (!started || !world || typing(e) || e.ctrlKey || e.metaKey || e.altKey) return
  if (MOVE_KEYS.has(e.code)) { keys[e.code] = true; e.preventDefault(); return }
  if (e.code === 'Space' || e.code === 'KeyJ') { e.preventDefault(); playerAttack(); return }
  if (e.code === 'KeyE') { if (!e.repeat) interactNearest(); return }
  if (e.code === 'KeyQ') { if (!e.repeat) toggleSit(); return }
  if (e.code === 'KeyZ') { if (!e.repeat) quickUse(QUICK_HP_ITEM); return }
  if (e.code === 'KeyX') { if (!e.repeat) quickUse(QUICK_MP_ITEM); return }
  const i = Number(e.key) - 1
  if (e.key.length === 1 && i >= 0 && i < SKILLS.length) castSkill(SKILLS[i])
})
window.addEventListener('keyup', (e) => { if (MOVE_KEYS.has(e.code)) keys[e.code] = false; if (e.code === 'Space' && started && !typing(e)) e.preventDefault() })
window.addEventListener('blur', () => { for (const k of Object.keys(keys)) keys[k] = false })
window.addEventListener('beforeunload', () => { if (started) saveGame(true) })   // 還沒按「開始遊戲」時不會存檔，避免用初始資料蓋掉舊存檔
</script>
</body>
</html>
