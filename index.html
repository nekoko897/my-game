<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>修仙亂亂修</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }

    /* 封面首頁樣式 */
    #start-screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('bg.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    /* 透明開始按鈕（對應圖片上的「開始遊戲」位置） */
    .start-btn {
      position: absolute;
      bottom: 12%;
      left: 36%;
      width: 14%;
      height: 8%;
      background: rgba(0, 0, 0, 0); /* 設為透明，完美貼合圖片按鈕 */
      border: none;
      cursor: pointer;
    }

    /* 遊戲畫面 Canvas 樣式（初始隱藏） */
    #game-canvas {
      display: none;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- 首頁封面 -->
  <div id="start-screen">
    <button class="start-btn" onclick="startGame()"></button>
  </div>

  <!-- 遊戲畫布 -->
  <canvas id="game-canvas"></canvas>

  <script>
    function startGame() {
      // 1. 隱藏首頁封面
      document.getElementById('start-screen').style.display = 'none';
      
      // 2. 顯示遊戲畫面
      const canvas = document.getElementById('game-canvas');
      canvas.style.display = 'block';

      // 3. 這裡放入你原本的遊戲初始化與繪製邏輯
      initGame();
    }

    function initGame() {
      console.log("成功進入遊戲，開始與後端連線！");
      // TODO: 載入你的遊戲 Canvas 渲染與 API 連線程式碼
    }
  </script>
</body>
</html>
