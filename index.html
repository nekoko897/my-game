<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#14232b" />
<meta name="color-scheme" content="dark" />
<title>問道長生 · 修仙界</title>
<!-- 加上這三行手機 PWA 全螢幕設定 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />

<meta name="description" content="一款修仙風格的遊戲介面：修煉、突破境界、施展功法，踏上長生大道。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  /* 墨青 · 宣紙 · 翡翠 · 鎏金 · 硃砂 */
  :root {
    --background: oklch(0.17 0.025 220);
    --foreground: oklch(0.93 0.02 95);
    --card: oklch(0.21 0.028 215);
    --primary: oklch(0.76 0.11 165);
    --secondary: oklch(0.25 0.028 215);
    --muted-fg: oklch(0.72 0.02 200);
    --accent: oklch(0.83 0.12 85);
    --destructive: oklch(0.62 0.19 30);
    --border: oklch(0.76 0.11 165 / 20%);
    --radius: 6px;
    --sans: 'Noto Sans TC', sans-serif;
    --serif: 'Noto Serif TC', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--background); color: var(--foreground); font-family: var(--sans); -webkit-font-smoothing: antialiased; width: 100%; height: 100%; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul, ol { list-style: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .serif { font-family: var(--serif); }
  .muted { color: var(--muted-fg); }
  .xs { font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }

  /* 畫面切換控制 */
  .screen { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* 首頁封面樣式 */
  /* 封面：外層用模糊放大的 bg.jpg 填滿，內層 .start-stage 依原圖比例（1358×768）完整顯示，
     按鈕以 .start-stage 為基準定位，任何螢幕比例都會對準圖上畫的按鈕 */
  #start-screen {
    background: #0b131a;
    z-index: 10;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #start-screen::before {
    content: ''; position: absolute; inset: -40px;
    background: url('bg.jpg') center / cover no-repeat;
    filter: blur(18px) brightness(.55);
  }
  .start-stage {
    position: relative;
    width: min(100vw, calc(100dvh * 1358 / 768));
    aspect-ratio: 1358 / 768;
    background: url('bg.jpg') center / 100% 100% no-repeat;
  }
  .clickable-area {
    position: absolute;
    background: transparent;
    border: none;
    cursor: pointer;
    outline: none;
  }
  .clickable-area:hover {
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    border-radius: 8px;
  }
  /* 圖片上的按鈕精確位置（可依你的圖片位置微調百分比） */
  /* 位置為 bg.jpg 上「開始遊戲」「設定」按鈕的實際範圍（佔圖片寬高的百分比） */
  #btn-start { top: 82%; left: 22.8%; width: 17%; height: 9.7%; }
  #btn-settings-home { top: 82%; left: 60.5%; width: 17.2%; height: 9.7%; }

  /* 缺少 bg.jpg 時的備用封面（JS 偵測圖片載入失敗後加上 .no-art） */
  .start-fallback { display: none; }
  #start-screen.no-art { background: radial-gradient(ellipse at 50% 30%, oklch(0.3 0.06 180) 0%, var(--background) 70%); }
  #start-screen.no-art::before { display: none; }
  #start-screen.no-art .start-stage {
    background: none; aspect-ratio: auto; width: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;
  }
  #start-screen.no-art .start-fallback { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  #start-screen.no-art .clickable-area { position: static; width: auto; height: auto; }
  #start-screen.no-art .start-actions { display: flex; gap: 16px; }
  .start-title { font-family: var(--serif); font-size: clamp(40px, 10vw, 72px); font-weight: 900; letter-spacing: .3em; color: var(--accent); text-shadow: 0 0 30px color-mix(in oklch, var(--accent) 40%, transparent); }
  .start-sub { font-family: var(--serif); letter-spacing: .5em; color: var(--muted-fg); }
  /* 遊戲畫面缺圖時：背景改漸層、頭像改文字 */
  .app.no-bg { background: radial-gradient(ellipse at 50% 20%, oklch(0.26 0.05 190) 0%, var(--background) 75%); }
  .avatar-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 24px; font-weight: 900; color: var(--accent); background: var(--secondary); }

  .app { position: relative; min-height: 100dvh; overflow: hidden; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .veil { position: absolute; inset: 0; background: color-mix(in oklch, var(--background) 55%, transparent); }
  .shell { position: relative; max-width: 1280px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 16px; padding: 12px; }
  .grid { flex: 1; min-height: 0; display: grid; gap: 16px; }
  .grid.bag-open > aside:first-child .nav { width: 200px; }
  @media (min-width: 768px) { .shell { padding: 16px; } }
  @media (min-width: 1024px) {
    .shell { height: 100dvh; }
    .grid { grid-template-columns: 200px 1fr 300px; }
  }

  .panel {
    background: color-mix(in oklch, var(--card) 80%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow:
      inset 0 0 0 3px color-mix(in oklch, var(--background) 70%, transparent),
      inset 0 0 0 4px color-mix(in oklch, var(--accent) 22%, transparent);
  }
  .panel-title { font-family: var(--serif); font-size: 14px; font-weight: 700; letter-spacing: .4em; color: var(--accent); margin-bottom: 14px; }

  /* Top bar */
  .top { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  @media (min-width: 768px) { .top { flex-direction: row; align-items: center; justify-content: space-between; gap: 24px; } }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; border: 2px solid color-mix(in oklch, var(--accent) 60%, transparent); flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name-row { display: flex; align-items: baseline; gap: 8px; }
  .name-row h1 { font-family: var(--serif); font-size: 20px; font-weight: 700; letter-spacing: .1em; }
  .realm-line { font-family: var(--serif); font-size: 14px; color: var(--accent); }
  .stats { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  @media (min-width: 768px) { .stats { max-width: 448px; } }
  .stat { display: flex; align-items: center; gap: 8px; }
  .stat-label { width: 32px; flex-shrink: 0; font-family: var(--serif); font-size: 12px; color: var(--muted-fg); }
  .track { position: relative; flex: 1; height: 10px; overflow: hidden; border-radius: 999px; background: color-mix(in oklch, var(--background) 70%, transparent); box-shadow: 0 0 0 1px var(--border); }
  .fill { height: 100%; border-radius: 999px; transition: width .5s; }
  .stat-val { width: 64px; flex-shrink: 0; text-align: right; font-size: 12px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .wallet { display: flex; align-items: center; gap: 12px; }
  .wallet dl { display: flex; gap: 16px; font-size: 14px; }
  .wallet dl > div { display: flex; align-items: center; gap: 6px; }
  .wallet dt { display: flex; align-items: center; gap: 4px; color: var(--muted-fg); }
  .wallet dd { font-weight: 500; font-variant-numeric: tabular-nums; }
  .icon { width: 16px; height: 16px; flex-shrink: 0; }
  #help-modal[hidden] { display: none !important; }
  .icon-btn { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--border); color: var(--muted-fg); transition: color .2s, border-color .2s; }
  .icon-btn:hover { color: var(--accent); border-color: color-mix(in oklch, var(--accent) 60%, transparent); }

  /* Side nav */
  .nav { padding: 8px; }
  .nav ul { display: flex; gap: 4px; overflow-x: auto; }
  @media (min-width: 1024px) { .nav ul { flex-direction: column; } }
  .nav li { flex-shrink: 0; }
  .nav button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius); font-family: var(--serif); font-size: 14px; letter-spacing: .3em; color: var(--muted-fg); transition: background .2s, color .2s; }
  .nav button:hover { background: var(--secondary); color: var(--foreground); }
  .nav button[aria-current="page"] { background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); box-shadow: 0 0 0 1px color-mix(in oklch, var(--primary) 40%, transparent); }

  /* Core */
  main { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 16px 0; }
  .core { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .orb { position: relative; width: 288px; height: 288px; display: flex; align-items: center; justify-content: center; }
  @media (min-width: 640px) { .orb { width: 320px; height: 320px; } }
  .orb svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .glow { position: absolute; inset: 24px; border-radius: 50%; background: color-mix(in oklch, var(--primary) 20%, transparent); filter: blur(40px); animation: breathe 4s ease-in-out infinite; }
  .ready .glow { background: color-mix(in oklch, var(--accent) 30%, transparent); }
  .orbit { animation: orbit 24s linear infinite; }
  .secluded .orbit { animation-duration: 6s; }
  .ring-progress { transform: rotate(-90deg); }
  .ring-progress circle:last-child { transition: stroke-dashoffset .7s ease-out, stroke .3s; }
  .core-text { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .core-label { font-size: 12px; letter-spacing: .4em; color: var(--muted-fg); }
  .core-realm { font-family: var(--serif); font-size: 60px; line-height: 1.1; font-weight: 900; letter-spacing: .1em; }
  .ready .core-realm { color: var(--accent); }
  .core-layer { font-family: var(--serif); font-size: 18px; letter-spacing: .3em; color: var(--primary); }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .btn { min-width: 112px; padding: 10px 20px; border-radius: var(--radius); font-family: var(--serif); letter-spacing: .3em; transition: background .2s, opacity .2s, color .2s; }
  .btn:disabled { opacity: .4; }
  .btn-primary { border: 1px solid color-mix(in oklch, var(--primary) 50%, transparent); background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); }
  .btn-primary:not(:disabled):hover { background: color-mix(in oklch, var(--primary) 25%, transparent); }
  .btn-gold { background: var(--accent); color: var(--background); font-weight: 700; }
  .btn-gold:disabled { opacity: .3; }
  .btn-gold:not(:disabled):hover { opacity: .9; }
  .btn-gold small { margin-left: 8px; font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0; }
  .btn-ghost { border: 1px solid var(--border); color: var(--muted-fg); }
  .btn-ghost:hover { color: var(--foreground); }
  .btn-ghost[aria-pressed="true"] { border-color: color-mix(in oklch, var(--accent) 60%, transparent); color: var(--accent); }

  /* Right column */
  .right { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .info { padding: 16px; overflow-y: auto; }
  .attr { display: flex; flex-direction: column; gap: 4px; }
  .attr + .attr { margin-top: 12px; }
  .attr-head { display: flex; align-items: baseline; justify-content: space-between; }
  .attr-head dt { font-family: var(--serif); font-size: 14px; }
  .attr-head dd { font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .mini-track { height: 4px; border-radius: 999px; overflow: hidden; background: color-mix(in oklch, var(--background) 70%, transparent); }
  .mini-track div { height: 100%; background: color-mix(in oklch, var(--primary) 70%, transparent); }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--background) 40%, transparent); padding: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .col { display: flex; flex-direction: column; }
  .bold { font-family: var(--serif); font-size: 14px; font-weight: 700; }
  .seal { width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid var(--destructive); color: var(--destructive); font-family: var(--serif); }
  .tech { display: flex; align-items: flex-start; gap: 12px; }
  .small-btn { padding: 6px 12px; border-radius: var(--radius); border: 1px solid color-mix(in oklch, var(--primary) 50%, transparent); color: var(--primary); font-family: var(--serif); font-size: 12px; letter-spacing: .1em; white-space: nowrap; }
  .small-btn:not(:disabled):hover { background: color-mix(in oklch, var(--primary) 15%, transparent); }
  .small-btn:disabled { opacity: .4; }
  .sect-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* 背包 / 物品 */
  .cluster { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .item-list { display: flex; flex-direction: column; gap: 10px; }
  .item-card { display: flex; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--background) 40%, transparent); padding: 10px; }
  .item-icon { width: 40px; height: 40px; flex-shrink: 0; border-radius: var(--radius); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; background: color-mix(in oklch, var(--background) 60%, transparent); }

  /* 秘境 / 狩獵地點 */
  .location-card { cursor: pointer; transition: border-color .2s, background .2s; }
  .location-card:not(.locked):hover { border-color: color-mix(in oklch, var(--primary) 50%, transparent); background: color-mix(in oklch, var(--primary) 8%, transparent); }
  .location-card.locked { opacity: .55; cursor: not-allowed; }
  .monster-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid var(--border); background: color-mix(in oklch, var(--background) 60%, transparent); flex-shrink: 0; }

  /* 戰鬥 */
  .battle-row { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 8px 0; }
  .combatant { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .battle-log { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; max-height: 120px; overflow-y: auto; padding-right: 4px; }
  .battle-log li { border-left: 1px solid var(--border); padding-left: 8px; line-height: 1.5; }

  /* 交易所 / 拍賣場輸入框 */
  .exchange-input { flex: 1; background: color-mix(in oklch, var(--background) 60%, transparent); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--foreground); font: inherit; min-width: 0; }
  .exchange-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select.exchange-input { cursor: pointer; }

  /* 宗門選擇卡片 */
  .sect-card { cursor: pointer; transition: border-color .2s, background .2s; }
  .sect-card:hover { border-color: color-mix(in oklch, var(--primary) 50%, transparent); }
  .sect-card.selected { border-color: color-mix(in oklch, var(--accent) 60%, transparent); background: color-mix(in oklch, var(--accent) 8%, transparent); }

  .log-wrap { display: flex; flex-direction: column; height: 256px; min-height: 0; }
  @media (min-width: 1024px) { .log-wrap { height: auto; flex: 1; } }
  .log { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 16px; }
  .log ol { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; font-size: 14px; line-height: 1.65; }
  .log li { border-left: 1px solid var(--border); padding-left: 12px; animation: log-in .3s ease-out; }
  .tone-normal { color: color-mix(in oklch, var(--foreground) 80%, transparent); }
  .tone-success { color: var(--primary); }
  .tone-danger { color: var(--destructive); }
  .tone-gold { color: var(--accent); }

  /* Skill bar */
  .skills { padding: 12px; }
  .skills ul { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 640px) { .skills ul { grid-template-columns: repeat(4, 1fr); } }
  .skill { position: relative; width: 100%; display: flex; align-items: center; gap: 12px; overflow: hidden; padding: 8px; text-align: left; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--background) 40%, transparent); transition: border-color .2s; }
  .skill:not(:disabled):hover { border-color: color-mix(in oklch, var(--primary) 50%, transparent); }
  .skill .seal { width: 40px; height: 40px; border-width: 2px; font-size: 18px; font-weight: 900; }
  .skill:disabled .seal { opacity: .4; }
  .skill:disabled .skill-text { opacity: .5; }
  .skill-text { display: flex; flex-direction: column; min-width: 0; }
  .skill-text .bold { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  kbd { font-family: var(--sans); }
  .cd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: color-mix(in oklch, var(--background) 70%, transparent); font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

  @keyframes breathe { 0%, 100% { opacity: .45; transform: scale(.97); } 50% { opacity: .9; transform: scale(1.02); } }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes log-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .glow, .orbit, .log li { animation: none !important; } }
  /* ========== 手機版專屬響應式優化 (螢幕寬度小於 1023px) ========== */
@media (max-width: 1023px) {
  /* 1. 解除畫面鎖死，允許手機上下滑動瀏覽 */
  html, body {
    height: auto;
    min-height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .screen {
    position: relative;
    min-height: 100dvh;
    height: auto;
  }
  #start-screen {
    position: fixed; /* 封面維持滿版固定 */
    inset: 0;
  }
  .app {
    overflow: visible;
    padding-bottom: 24px;
  }

  /* 2. 縮小修為靈球尺寸，避免佔據整個手機螢幕 */
  .orb {
    width: 210px;
    height: 210px;
  }
  .core-realm {
    font-size: 44px;
  }
  .core {
    gap: 14px;
  }
  main {
    padding: 8px 0;
    gap: 14px;
  }

  /* 3. 優化左側導覽列：在手機上變成好滑動的橫向標籤列 */
  .nav {
    padding: 6px;
  }
  .nav ul {
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch; /* iOS 滑動慣性優化 */
  }
  .nav button {
    padding: 8px 12px;
    font-size: 13px;
    letter-spacing: .15em;
    gap: 6px;
  }

  /* 4. 調整資訊面板與日誌高度，避免需要兩層滾動條 */
  .info {
    max-height: 55vh;
  }
  .log-wrap {
    height: 200px;
  }

  /* 5. 按鈕加大觸控區域，方便手指點擊 */
  .btn {
    padding: 12px 16px;
    min-width: 96px;
  }
  .small-btn {
    padding: 8px 12px;
  }
}
</style>
</head>
<body>

<!-- 1. 遊戲首頁畫面（封面） -->
<div id="start-screen" class="screen">
 <div class="start-stage">
  <div class="start-fallback">
    <h1 class="start-title">問道長生</h1>
    <p class="start-sub">修仙界</p>
  </div>
  <div class="start-actions">
    <button id="btn-start" class="clickable-area" onclick="showLogin()" aria-label="開始遊戲"><span class="start-fallback btn btn-gold">開始遊戲</span></button>
    <button id="btn-settings-home" class="clickable-area" onclick="alert('開啟設定選單')" aria-label="設定"><span class="start-fallback btn btn-ghost">設定</span></button>
  </div>
 </div>
</div>
<script>
  // 封面圖 bg.jpg 載不到時，改用備用封面（文字標題＋可見按鈕）
  (function () {
    const img = new Image()
    img.onerror = () => document.getElementById('start-screen').classList.add('no-art')
    img.src = 'bg.jpg'
  })()
</script>

<!-- 1.5 登入畫面（連線模式） -->

<!-- 共用遊戲規則：道具、秘境、宗門等資料與計算公式（伺服器載入同一份，數值以伺服器為準） -->
<script src="shared/game-rules.js"></script>
<script>
/* =========================================================
 * 【招式動畫】SkillFX：劍修角色 + 普攻 + 所有功法的施展動畫
 * - 普攻：御劍飛出、斬擊、收劍
 * - 攻伐功法：依功法的屬性字（火／水／雷…）自動配對動畫，傷害倍率越高、品階越高越華麗
 * - 回復／靈力／增益功法：在施法者身上播放對應效果
 * - 野外畫在主城 Canvas 上；魔蛟、回合制戰鬥畫在整頁覆蓋層上
 * 想讓某個功法換別的動畫：SkillFX.OVERRIDE['功法id'] = 'thunder'（可用的型態見 KINDS）
 * ========================================================= */
const SkillFX = (() => {
  const sheet = new Image(), sword = new Image()
  sheet.src = 'img/characters/jianxiu.png'          // 32×48 一格；列：下左右上；欄：走路 0-3、待機 4-5
  sword.src = 'img/characters/jianxiu_sword.png'    // 10×22，劍尖朝下
  const ready = (im) => im.complete && im.naturalWidth > 0
  const reduce = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches
  const now = () => performance.now()
  const rnd = (a, b) => a + Math.random() * (b - a)
  const clamp01 = (t) => Math.max(0, Math.min(1, t))
  const easeOut = (t) => 1 - Math.pow(1 - t, 3)
  const easeIn = (t) => t * t * t
  const lerp = (a, b, t) => a + (b - a) * t
  const seg = (t, a, b) => clamp01((t - a) / (b - a))   // 把整段進度 t 切出 a~b 的子進度

  /* ---------- 屬性 → 動畫型態與配色 [亮, 主, 暗] ---------- */
  const KINDS = {
    sword:   ['#ffffff', '#9fe8ff', '#3b8fd8'],
    fire:    ['#fff3b0', '#ffb347', '#e8412c'],
    water:   ['#e6fbff', '#6fd3f5', '#1f7fc4'],
    ice:     ['#ffffff', '#c6f3ff', '#5ab8e8'],
    thunder: ['#ffffff', '#fff27a', '#a98bff'],
    wood:    ['#f0ffd0', '#8fe36a', '#2f8f3a'],
    earth:   ['#f3e2b8', '#c99a5b', '#7a5530'],
    blade:   ['#ffffff', '#ffe08a', '#c9962e'],
    wind:    ['#ffffff', '#c8f7e8', '#5cc8a8'],
    light:   ['#ffffff', '#fff6c8', '#ffd24a'],
    dark:    ['#f0d0ff', '#a05ae0', '#3b1d5c'],
    poison:  ['#eaffc0', '#9be04a', '#4f7a1f'],
    blood:   ['#ffd0d0', '#ff5a5a', '#8a1020'],
    orb:     ['#ffffff', '#9fe8ff', '#4f8fd8'],
  }
  const CHAR_KIND = {
    '火': 'fire', '炎': 'fire', '焰': 'fire', '烈': 'fire', '陽': 'light',
    '水': 'water', '浪': 'water', '潮': 'water', '雨': 'water',
    '冰': 'ice', '寒': 'ice', '霜': 'ice', '雪': 'ice',
    '雷': 'thunder', '電': 'thunder', '霆': 'thunder',
    '木': 'wood', '藤': 'wood', '葉': 'wood', '春': 'wood', '藥': 'wood', '花': 'wood',
    '土': 'earth', '石': 'earth', '山': 'earth', '岩': 'earth', '地': 'earth',
    '金': 'blade', '劍': 'sword', '刃': 'blade', '刀': 'blade',
    '風': 'wind', '嵐': 'wind',
    '光': 'light', '聖': 'light', '佛': 'light', '天': 'light', '日': 'light',
    '暗': 'dark', '魔': 'dark', '陰': 'dark', '冥': 'dark', '魂': 'dark', '幽': 'dark', '鬼': 'dark', '煞': 'dark',
    '毒': 'poison', '蠱': 'poison',
    '血': 'blood',
  }
  const OVERRIDE = {}
  function styleOf(skill) {
    if (!skill) return { kind: 'sword', c: KINDS.sword, power: 1, tier: 0 }
    let kind = OVERRIDE[skill.id]
    if (!kind) for (const ch of String(skill.element || '') + String(skill.name || '')) if (CHAR_KIND[ch]) { kind = CHAR_KIND[ch]; break }
    kind = KINDS[kind] ? kind : 'orb'
    const dmg = (skill.effects || []).find((e) => e.t === 'dmg')
    return { kind, c: KINDS[kind], power: dmg ? Math.max(1, Math.min(3, dmg.mult || 1)) : 1, tier: skill.grade === 'advanced' ? 2 : skill.grade === 'sect' ? 1 : 0 }
  }

  /* ---------- 座標：{x,y}、函式、CSS 選擇器、{sel,dx,dy} 都可以 ---------- */
  function P(p) {
    if (!p) return null
    if (typeof p === 'function') return p()
    if (typeof p === 'string') p = { sel: p }
    if (p.sel) {
      const el = document.querySelector(p.sel); if (!el) return null
      const r = el.getBoundingClientRect(); if (!r.width && !r.height) return null
      return { x: r.left + r.width / 2 + (p.dx || 0), y: r.top + r.height / 2 + (p.dy || 0) }
    }
    return p
  }

  /* ---------- 效果佇列：world＝主城 Canvas（世界座標 px），screen＝整頁覆蓋層（螢幕 px） ---------- */
  const layers = { world: [], screen: [] }
  let shakeUntil = 0, shakeAmp = 0
  function add(layer, dur, draw, delay = 0) {
    const e = { t0: now() + delay, dur, draw }
    layers[layer].push(e)
    if (layer === 'screen') startOverlay()
    return e
  }
  function shake(amp, ms) { if (reduce) return; shakeAmp = Math.max(shakeAmp, amp); shakeUntil = Math.max(shakeUntil, now() + ms) }
  function shakeOffset() {
    const t = now(); if (t > shakeUntil) { shakeAmp = 0; return { x: 0, y: 0 } }
    return { x: Math.round(rnd(-shakeAmp, shakeAmp)), y: Math.round(rnd(-shakeAmp, shakeAmp)) }
  }
  function run(ctx, list) {
    const t = now()
    for (let i = list.length - 1; i >= 0; i--) {
      const e = list[i], k = (t - e.t0) / e.dur
      if (k < 0) continue
      if (k >= 1) { list.splice(i, 1); continue }
      ctx.save(); ctx.imageSmoothingEnabled = false
      try { e.draw(ctx, k) } catch (err) { list.splice(i, 1) }
      ctx.restore()
    }
  }
  const drawWorld = (ctx) => run(ctx, layers.world)

  // 覆蓋層（魔蛟、回合制戰鬥用）：有效果時才建立並跑動畫迴圈
  let ov = null, ovRaf = 0
  function startOverlay() {
    if (!ov) {
      ov = document.createElement('canvas')
      ov.setAttribute('aria-hidden', 'true')
      ov.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:80'
      document.body.appendChild(ov)
    }
    if (!ovRaf) ovRaf = requestAnimationFrame(ovFrame)
  }
  function ovFrame() {
    const dpr = window.devicePixelRatio || 1, w = window.innerWidth, h = window.innerHeight
    if (ov.width !== Math.round(w * dpr) || ov.height !== Math.round(h * dpr)) { ov.width = Math.round(w * dpr); ov.height = Math.round(h * dpr) }
    const ctx = ov.getContext('2d')
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h); ctx.imageSmoothingEnabled = false
    run(ctx, layers.screen)
    ovRaf = layers.screen.length ? requestAnimationFrame(ovFrame) : 0
    if (!ovRaf) ctx.clearRect(0, 0, w, h)
  }

  /* ---------- 繪圖小工具 ---------- */
  function glow(ctx, x, y, r, color, a = 1) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r)
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)')
    ctx.globalAlpha = a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1
  }
  function ring(ctx, x, y, r, color, w, a, sy = 0.5) {
    ctx.globalAlpha = a; ctx.strokeStyle = color; ctx.lineWidth = w
    ctx.beginPath(); ctx.ellipse(x, y, r, r * sy, 0, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1
  }
  function drawSword(ctx, x, y, ang, s = 1, a = 1) {   // ang：劍尖指向的角度
    ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(ang - Math.PI / 2); ctx.scale(s, s)
    if (ready(sword)) ctx.drawImage(sword, -5, -11)
    else { ctx.fillStyle = '#d0ecff'; ctx.fillRect(-1.5, -10, 3, 20); ctx.fillStyle = '#e8c050'; ctx.fillRect(-4, -4, 8, 2) }
    ctx.restore()
  }
  const parts = (n, f) => Array.from({ length: n }, (_, i) => f(i))
  function slashX(ctx, x, y, r, c, a) {   // 交叉斬痕
    ctx.globalAlpha = a; ctx.lineCap = 'round'
    for (const [d, w, col] of [[1, 5, c[2]], [1, 2.5, c[0]]]) {
      ctx.strokeStyle = col; ctx.lineWidth = w * d
      ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); ctx.stroke()
    }
    ctx.globalAlpha = 1
  }
  function burst(ctx, x, y, k, list, c, sizeMul = 1) {  // 往外噴的粒子
    for (const p of list) {
      const d = easeOut(k) * p.d, px = x + Math.cos(p.a) * d, py = y + Math.sin(p.a) * d * 0.7 + (p.g || 0) * k * k * 30
      ctx.globalAlpha = 1 - k; ctx.fillStyle = p.c || c[1]
      const s = Math.max(1, p.s * sizeMul * (1 - k * 0.6)); ctx.fillRect(px - s / 2, py - s / 2, s, s)
    }
    ctx.globalAlpha = 1
  }

  /* ---------- 攻擊招式：from 施法者、to 目標 ---------- */
  // 回傳命中時間（毫秒），讓傷害數字在動畫打到時才跳出來
  function strike(layer, skill, from, to, opt = {}) {
    const st = styleOf(skill), z = (layer === 'screen' ? 1.7 : 1) * (1 + (st.power - 1) * 0.3 + st.tier * 0.15)
    const owner = opt.owner
    const big = st.tier >= 2 || st.power >= 2.2
    const T = { sword: 520, thunder: 560, earth: 640, light: 600, blade: 760 }[st.kind] || 620
    const hitAt = { sword: 0.42, thunder: 0.28, earth: 0.35, light: 0.3, blade: 0.55 }[st.kind] || 0.5
    const c = st.c
    const sparks = parts(10 + st.tier * 6, () => ({ a: rnd(0, Math.PI * 2), d: rnd(12, 30) * z, s: rnd(2, 4), g: rnd(0, 1), c: Math.random() < 0.5 ? c[0] : c[1] }))
    const trail = []
    if (owner && (st.kind === 'sword')) busy[owner] = now() + T
    const impactFx = () => { if (big) shake(layer === 'world' ? 3 : 5, 200) }
    let impacted = false
    add(layer, T, (ctx, k) => {
      const a = P(from), b = P(to); if (!a || !b) return
      const ang = Math.atan2(b.y - a.y, b.x - a.x)
      if (k >= hitAt && !impacted) { impacted = true; impactFx() }
      const kt = seg(k, 0, hitAt), ki = seg(k, hitAt, 1)
      switch (st.kind) {
        case 'sword': {   // 御劍：飛出 → 斬擊 → 收劍
          let x, y
          if (k < hitAt) { const e = easeOut(kt); x = lerp(a.x, b.x, e); y = lerp(a.y, b.y, e) - Math.sin(e * Math.PI) * 10 * z }
          else { const e = easeIn(seg(k, hitAt + 0.15, 1)); x = lerp(b.x, a.x, e); y = lerp(b.y, a.y, e) - Math.sin(e * Math.PI) * 14 * z }
          trail.push({ x, y }); if (trail.length > 7) trail.shift()
          ctx.lineCap = 'round'
          for (let i = 1; i < trail.length; i++) { ctx.globalAlpha = i / trail.length * 0.7; ctx.strokeStyle = c[1]; ctx.lineWidth = 3 * z * i / trail.length; ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke() }
          ctx.globalAlpha = 1
          glow(ctx, x, y, 10 * z, 'rgba(127,216,255,.55)')
          drawSword(ctx, x, y, k < hitAt ? ang : ang + Math.PI, z * (layer === 'screen' ? 1 : 1))
          if (k >= hitAt && ki < 0.45) {
            const e = ki / 0.45
            ctx.globalAlpha = 1 - e; ctx.strokeStyle = c[0]; ctx.lineWidth = 3 * z
            ctx.beginPath(); ctx.arc(b.x, b.y, 14 * z, ang - 1.2 + e * 0.6, ang + 0.6 + e * 0.6); ctx.stroke()
            burst(ctx, b.x, b.y, e, sparks.slice(0, 8), c, z)
          }
          break
        }
        case 'thunder': {   // 天雷：從天而降
          const top = { x: b.x + rnd(-6, 6), y: b.y - 150 * z }
          if (k < hitAt + 0.25) {   // 雷光由上往下劈，命中後閃爍
            const reach = easeOut(seg(k, 0, hitAt)), n = 7
            const pts = [{ x: top.x, y: top.y }]
            for (let i = 1; i <= n; i++) { const e = i / n; if (e > reach) break; pts.push({ x: lerp(top.x, b.x, e) + (i === n ? 0 : rnd(-12, 12) * z), y: lerp(top.y, b.y, e) }) }
            if (reach < 1) pts.push({ x: lerp(top.x, b.x, reach), y: lerp(top.y, b.y, reach) })
            ctx.globalAlpha = k >= hitAt && Math.floor(k * 40) % 2 ? 0.5 : 1
            ctx.lineJoin = 'round'; ctx.lineCap = 'round'
            for (const [w, col] of [[7 * z, c[2]], [3 * z, c[1]], [1.5 * z, c[0]]]) {
              ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath()
              pts.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y))); ctx.stroke()
            }
            ctx.globalAlpha = 1
          }
          if (k >= hitAt) {
            glow(ctx, b.x, b.y, 40 * z * (1 - ki), 'rgba(255,255,200,.9)', 1 - ki)
            ring(ctx, b.x, b.y + 6, 30 * z * easeOut(ki), c[2], 3, 1 - ki)
            burst(ctx, b.x, b.y, ki, sparks, c, z)
          }
          break
        }
        case 'earth': {   // 地刺：從目標腳下竄出
          const n = 3 + st.tier * 2
          for (let i = 0; i < n; i++) {
            const ox = (i - (n - 1) / 2) * 9 * z, h = 26 * z * (1 - Math.abs(i - (n - 1) / 2) / n) + 8 * z
            const rise = easeOut(seg(k, i * 0.04, hitAt + 0.1)), fall = seg(k, 0.75, 1)
            const hh = h * rise * (1 - fall)
            ctx.fillStyle = c[2]; ctx.beginPath(); ctx.moveTo(b.x + ox - 6 * z, b.y + 10); ctx.lineTo(b.x + ox, b.y + 10 - hh); ctx.lineTo(b.x + ox + 6 * z, b.y + 10); ctx.fill()
            ctx.fillStyle = c[1]; ctx.beginPath(); ctx.moveTo(b.x + ox - 2 * z, b.y + 10); ctx.lineTo(b.x + ox, b.y + 10 - hh); ctx.lineTo(b.x + ox + 3 * z, b.y + 10); ctx.fill()
          }
          if (k >= hitAt) burst(ctx, b.x, b.y + 8, ki, sparks, ['#ffffff', '#d8c8a0', '#8a7050'], z)
          ring(ctx, b.x, b.y + 10, 24 * z * easeOut(k), c[1], 2, 0.6 * (1 - k))
          break
        }
        case 'light': {   // 光束
          const w = 10 * z * Math.sin(Math.min(1, k * 1.6) * Math.PI)
          ctx.lineCap = 'round'
          for (const [ww, col, al] of [[w * 2.2, c[2], 0.35], [w, c[1], 0.8], [w * 0.4, c[0], 1]]) { ctx.globalAlpha = al; ctx.strokeStyle = col; ctx.lineWidth = Math.max(0.5, ww); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke() }
          ctx.globalAlpha = 1
          glow(ctx, a.x, a.y, 14 * z * (1 - k), 'rgba(255,240,180,.8)')
          if (k >= hitAt) { glow(ctx, b.x, b.y, 34 * z * (1 - ki), 'rgba(255,250,210,.95)'); burst(ctx, b.x, b.y, ki, sparks, c, z) }
          break
        }
        case 'blade': {   // 萬劍歸宗：數把金劍從天而落
          const n = 3 + st.tier * 2
          for (let i = 0; i < n; i++) {
            const s0 = i * (hitAt / n) * 0.8, kk = seg(k, s0, s0 + hitAt * 0.5)
            if (kk <= 0) continue
            const ox = Math.sin(i * 2.3) * 16 * z, tx = b.x + ox, ty = b.y + Math.cos(i * 1.7) * 6
            if (kk < 1) drawSword(ctx, tx, lerp(ty - 120 * z, ty, easeIn(kk)), Math.PI / 2, z, 1)
            else { const e = seg(k, s0 + hitAt * 0.5, s0 + hitAt * 0.5 + 0.25); if (e < 1) { drawSword(ctx, tx, ty, Math.PI / 2, z, 1 - e); ring(ctx, tx, ty + 6, 12 * z * e, c[0], 2, 1 - e) } }
          }
          if (k >= hitAt) { slashX(ctx, b.x, b.y, 14 * z, c, 1 - ki); burst(ctx, b.x, b.y, ki, sparks, c, z) }
          break
        }
        default: {   // 飛行彈：火球、水箭、冰錐、藤葉、風刃、暗球、毒霧、血珠、靈氣彈
          if (k < hitAt) {
            const e = st.kind === 'wind' ? kt : easeIn(kt * 0.6 + 0.4 * kt)
            const x = lerp(a.x, b.x, e), y = lerp(a.y, b.y, e) - Math.sin(e * Math.PI) * (st.kind === 'fire' ? 18 : 6) * z
            trail.push({ x, y }); if (trail.length > 10) trail.shift()
            projectile(ctx, st, x, y, ang, z, k, trail)
          } else impact(ctx, st, b.x, b.y, ki, z, sparks, ang)
        }
      }
    })
    return Math.round(T * hitAt)
  }

  function projectile(ctx, st, x, y, ang, z, k, trail) {
    const c = st.c
    for (let i = 0; i < trail.length; i++) {   // 拖尾
      const p = trail[i], f = (i + 1) / trail.length
      ctx.globalAlpha = f * 0.5; ctx.fillStyle = st.kind === 'fire' ? (i % 2 ? c[2] : c[1]) : c[1]
      const s = (st.kind === 'fire' ? 6 : 3) * z * f; ctx.beginPath(); ctx.arc(p.x + (st.kind === 'fire' ? rnd(-2, 2) : 0), p.y, s, 0, Math.PI * 2); ctx.fill()
    }
    ctx.globalAlpha = 1
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang)
    switch (st.kind) {
      case 'fire':
        glow(ctx, 0, 0, 18 * z, 'rgba(255,150,60,.8)')
        ctx.fillStyle = c[2]; ctx.beginPath(); ctx.arc(0, 0, 8 * z, 0, Math.PI * 2); ctx.fill()
        ctx.fillStyle = c[1]; ctx.beginPath(); ctx.arc(1, 0, 5.5 * z, 0, Math.PI * 2); ctx.fill()
        ctx.fillStyle = c[0]; ctx.beginPath(); ctx.arc(2, 0, 3 * z, 0, Math.PI * 2); ctx.fill()
        break
      case 'water': case 'ice':
        glow(ctx, 0, 0, 14 * z, st.kind === 'ice' ? 'rgba(200,245,255,.7)' : 'rgba(110,210,245,.7)')
        ctx.fillStyle = c[2]; ctx.beginPath(); ctx.moveTo(12 * z, 0); ctx.lineTo(-10 * z, -4 * z); ctx.lineTo(-6 * z, 0); ctx.lineTo(-10 * z, 4 * z); ctx.fill()
        ctx.fillStyle = c[0]; ctx.beginPath(); ctx.moveTo(10 * z, 0); ctx.lineTo(-4 * z, -1.5 * z); ctx.lineTo(-4 * z, 1.5 * z); ctx.fill()
        break
      case 'wood':
        for (let i = 0; i < 3; i++) {
          const r = k * 30 + i * 2.1
          ctx.save(); ctx.translate(Math.cos(r) * 6 * z, Math.sin(r) * 6 * z); ctx.rotate(r)
          ctx.fillStyle = i % 2 ? c[1] : c[2]; ctx.beginPath(); ctx.ellipse(0, 0, 5 * z, 2.2 * z, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore()
        }
        glow(ctx, 0, 0, 10 * z, 'rgba(160,240,120,.6)')
        break
      case 'wind':
        for (let i = 0; i < 3; i++) {
          ctx.globalAlpha = 1 - i * 0.28; ctx.strokeStyle = i ? c[1] : c[0]; ctx.lineWidth = 2.5 * z
          ctx.beginPath(); ctx.arc(-i * 7 * z, 0, 10 * z, -1.1, 1.1); ctx.stroke()
        }
        break
      default: {   // dark / poison / blood / orb
        const wob = 1 + Math.sin(k * 60) * 0.12
        glow(ctx, 0, 0, 16 * z, st.kind === 'dark' ? 'rgba(160,90,224,.7)' : st.kind === 'poison' ? 'rgba(155,224,74,.6)' : st.kind === 'blood' ? 'rgba(255,90,90,.6)' : 'rgba(150,220,255,.7)')
        ctx.fillStyle = c[2]; ctx.beginPath(); ctx.arc(0, 0, 7 * z * wob, 0, Math.PI * 2); ctx.fill()
        ctx.fillStyle = c[1]; ctx.beginPath(); ctx.arc(-1, -1, 4.5 * z, 0, Math.PI * 2); ctx.fill()
        ctx.fillStyle = c[0]; ctx.fillRect(-2 * z, -3 * z, 2 * z, 2 * z)
      }
    }
    ctx.restore()
  }

  function impact(ctx, st, x, y, k, z, sparks, ang) {
    const c = st.c
    switch (st.kind) {
      case 'fire':
        glow(ctx, x, y, 36 * z * (0.6 + k * 0.6), 'rgba(255,170,60,.9)', 1 - k)
        ring(ctx, x, y + 6, 30 * z * easeOut(k), c[2], 4, 1 - k)
        burst(ctx, x, y, k, sparks.map((p) => ({ ...p, g: -p.g })), c, z * 1.2)
        break
      case 'water':
        ring(ctx, x, y + 6, 28 * z * easeOut(k), c[1], 3, 1 - k)
        ring(ctx, x, y + 6, 16 * z * easeOut(k), c[0], 2, 1 - k)
        burst(ctx, x, y - 4, k, sparks.map((p) => ({ ...p, g: 1.5 })), c, z)
        break
      case 'ice':
        ctx.lineCap = 'round'
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4 + 0.3, r = 22 * z * easeOut(k)
          ctx.globalAlpha = 1 - k; ctx.strokeStyle = i % 2 ? c[0] : c[1]; ctx.lineWidth = 3 * z * (1 - k * 0.5)
          ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * 0.3, y + Math.sin(a) * r * 0.3); ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.8); ctx.stroke()
        }
        ring(ctx, x, y + 6, 26 * z * easeOut(k), c[2], 2, 1 - k)
        glow(ctx, x, y, 20 * z, 'rgba(220,250,255,.8)', 1 - k)
        break
      case 'wood':
        for (const p of sparks) {
          const d = easeOut(k) * p.d, px = x + Math.cos(p.a) * d, py = y + Math.sin(p.a) * d * 0.7 + k * k * 18
          ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(px, py); ctx.rotate(p.a + k * 6)
          ctx.fillStyle = p.c === c[0] ? c[1] : c[2]; ctx.beginPath(); ctx.ellipse(0, 0, 4 * z, 1.8 * z, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore()
        }
        break
      case 'wind':
        ctx.lineCap = 'round'
        for (let i = 0; i < 3; i++) {
          const e = seg(k, i * 0.12, 0.6 + i * 0.12), r = 16 * z
          if (e <= 0 || e >= 1) continue
          ctx.globalAlpha = 1 - e; ctx.strokeStyle = c[i % 2 ? 1 : 0]; ctx.lineWidth = 3 * z
          ctx.beginPath(); ctx.moveTo(x - r + i * 4, y - r * (1 - 2 * e)); ctx.lineTo(x + r - i * 4, y + r * (1 - 2 * e) * 0.5); ctx.stroke()
        }
        break
      case 'dark': case 'poison': case 'blood': {
        const r = k < 0.35 ? 26 * z * (1 - k / 0.35) : 30 * z * easeOut(seg(k, 0.35, 1))   // 先內縮再炸開
        ring(ctx, x, y, r, c[1], 3, 1 - k * 0.8, 0.8)
        for (const p of sparks.slice(0, 8)) {   // 煙霧
          const e = seg(k, 0.35, 1), d = e * p.d
          ctx.globalAlpha = (1 - e) * 0.55; ctx.fillStyle = c[2]
          ctx.beginPath(); ctx.arc(x + Math.cos(p.a) * d, y + Math.sin(p.a) * d * 0.6 - e * 10, (4 + e * 8) * z, 0, Math.PI * 2); ctx.fill()
        }
        glow(ctx, x, y, 18 * z, st.kind === 'blood' ? 'rgba(255,60,60,.8)' : st.kind === 'poison' ? 'rgba(160,230,80,.7)' : 'rgba(170,100,240,.8)', 1 - k)
        break
      }
      default:
        glow(ctx, x, y, 28 * z * (0.5 + k), 'rgba(180,235,255,.9)', 1 - k)
        ring(ctx, x, y + 4, 24 * z * easeOut(k), c[1], 3, 1 - k)
        burst(ctx, x, y, k, sparks, c, z)
    }
  }

  /* ---------- 自身施展：回復、靈力、增益 ---------- */
  function selfCast(layer, skill, at) {
    const z = layer === 'screen' ? 1.6 : 1, st = styleOf(skill)
    const ef = (skill.effects || [])
    const has = (t) => ef.some((e) => e.t === t)
    const buff = ef.find((e) => e.t !== 'dmg' && e.t !== 'heal' && e.t !== 'mp')
    const pts = parts(14, (i) => ({ a: i / 14 * Math.PI * 2 + rnd(-0.2, 0.2), r: rnd(14, 24), s: rnd(0.6, 1.2), d: rnd(0, 0.3) }))
    if (has('heal')) add(layer, 1100, (ctx, k) => {   // 回復：綠光上升的「十」字
      const p = P(at); if (!p) return
      ring(ctx, p.x, p.y + 14 * z, 22 * z * easeOut(k), '#8fe36a', 3, 1 - k)
      glow(ctx, p.x, p.y, 26 * z, 'rgba(140,240,140,.55)', 1 - k)
      ctx.fillStyle = '#c8ffb0'
      for (const q of pts.slice(0, 8)) {
        const e = seg(k, q.d, q.d + 0.7); if (e <= 0 || e >= 1) continue
        const x = p.x + Math.cos(q.a) * q.r * z * 0.8, y = p.y + 12 * z - e * 36 * z, s = 2 * z * q.s
        ctx.globalAlpha = 1 - e; ctx.fillRect(x - s * 1.5, y - s / 2, s * 3, s); ctx.fillRect(x - s / 2, y - s * 1.5, s, s * 3)
      }
    })
    if (has('mp')) add(layer, 1000, (ctx, k) => {   // 回靈：藍色靈氣向內收攏
      const p = P(at); if (!p) return
      for (const q of pts) {
        const e = easeIn(seg(k, q.d, q.d + 0.7)); if (e >= 1) continue
        const a = q.a + e * 2.5, r = q.r * 1.6 * z * (1 - e)
        ctx.globalAlpha = 0.9 * (1 - e * 0.3); ctx.fillStyle = e > 0.5 ? '#e6fbff' : '#6fd3f5'
        ctx.fillRect(p.x + Math.cos(a) * r - 1.5, p.y + Math.sin(a) * r * 0.8 - 1.5, 3 * q.s * z, 3 * q.s * z)
      }
      glow(ctx, p.x, p.y, 22 * z * k, 'rgba(110,210,245,.6)', 1 - k)
    })
    if (buff) {
      const stat = buff.stat || buff.t
      if (stat === 'def') add(layer, 1300, (ctx, k) => {   // 減傷：金色護體罩
        const p = P(at); if (!p) return
        const r = 22 * z * (k < 0.2 ? easeOut(k / 0.2) : 1), a = k < 0.7 ? 0.9 : 0.9 * (1 - seg(k, 0.7, 1))
        ctx.globalAlpha = a * 0.25; ctx.fillStyle = '#ffe08a'
        hex(ctx, p.x, p.y, r); ctx.fill()
        ctx.globalAlpha = a; ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 2.5; hex(ctx, p.x, p.y, r); ctx.stroke()
        ctx.strokeStyle = '#fff6c8'; ctx.lineWidth = 1; hex(ctx, p.x, p.y, r * 0.75 + Math.sin(k * 20) * 1.5); ctx.stroke()
      })
      else add(layer, 1200, (ctx, k) => {   // 攻擊／修煉／靈寵等增益：腳下陣圖 + 上升氣柱
        const p = P(at); if (!p) return
        const col = stat === 'atk' ? ['#ffe0a0', '#ff8a3c', '#c0301c'] : stat === 'cultivate' ? ['#ffffff', '#b8f0d8', '#4fb8a0'] : st.c
        const fy = p.y + 14 * z
        ctx.save(); ctx.translate(p.x, fy); ctx.scale(1, 0.45); ctx.rotate(k * 3)
        ctx.globalAlpha = 1 - k; ctx.strokeStyle = col[1]; ctx.lineWidth = 2
        ctx.beginPath(); ctx.arc(0, 0, 20 * z, 0, Math.PI * 2); ctx.stroke()
        ctx.beginPath(); for (let i = 0; i < 9; i++) { const a = i * Math.PI * 0.8; ctx.lineTo(Math.cos(a) * 18 * z, Math.sin(a) * 18 * z) } ctx.stroke()
        ctx.restore()
        for (const q of pts.slice(0, 10)) {
          const e = seg(k, q.d, q.d + 0.6); if (e <= 0 || e >= 1) continue
          const x = p.x + Math.cos(q.a) * 14 * z
          ctx.globalAlpha = (1 - e) * 0.9; ctx.fillStyle = e < 0.4 ? col[0] : col[1]
          ctx.fillRect(x - 1, fy - e * 40 * z, 2 * z, 7 * z)
        }
        glow(ctx, p.x, p.y, 24 * z, col[1] === '#ff8a3c' ? 'rgba(255,140,60,.45)' : 'rgba(180,240,210,.45)', 1 - k)
      })
    }
    if (!has('heal') && !has('mp') && !buff && !has('dmg')) add(layer, 900, (ctx, k) => { const p = P(at); if (p) glow(ctx, p.x, p.y, 26 * z, 'rgba(180,235,255,.7)', 1 - k) })
  }
  function hex(ctx, x, y, r) { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r * 1.1) } ctx.closePath() }

  /* ---------- 功法名稱浮字、受擊 ---------- */
  function callout(layer, at, text, color = '#ffe28a') {
    add(layer, 1100, (ctx, k) => {
      const p = P(at); if (!p) return
      const s = layer === 'screen' ? 22 : 15, y = p.y - 26 - easeOut(k) * 16
      ctx.globalAlpha = k < 0.15 ? k / 0.15 : 1 - seg(k, 0.65, 1)
      ctx.font = `900 ${s}px "Noto Serif TC", serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,15,5,.85)'; ctx.strokeText(`「${text}」`, p.x, y)
      ctx.fillStyle = color; ctx.fillText(`「${text}」`, p.x, y)
    })
  }
  function hurt(layer, at) {
    const z = layer === 'screen' ? 1.6 : 1
    add(layer, 380, (ctx, k) => {
      const p = P(at); if (!p) return
      glow(ctx, p.x, p.y, 22 * z, 'rgba(255,60,40,.7)', 1 - k)
      slashX(ctx, p.x, p.y, 8 * z * (0.6 + k * 0.4), ['#ffffff', '#ff8a7a', '#c0301c'], 1 - k)
    })
  }

  /* ---------- 劍修角色（取代原本的方塊人；圖沒載到時回傳 false 改用舊畫法） ---------- */
  const ROW = { d: 0, l: 1, r: 2, u: 3 }
  // 飛劍相對腳底中心的位置 [x, y, 畫在身體後面]
  const SWORD_AT = { d: [13, -23, false], u: [-23, -23, false], r: [-22, -25, true], l: [12, -25, true] }
  const actors = {}, busy = {}
  function drawActor(ctx, px, py, f, name) {
    if (!ready(sheet)) return false
    ctx.save(); ctx.imageSmoothingEnabled = false
    const t = now(), dir = ROW[f] != null ? f : 'd'
    let s = actors[name]; if (!s) s = actors[name] = { x: px, y: py, mv: 0 }
    if (Math.hypot(px - s.x, py - s.y) > 0.25) s.mv = t
    s.x = px; s.y = py
    const moving = t - s.mv < 140
    const col = moving ? Math.floor(t / 125) % 4 : 4 + (Math.floor(t / 500) % 2)
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(px, py + 8, 10, 4, 0, 0, Math.PI * 2); ctx.fill()
    const [sx, sy, behind] = SWORD_AT[dir]
    const showSword = !(busy[name] > t)
    const drawIdleSword = () => {
      if (!showSword || !ready(sword)) return
      const x = Math.round(px + sx), y = Math.round(py + sy + Math.sin(t / 330) * 2)
      glow(ctx, x + 5, y + 14, 9, 'rgba(127,216,255,.35)')
      ctx.drawImage(sword, x, y)
    }
    if (behind) drawIdleSword()
    ctx.drawImage(sheet, col * 32, ROW[dir] * 48, 32, 48, Math.round(px - 16), Math.round(py + 9 - 48), 32, 48)
    if (!behind) drawIdleSword()
    ctx.restore()
    return true
  }

  return { strike, selfCast, callout, hurt, drawActor, drawWorld, shakeOffset, styleOf, OVERRIDE, KINDS }
})()
</script>
<script>
  /* =========================================================
   * 遊戲基礎數值設定
   * 要調整境界層數上限／氣血・靈力上限／運功消耗，改這裡即可。
   * ========================================================= */
  /* 遊戲資料與規則都在 shared/game-rules.js（前端與伺服器共用）。
   * 要調整數值、新增道具／秘境／宗門，請改那個檔案；這裡的前端只負責「顯示」與「把操作送給伺服器」。 */
  const R = GameRules

      ${own ? `<h3 class="panel-title" style="font-size:12px;margin:14px 0 8px">本宗專屬</h3><ul class="item-list">${own}</ul>` : ''}
      <h3 class="panel-title" style="font-size:12px;margin:18px 0 8px">通用煉器</h3>
      <ul class="item-list">${gen}</ul>`
  }

  function refreshAfterItem() {
    render()
    if (['bag', 'market', 'auction', 'pets', 'sect', 'character'].includes(infoView())) renderInfo()
  }



  /* =========================================================
   * 連線層（ORPG）：登入、SSE 即時推送、聊天、PvP、共享拍賣、世界 Boss
   * 連線模式：登入後 net.token 才有值
   * ========================================================= */
  const net = { token: null, name: null, es: null, up: false, online: [], auctions: [], boss: null, chat: [], offset: 0, seenMail: new Set(), tickN: 0 }
  const isOnline = () => !!net.token
  const pname = () => net.name || '雲逸'
  const serverNow = () => Date.now() + net.offset
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

  async function api(path, payload) {
    try {
      const r = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ token: net.token }, payload)) })
      const j = await r.json().catch(() => ({}))
      if (dc.since && !dc.fatal && net.up) hideDisconnect()   // 只有請求曾失敗、串流沒斷：請求成功即視為恢復
      if (!r.ok) return { ok: false, error: j.error || '請求失敗' }
      return j
    } catch (e) { if (net.token) showDisconnect(false); return { ok: false, error: '無法連線到伺服器' } }
  }
  // 存檔：伺服器若判定不合理會拒收（第一階段的存檔檢查），並傳回伺服器上的版本，這裡直接套用還原

  function setNet(up) {
    net.up = up
    const b = $('netBadge'); if (!b) return
    b.textContent = up ? `在線 · ${net.online.length} 人` : '連線中…'
    b.style.color = up ? 'var(--primary)' : 'var(--destructive)'
  }



  /* ========== 斷線提醒視窗 ==========
   * 串流中斷時，瀏覽器會自動重連；超過 DC_GRACE 毫秒仍未恢復就彈出視窗，恢復連線後自動關閉。
   * 連線被伺服器判定失效（readyState = CLOSED，例如伺服器重啟）時立即彈出，只能重新整理。 */
  const DC_GRACE = 4000
  const dc = { el: null, timer: 0, fatal: false, since: 0, tm: 0 }
  function dcBuild() {
    if (dc.el) return dc.el
    const el = document.createElement('div')
    el.setAttribute('role', 'alertdialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'dcTitle')
    el.style.cssText = 'position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.65);backdrop-filter:blur(3px)'
    el.innerHTML = `
      <div class="panel" style="width:min(380px,92vw);padding:24px;text-align:center">
        <div style="font-size:34px;line-height:1" aria-hidden="true">📡</div>
        <h2 id="dcTitle" class="panel-title" style="margin:10px 0 8px;font-size:16px">與天道的連線中斷</h2>
        <p id="dcMsg" class="xs" style="line-height:1.8;margin-bottom:6px"></p>
        <p id="dcTime" class="xs muted" style="margin-bottom:16px"></p>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button type="button" class="btn btn-gold" id="dcReload">重新整理頁面</button>
          <button type="button" class="small-btn" id="dcClose">稍後再說</button>
        </div>
      </div>`
    document.body.appendChild(el)
    el.querySelector('#dcReload').addEventListener('click', () => location.reload())
    el.querySelector('#dcClose').addEventListener('click', () => { el.style.display = 'none' })
    dc.el = el
    return el
  }
  function dcPaint() {
    const el = dcBuild()
    el.querySelector('#dcMsg').innerHTML = dc.fatal
      ? '連線已被伺服器終止（可能是伺服器重啟或登入已失效）。<br>請重新整理頁面並重新登入。'
      : '正在嘗試自動重新連線……<br>連線期間你的角色無法同步，野外妖獸仍可能攻擊你。恢復後會回到主城。'
    el.querySelector('#dcTime').textContent = dc.since ? `已中斷 ${Math.max(1, Math.round((Date.now() - dc.since) / 1000))} 秒` : ''
    el.querySelector('#dcClose').style.display = dc.fatal ? 'none' : ''
  }
  function showDisconnect(fatal) {
    if (!net.token) return
    if (!dc.since) dc.since = Date.now()
    if (fatal) dc.fatal = true
    const open = () => { dc.timer = 0; dcPaint(); dcBuild().style.display = 'flex'; if (!dc.tm) dc.tm = setInterval(dcPaint, 1000) }
    if (dc.fatal) { if (dc.timer) { clearTimeout(dc.timer); dc.timer = 0 } open(); return }
    if (!dc.timer && dc.el?.style.display !== 'flex') dc.timer = setTimeout(open, DC_GRACE)
  }
  function hideDisconnect() {
    if (dc.timer) { clearTimeout(dc.timer); dc.timer = 0 }
    if (dc.tm) { clearInterval(dc.tm); dc.tm = 0 }
    const was = dc.el && dc.el.style.display === 'flex'
    dc.since = 0; dc.fatal = false
    if (dc.el) dc.el.style.display = 'none'
    if (was) addLog('已重新連上伺服器。', 'success')
  }
  window.addEventListener('offline', () => showDisconnect(false))
  window.addEventListener('online', () => { if (dc.el && dc.el.style.display === 'flex' && !dc.fatal) dcPaint() })

  function connectStream() {
    const es = new EventSource('/api/stream?token=' + net.token)
    net.es = es
    const on = (ev, fn) => es.addEventListener(ev, (e) => { try { fn(JSON.parse(e.data)) } catch (err) {} })
    on('hello', (d) => { hideDisconnect(); if (d.town) { town.map = town.townMap = d.town; town.curMap = 'town'; town.mobs = {}; town.players = {}; town.inited = false; townSetPlayers(d.pos) } net.offset = d.serverTime - Date.now(); net.online = d.online; net.auctions = d.auctions; net.boss = d.boss; net.chat = d.chat; setNet(true); refreshNet('all') })
    on('pos', (d) => townSetPlayers(d))
    on('mon', (d) => townSetMobs(d))
    on('hit', (d) => fieldHit(d))
    on('kill', (d) => fieldKill(d))
    on('defeat', (d) => fieldDefeat(d))
    on('presence', (d) => { net.online = d; setNet(true); refreshNet('presence') })
    on('chat', (m) => { net.chat.push(m); if (net.chat.length > 80) net.chat.shift(); refreshNet('chat') })
    on('auctions', (d) => { net.auctions = d; refreshNet('auctions') })
    on('boss', (d) => { net.boss = d; refreshNet('boss') })
    on('mail', (d) => { if (d.state) applyServerState(d.state); applyMail(d.mail) })
    es.onerror = () => {
      setNet(false)
      if (es.readyState === EventSource.CLOSED) { addLog('與伺服器的連線已中斷，請重新整理頁面並重新登入。', 'danger'); showDisconnect(true) }
      else showDisconnect(false)   // 瀏覽器會自動重連；超過寬限時間仍未恢復才彈窗
    }
  }

  function refreshNet(kind) {
    if (kind === 'chat') { if (infoView() === 'world') updateChat(); return }
    if (kind === 'presence') { if (infoView() === 'world') updateOnline(); return }
    if (kind === 'auctions') { if (infoView() === 'auction') renderInfo(); return }
    if (kind === 'boss') { if (infoView() === 'boss') renderInfo(); return }
    renderInfo()
  }

  function updateChat() {
    const el = $('chatLog'); if (!el) return
    el.innerHTML = net.chat.map((m) => {
      const t = new Date(m.t).toTimeString().slice(0, 5)
      if (m.sys) return `<li style="color:var(--accent)">${t} 【天道】${esc(m.text)}</li>`
      if (m.to) return `<li style="color:var(--primary)">${t} [密語] ${esc(m.from)} → ${esc(m.to)}：${esc(m.text)}</li>`
      return `<li>${t} <span class="bold" style="font-size:12px">${esc(m.from)}</span>：${esc(m.text)}</li>`
    }).join('')
    el.scrollTop = el.scrollHeight
  }
  function updateOnline() {
    const el = $('onlineList'); if (!el) return
    $('onlineCount').textContent = `（${net.online.length}）`
    el.innerHTML = net.online.map((p) => {
      const me = p.name.toLowerCase() === (net.name || '').toLowerCase()
      const sect = (SECTS.find((s) => s.id === p.sect) || {}).name || ''
      return `<li class="row xs"><span><span class="bold" style="font-size:13px">${esc(p.name)}</span> <span class="muted">${REALMS[p.realm] || ''}期第${NUM[p.layer - 1] || ''}層 ${sect}</span></span>${me ? '<span class="muted">你</span>' : `<span style="display:flex;gap:6px"><button type="button" class="small-btn" data-whisper="${esc(p.name)}">密語</button><button type="button" class="small-btn" data-pvp="${esc(p.name)}">切磋</button></span>`}</li>`
    }).join('')
  }
  function renderWorld() {
    return `
      <div class="card" style="margin-bottom:12px">
        <h3 class="xs muted" style="letter-spacing:.2em;margin-bottom:8px">線上修士<span id="onlineCount"></span></h3>
        <ul class="stack" id="onlineList" style="gap:8px;max-height:150px;overflow-y:auto"></ul>
      </div>
      <ol class="battle-log xs" id="chatLog" style="max-height:230px;margin-top:0" aria-live="polite"></ol>
      <form id="chatForm" class="row" style="gap:8px;margin-top:10px">
        <input id="chatInput" class="exchange-input" maxlength="100" placeholder="世界頻道發言，或 /w 道號 內容" autocomplete="off" aria-label="聊天訊息" />
        <button type="submit" class="small-btn">發送</button>
      </form>
      <p class="xs muted" style="margin-top:8px;line-height:1.7">聊天內容（含私訊）會被記錄，管理員可能檢視；不當言論或騷擾可能被禁言。</p>`
  }
  async function sendChat(raw) {
    let text = raw.trim(), to
    if (!text) return
    const m = text.match(/^\/w\s+(\S+)\s+([\s\S]+)/)
    if (m) { to = m[1]; text = m[2] }
    const r = await api('chat', { text, to })
    if (!r.ok) addLog(r.error, 'danger')
  }

  /* ---------- 玩家回報（BUG／建議）----------
   * 玩家在「回報」分頁送出 → /api/report → 存進伺服器 db.reports（最多 200 筆），GM 在 GM 分頁查看、標記已處理或刪除。
   * 會自動附上：目前分頁、境界、宗門、瀏覽器資訊，方便重現問題。 */
  const REPORT_TYPES = ['BUG／錯誤', '建議', '其他']
  function renderReport() {
    return `
      <div class="card stack" style="gap:10px">
        <h3 class="xs muted" style="letter-spacing:.2em">回報問題 · 意見反饋</h3>
        <p class="xs muted" style="line-height:1.7">遇到錯誤、數值異常或有想法，請在這裡告訴我們。寫清楚「在哪個畫面、做了什麼、發生什麼事」最容易處理。系統會自動附上你的道號、境界與目前畫面。</p>
        <label class="xs">類型
          <select id="reportType" class="exchange-input">${REPORT_TYPES.map((t) => `<option>${t}</option>`).join('')}</select>
        </label>
        <label class="xs">內容（最多 500 字）
          <textarea id="reportText" class="exchange-input" rows="6" maxlength="500" placeholder="例如：在拍賣場上架物品後，背包數量沒有減少…" style="resize:vertical;width:100%"></textarea>
        </label>
        <button type="button" class="small-btn" data-report-send>送出回報</button>
      </div>`
  }
  async function sendReport() {
    const text = $('reportText').value.trim(), type = $('reportType').value
    if (text.length < 5) return addLog('請至少寫 5 個字，說明遇到的問題。', 'danger')
    const ctx = { page: state.lastNav || state.nav, realm: state.realm, layer: state.layer, sect: state.sect || '', ua: String(navigator.userAgent || '').slice(0, 120) }
    const r = await api('report', { type, text, ctx })
    if (!r.ok) return addLog(r.error || '回報失敗', 'danger')
    $('reportText').value = ''
    addLog('回報已送出，感謝你的反饋！', 'gold')
  }
  async function loadReports() {
    const r = await api('gm/reports', {})
    state.gmReports = r.ok ? r.reports : []
    if (infoView() === 'gm') renderInfo()
  }
  async function actReport(id, action) {
    if (action === 'delete' && !confirm('確定刪除這筆回報？')) return
    const r = await api('gm/report', { id, action })
    if (!r.ok) return addLog(r.error || '操作失敗', 'danger')
    loadReports()
  }
  function renderGMReports() {
    if (state.gmReports === undefined) { state.gmReports = null; loadReports() }
    const list = state.gmReports
    const fmt = (t) => new Date(t).toLocaleString('zh-TW', { hour12: false })
    const items = !list ? '<p class="xs muted">載入中…</p>' : !list.length ? '<p class="xs muted">目前沒有回報。</p>' : list.slice().reverse().map((x) => `
      <div class="card" style="${x.done ? 'opacity:.55' : ''}">
        <div class="row" style="align-items:baseline"><span class="bold">${esc(x.from)}</span><span class="xs muted">${fmt(x.t)}</span></div>
        <span class="xs" style="color:var(--accent)">${esc(x.type)}${x.done ? ' · 已處理' : ''}</span>
        <p class="xs" style="margin-top:4px;line-height:1.7;white-space:pre-wrap;word-break:break-all">${esc(x.text)}</p>
        <p class="xs muted" style="margin-top:4px;word-break:break-all">畫面：${esc((x.ctx || {}).page || '?')}　境界：${esc((x.ctx || {}).realm)}-${esc((x.ctx || {}).layer)}　宗門：${esc((x.ctx || {}).sect || '無')}<br>${esc((x.ctx || {}).ua || '')}</p>
        <div class="actions" style="justify-content:flex-start;gap:8px;margin-top:6px">
          <button type="button" class="small-btn" data-report-act="${x.id}" data-act="${x.done ? 'undone' : 'done'}">${x.done ? '標為未處理' : '標為已處理'}</button>
          <button type="button" class="small-btn" data-report-act="${x.id}" data-act="delete">刪除</button>
        </div>
      </div>`).join('')
    return `
      <div class="card stack" style="gap:10px;margin-top:14px">
        <div class="row"><h3 class="xs muted" style="letter-spacing:.2em">玩家回報${list ? `（${list.filter((x) => !x.done).length} 筆未處理）` : ''}</h3><button type="button" class="small-btn" data-report-reload>重新整理</button></div>
        ${items}
      </div>`
  }

  /* GM 面板：發送靈石／道具給指定玩家（用於活動、補償）。伺服器會再次驗證 GM 身分，這裡只是介面。 */
  function renderGM() {
    if (!state.isGM) return '<p class="xs muted">無權限。</p>'
    const rank = { '普通': 0, '精良': 1, '稀有': 2, '史詩': 3 }
    const opts = Object.entries(ITEMS).filter(([id]) => /^[A-Za-z]{1,24}$/.test(id))
      .sort((a, b) => (rank[a[1].rarity] || 0) - (rank[b[1].rarity] || 0) || String(a[1].name).localeCompare(String(b[1].name)))
      .map(([id, d]) => `<option value="${id}">${d.icon || ''} ${esc(d.name || id)}（${d.rarity || '—'}）</option>`).join('')
    const online = net.online.map((p) => `<option value="${esc(p.name)}"></option>`).join('')
    return `
      <div class="card stack" style="gap:10px">
        <h3 class="xs muted" style="letter-spacing:.2em">天道傳書 · 發送獎勵／補償</h3>
        <p class="xs muted">玩家在線會立即收到；離線則下次登入時自動入帳。</p>
        <label class="xs">玩家道號
          <input id="gmTarget" class="exchange-input" list="gmOnlineList" maxlength="12" placeholder="輸入道號（線上玩家可下拉選）" autocomplete="off" />
          <datalist id="gmOnlineList">${online}</datalist>
        </label>
        <label class="xs">靈石數量（可留空）
          <input id="gmStones" class="exchange-input" type="number" min="0" max="1000000000" placeholder="0" />
        </label>
        <label class="xs">道具（可留空）
          <select id="gmItem" class="exchange-input"><option value="">— 不送道具 —</option>${opts}</select>
        </label>
        <label class="xs">道具數量
          <input id="gmQty" class="exchange-input" type="number" min="1" max="99999" value="1" />
        </label>
        <label class="xs">傳書備註（玩家會看到，例如「停機補償」）
          <input id="gmMsg" class="exchange-input" maxlength="60" placeholder="選填" autocomplete="off" />
        </label>
        <button type="button" class="small-btn" data-gm-send>發送</button>
      </div>${renderGMResetPw()}${renderGMChat()}${renderGMReports()}`
  }
  async function sendGM() {
    const target = $('gmTarget').value.trim(), stones = Math.floor(Number($('gmStones').value) || 0)
    const item = $('gmItem').value, qty = Math.floor(Number($('gmQty').value) || 1), text = $('gmMsg').value.trim()
    if (!target) return addLog('請輸入玩家道號', 'danger')
    if (stones <= 0 && !item) return addLog('請至少填寫靈石數量或選擇道具', 'danger')
    const parts = []
    if (stones > 0) parts.push(`${stones} 靈石`)
    if (item) parts.push(`${(ITEMS[item] || {}).name || item} × ${qty}`)
    if (!confirm(`確定發送給「${target}」？\n${parts.join('、')}${text ? `\n備註：${text}` : ''}`)) return
    const r = await api('gm/send', { target, stones: Math.max(0, stones), item, qty, text })
    if (!r.ok) return addLog(r.error || '發送失敗', 'danger')
    addLog(`已發送給「${r.to}」：${parts.join('、')}（${r.online ? '對方在線，已即時送達' : '對方離線，下次登入入帳'}）`, 'gold')
    $('gmStones').value = ''; $('gmItem').value = ''; $('gmQty').value = '1'; $('gmMsg').value = ''
  }

  /* ---------- GM：聊天紀錄與禁言 ----------
   * 伺服器記錄最近 500 則聊天（含密語、含被關鍵字過濾前的原文），這裡查詢最近 200 則；禁言與解除走 /api/gm/mute。 */
  async function loadChatLog() {
    const q = ($('gmChatQ') && $('gmChatQ').value.trim()) || ''
    const r = await api('gm/chatlog', { q })
    if (!r.ok) addLog(r.error || '載入聊天紀錄失敗', 'danger')
    state.gmChat = r.ok ? r.log : []
    state.gmMutes = r.ok ? r.mutes : []
    if (infoView() === 'gm') renderInfo()
  }
  const muteLabel = (m) => (m >= 525600 ? '永久' : m >= 1440 ? `${m / 1440} 天` : m >= 60 ? `${m / 60} 小時` : `${m} 分鐘`)
  async function doMute(name, minutes) {
    name = String(name || '').trim()
    if (!name) return addLog('請輸入要禁言的道號', 'danger')
    if (!confirm(minutes > 0 ? `確定禁言「${name}」${muteLabel(minutes)}？` : `確定解除「${name}」的禁言？`)) return
    const r = await api('gm/mute', { target: name, minutes })
    if (!r.ok) return addLog(r.error || '操作失敗', 'danger')
    addLog(minutes > 0 ? `已禁言「${r.name}」${muteLabel(minutes)}。` : `已解除「${r.name}」的禁言。`, 'gold')
    loadChatLog()
  }
  /* ---------- 密碼：玩家自行修改（角色分頁最下方）與 GM 重設（GM 分頁）----------
   * 伺服器只存密碼的雜湊值，任何人（包括 GM）都看不到原密碼；玩家忘記時由 GM 重設一組新密碼再告知玩家。 */
  function renderChangePw() {
    if (state.isGM || !isOnline()) return ''
    return `
      <div class="card stack" style="gap:8px;margin-top:14px">
        <h3 class="xs muted" style="letter-spacing:.2em">帳號安全 · 修改密碼</h3>
        <input id="pwOld" class="exchange-input" type="password" maxlength="64" placeholder="目前密碼" autocomplete="current-password" />
        <input id="pwNew" class="exchange-input" type="password" maxlength="64" placeholder="新密碼（至少 6 字元）" autocomplete="new-password" />
        <input id="pwNew2" class="exchange-input" type="password" maxlength="64" placeholder="再輸入一次新密碼" autocomplete="new-password" />
        <button type="button" class="small-btn" data-pw-change>修改密碼</button>
        <p class="xs muted">修改後，其他裝置上的登入會被登出。</p>
      </div>`
  }
  async function changePw() {
    const old = $('pwOld').value, pw = $('pwNew').value, pw2 = $('pwNew2').value
    if (!old) return addLog('請輸入目前密碼。', 'danger')
    if (pw.length < 6) return addLog('新密碼至少 6 字元。', 'danger')
    if (pw !== pw2) return addLog('兩次輸入的新密碼不一致。', 'danger')
    const r = await api('password', { old, pw })
    if (!r.ok) return addLog(r.error || '修改密碼失敗', 'danger')
    $('pwOld').value = ''; $('pwNew').value = ''; $('pwNew2').value = ''
    addLog('密碼已修改，下次登入請使用新密碼。', 'gold')

  /* 拍賣建議售價（每件單價）
   *   參考一：全服目前同款拍賣品的每件單價平均（有市場行情時優先採用）
   *   參考二：道具基準價 ITEMS.sell；NPC 上架價約為其 0.8～1.6 倍，所以建議區間取 0.8～1.6 倍，推薦 1.2 倍
   *   起標價太高會流拍，太低會吃虧：推薦價 = 行情均價（或 1.2 倍基準價），保守價 = 0.8 倍、搶手價 = 1.6 倍 */
  function suggestPrice(id) {
    const def = ITEMS[id]; if (!def) return null
    const base = def.sell
    const same = (net.auctions || []).filter((a) => a.item === id && a.qty > 0)
    const market = same.length ? Math.round(same.reduce((s, a) => s + a.current / a.qty, 0) / same.length) : 0
    const rec = Math.max(1, market || Math.round(base * 1.4))
    return { base, market, count: same.length, low: Math.max(1, Math.round(base * 1.1)), rec, high: Math.max(rec, Math.round(base * 1.8)) }
  }
  function updateListSuggest(fill) {
    const box = $('listSuggest'); if (!box) return
    const sel = $('listItemSelect'), id = sel && sel.value
    const s = id && suggestPrice(id)
    if (!s) { box.innerHTML = ''; return }
    const qty = Math.max(1, Math.floor(Number($('listQty') && $('listQty').value) || 1))
    const price = Math.floor(Number($('listPrice') && $('listPrice').value) || 0)
    if (fill && $('listPrice')) $('listPrice').value = s.rec
    const cur = fill ? s.rec : price
    const verdict = !cur ? '' : cur < s.low ? '<span style="color:var(--destructive)">低於建議區間，可能賣虧</span>' : cur > s.high ? '<span style="color:var(--destructive)">高於建議區間，容易流拍</span>' : '<span style="color:var(--primary)">在合理區間內</span>'
    box.innerHTML = `
      <div class="muted">基準價 ${s.base} 靈石／件${s.count ? `　全服同款 ${s.count} 筆，行情均價約 ${s.market}` : '　目前全服無同款行情'}</div>

      <div class="muted">${qty} 件起標總價：${(cur * qty).toLocaleString()} 靈石</div>`
  }

  }

  /* ---- Tile 素材（亮色像素風）：每種地形一個繪製函式，畫好後快取成 32×32 小畫布重複使用 ----
   * .草地 ,石板地坪 =道路 H橋 ~河流 B建築 #樹 W城牆 R岩石 F圍籬

  const townRow = (x, y) => { const r = town.map.rows[y]; return r ? r[x] : undefined }
  const tHash = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0
  const px1 = (g, x, y, c, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x, y, w, h) }
  const COBBLE = ['#c4c3bd', '#b9b8b2', '#cfcec8', '#b2b1ab']
  function drawGrass(g, v, th) {
    px1(g, 0, 0, v % 2 ? th.g1 : th.g2, TS, TS)

    for (let i = 0; i < 5; i++) { const x = r(i), y = r(i + 9); px1(g, x, y, 'rgba(255,255,255,.16)', 2, 2) }   // 亮點

  }

    px1(g, 0, 0, tint ? '#a5a49e' : '#9e9d97', TS, TS)
    for (let row = 0; row < 4; row++) for (let col = -1; col < 4; col++) {

    }
  }
  const TILE_DRAW = {
    '.': (g, v, n, th) => drawGrass(g, v, th),
    ',': (g, v) => drawCobble(g, v, true),

      const e = (c) => c !== undefined && !'=H,'.includes(c)   // 跟草地交界畫淺色路緣石
      if (e(n.u)) { px1(g, 0, 0, '#e4e1d4', TS, 3); px1(g, 0, 3, 'rgba(0,0,0,.12)', TS, 1) }

      if (land(n.r)) { px1(g, TS - 4, 0, '#c9c3b0', 4, TS) }
    },
    'H': (g, v, n) => {
      const ew = n.u === '~' || n.d === '~'   // 上下是水 → 橋面東西向
      px1(g, 0, 0, '#b07a45', TS, TS)
      for (let i = 0; i < 4; i++) ew ? px1(g, i * 8 + 7, 0, '#7f5229', 1, TS) : px1(g, 0, i * 8 + 7, '#7f5229', TS, 1)
      for (let i = 0; i < 4; i++) ew ? px1(g, i * 8, 0, 'rgba(255,255,255,.15)', 1, TS) : px1(g, 0, i * 8, 'rgba(255,255,255,.15)', TS, 1)

      else { if (n.l === '~') px1(g, 0, 0, '#b3362d', 4, TS); if (n.r === '~') px1(g, TS - 4, 0, '#8f2a23', 4, TS) }

      for (let r = 0; r < 4; r++) { px1(g, 0, r * 8 + 7, '#7f7a6f', TS, 1); px1(g, (r % 2 ? 4 : 12) + 0, r * 8, '#7f7a6f', 1, 7); px1(g, (r % 2 ? 20 : 28), r * 8, '#7f7a6f', 1, 7) }
      if (n.u !== 'W') { px1(g, 0, 0, '#e9b53b', TS, 6); px1(g, 0, 6, '#b8761d', TS, 2); for (let i = 0; i < 8; i++) px1(g, i * 4, 0, '#c88d25', 1, 6) }   // 琉璃瓦牆頭

    'F': (g, v, n, th) => {
