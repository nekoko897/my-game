    if (img) ctx.drawImage(img, px - 16, py - 28, 32, 36)
    else {
      ctx.fillStyle = color; ctx.fillRect(px - 8, py - 10, 16, 18)                          // 身體（道袍）
      ctx.fillStyle = '#f0d3b0'; ctx.beginPath(); ctx.arc(px, py - 15, 7, 0, 7); ctx.fill()  // 頭
      ctx.fillStyle = '#222'; ctx.fillRect(px - 7, py - 22, 14, 5)                           // 髮
      ctx.fillStyle = '#222'
      if (f === 'd') { ctx.fillRect(px - 4, py - 14, 2, 2); ctx.fillRect(px + 2, py - 14, 2, 2) }
      else if (f === 'l') ctx.fillRect(px - 5, py - 14, 2, 2)
      else if (f === 'r') ctx.fillRect(px + 3, py - 14, 2, 2)
    }
    ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'
    const w = ctx.measureText(name).width + 8
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(px - w / 2, py - 40, w, 15)
    ctx.fillStyle = self ? '#ffe28a' : (isNpc ? '#ffd27a' : '#fff'); ctx.fillText(name, px, py - 28)
  }

  function townBubble(ctx, name, x, y) {
    let m = null
    for (let i = net.chat.length - 1; i >= 0; i--) { const c = net.chat[i]; if (!c.sys && !c.to && c.from === name) { m = c; break } }
    if (!m || serverNow() - m.t > 6000) return
    const txt = m.text.length > 16 ? m.text.slice(0, 16) + '…' : m.text
    const px = x * TS, py = y * TS - 48
    ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'
    const w = ctx.measureText(txt).width + 12
    ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fillRect(px - w / 2, py - 15, w, 18)
    ctx.beginPath(); ctx.moveTo(px - 4, py + 3); ctx.lineTo(px + 4, py + 3); ctx.lineTo(px, py + 8); ctx.fill()
    ctx.fillStyle = '#222'; ctx.fillText(txt, px, py - 2)
  }


  /* ========== 野外即時戰鬥（階段 2）==========
   * 妖獸由伺服器生成與行動（mon 事件），玩家攻擊送 /api/attack 由伺服器判定射程與傷害；
   * 妖獸攻擊以 hit 事件通知（氣血仍由客戶端維護），擊殺以 kill 事件結算修為與掉落。 */
  function townSetMobs(d) {
    if (!d || d.m !== town.curMap) return
    const seen = {}
    for (const [i, t, x, y, hp, st] of d.list) {
      seen[i] = 1
      const o = town.mobs[i]
      if (!o) town.mobs[i] = { i, t, x, y, tx: x, ty: y, hp, st }
      else { o.t = t; o.tx = x; o.ty = y; o.hp = hp; o.st = st }
      if (st === 2 && o) delete town.mobs[i]
    }
    for (const i of Object.keys(town.mobs)) if (!seen[i]) delete town.mobs[i]
  }
  const mobType = (o) => (town.map && town.map.types && town.map.types[o.t]) || { name: '妖獸', icon: '👹', hp: 100 }
  function fieldTarget(range) {
    let best = null, bd = range
    for (const o of Object.values(town.mobs)) { if (o.st === 2) continue; const d = Math.hypot(o.x - town.me.x, o.y - town.me.y); if (d < bd) { bd = d; best = o } }
    return best
  }
  function townFloat(x, y, txt, color) { town.fx.push({ x, y, txt, color, t0: performance.now(), k: 'txt' }) }
  function townDrawFx(ctx) {
    const now = performance.now()
    town.fx = town.fx.filter((f) => now - f.t0 < 1000)
    for (const f of town.fx) {
      const a = (now - f.t0) / (f.k === 'slash' ? 160 : 1000)
      if (f.k === 'slash') {
        if (a >= 1) continue
        ctx.strokeStyle = `rgba(255,240,180,${1 - a})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(f.x * TS, f.y * TS - 10); ctx.lineTo(f.x2 * TS, f.y2 * TS - 10); ctx.stroke()
        continue
      }
      ctx.globalAlpha = 1 - a * a; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'
      const y = f.y * TS - 30 - a * 28
      ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 3; ctx.strokeText(f.txt, f.x * TS, y)
      ctx.fillStyle = f.color; ctx.fillText(f.txt, f.x * TS, y); ctx.globalAlpha = 1
    }
  }
  function townMob(ctx, o, isTarget) {
    const ty = mobType(o), px = o.x * TS, py = o.y * TS
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(px, py + 8, 11, 4, 0, 0, 7); ctx.fill()
    if (isTarget) { ctx.strokeStyle = 'rgba(255,220,120,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(px, py + 8, 15, 6, 0, 0, 7); ctx.stroke() }
    const img = townImgs['mob_' + ty.id]
    if (img) ctx.drawImage(img, px - 18, py - 30, 36, 40)
    else { ctx.font = '28px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.fillText(ty.icon, px, py + 4) }
    const w = 34, r = Math.max(0, Math.min(1, o.hp / ty.hp))
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(px - w / 2, py - 32, w, 5)
    ctx.fillStyle = o.st === 1 ? '#e0533d' : '#5cc26a'; ctx.fillRect(px - w / 2 + 1, py - 31, (w - 2) * r, 3)
    ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#f3e3b0'; ctx.fillText(ty.name, px, py - 35)
  }

  const fieldSkills = () => usableSkills().slice(0, 8)
  function townBarUpdate(t) {
    const el = town.wrap && town.wrap.querySelector('#townBar'); if (!el || t - town.barAt < 200) return
    town.barAt = t
    const ti = town.wrap.querySelector('#townTitle'); if (ti && town.map && ti.textContent !== town.map.name) ti.textContent = town.map.name
    const sk = fieldSkills(), inField = town.curMap !== 'town'
    const sig = [state.hp, state.mp, maxHp(), maxMp(), inField, sk.map((s) => s.id + (state.cooldowns[s.id] || 0) + (state.mp >= s.cost ? 1 : 0)).join(',')].join('|')
    if (sig === town.barSig) return
    town.barSig = sig
    const pct = (a, b) => Math.max(0, Math.min(100, (a / b) * 100))
    el.innerHTML = `
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:12px">
        <span style="min-width:34px">氣血</span><div style="flex:1;height:10px;background:rgba(0,0,0,.4);border-radius:5px;overflow:hidden"><div style="width:${pct(state.hp, maxHp())}%;height:100%;background:#e0533d"></div></div><span class="num" style="min-width:76px;text-align:right">${Math.round(state.hp)}/${maxHp()}</span>
        <span style="min-width:34px">靈力</span><div style="flex:1;height:10px;background:rgba(0,0,0,.4);border-radius:5px;overflow:hidden"><div style="width:${pct(state.mp, maxMp())}%;height:100%;background:#4fb8a0"></div></div><span class="num" style="min-width:60px;text-align:right">${Math.round(state.mp)}/${maxMp()}</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
        <button type="button" class="btn btn-primary" style="padding:6px 14px" data-atk ${inField ? '' : 'disabled'}>⚔ 普攻</button>
        ${sk.map((s, i) => {
          const cd = state.cooldowns[s.id] || 0, dmg = s.effects.some((e) => e.t === 'dmg')
          const off = cd > 0 || state.mp < s.cost || (dmg && !inField)
          return `<button type="button" class="btn btn-ghost" style="padding:4px 8px;font-size:12px;${off ? 'opacity:.45' : ''}" data-fskill="${s.id}" title="${esc(s.description)}">${i + 1} ${esc(s.name)}<br><small>${cd > 0 ? cd + ' 息' : s.cost + ' 靈力'}</small></button>`
        }).join('')}
      </div>`
  }

  function townBasicAttack() {
    const now = performance.now()
    if (now - town.atkAt < 480 || town.curMap === 'town') return
    if (!fieldTarget(2.0)) return
    town.atkAt = now
    fieldAttack(null)
  }

  /* 快捷列事件（用 pointerdown，避免快捷列每 0.2 秒重繪而吃掉 click） */
  document.addEventListener('pointerdown', (e) => {
    if (!town.wrap || !town.wrap.contains(e.target)) return
    if (e.target.closest('[data-atk]')) { e.preventDefault(); town.pad.atk = true; townBasicAttack(); return }
    const sk = e.target.closest('[data-fskill]')
    if (sk) { e.preventDefault(); const s = SKILLS.find((x) => x.id === sk.dataset.fskill); if (s) castSkill(s) }
  })
  function renderNav() {
    $('nav').innerHTML = NAV.filter((n) => !n.gm || state.isGM).map((n) => `
      <li><button type="button" data-nav="${n.id}" title="${(NAV_HELP[n.id] || '').replace(/"/g, '&quot;')}" ${n.id === state.nav ? 'aria-current="page"' : ''}>${n.icon}${n.label}</button></li>`).join('')
  }

  // 目前右側面板顯示哪一頁：主城全螢幕時，跟 NPC 交談會在地圖旁開啟對應面板（state.townPanel）
  function infoView() { return (state.nav === 'town' && state.townPanel) || state.nav }
  function renderInfo() {
    const view = infoView()
    $('info-title').textContent = NAV.find((n) => n.id === view).label
    // 重繪前記住輸入框內容與焦點，避免被每次更新清掉
    const keep = {}
    for (const id of ['listPrice', 'listQty', 'listItemSelect', 'exchangeAmount', 'chatInput', 'gmTarget', 'gmStones', 'gmItem', 'gmQty', 'gmMsg', 'reportType', 'reportText', 'gmChatQ', 'gmMuteTarget', 'gmMuteMin', 'gmPwTarget', 'gmPwNew', 'pwOld', 'pwNew', 'pwNew2']) { const el = $(id); if (el) keep[id] = el.value }
    const focusId = document.activeElement && document.activeElement.id
    let html = ''
    switch (view) {
      case 'character':
        html = '<dl>' + ATTRIBUTES.map((a) => `
          <div class="attr">
            <div class="attr-head"><dt>${a.label}</dt><dd>${a.value + statPts(a.stat)}${statPts(a.stat) ? ` <span class="xs" style="color:var(--accent)">(+${statPts(a.stat)})</span>` : ''}</dd></div>
            <div class="mini-track" aria-hidden="true"><div style="width:${Math.min(100, a.value + statPts(a.stat))}%"></div></div>
            <p class="xs muted">${a.hint}${statPts(a.stat) ? `　丹藥加成：${STAT_META[a.stat].fx(statPts(a.stat))}` : ''}（丹藥已提升 ${statPts(a.stat)} / ${STAT_CAP}）</p>
          </div>`).join('') + '</dl>' + renderStatus() + renderChangePw()
        break
      case 'town':
        html = '<div id="townHost"></div>'
        break
      case 'techniques':
        html = renderTechniques()
        break
      case 'bag':
        html = renderBag()
        break
      case 'pets':
        html = renderPets()
        break
      case 'realm':
        html = renderRealm()
        break
      case 'market':
        html = renderMarket()
        break
      case 'auction':
        html = renderAuction()
        break
      case 'world':
        html = renderWorld()
        break
      case 'boss':
        html = renderBoss()
        break
      case 'sect':
        html = renderSect()
        break
      case 'report':
        html = renderReport()
        break
      case 'gm':
        html = renderGM()
        break
    }
    $('infoBody').innerHTML = html
    for (const [id, v] of Object.entries(keep)) { const el = $(id); if (el) el.value = v }
    if (focusId && $(focusId)) $(focusId).focus()
    if (state.nav === 'town') townMount(); else townUnmount()
    if (infoView() === 'world') { updateChat(); updateOnline() }
    if (infoView() === 'auction') updateListSuggest(!keep.listPrice && !!$('listItemSelect') && !!$('listItemSelect').value)
    tickTimers()
  }

  function skillCard(s, extra = '') {
    const g = SKILL_GRADES[s.grade]
    const battleOnly = s.effects.some((e) => e.t === 'dmg')
    return `
      <li class="tech">
        <span class="seal" aria-hidden="true" style="color:${g.color};border-color:${g.color}">${s.element}</span>
        <div class="col" style="flex:1;min-width:0">
          <div class="row" style="align-items:baseline"><span class="bold">${s.name}</span><span class="xs" style="color:${g.color}">${g.label} · ${SKILL_TYPES[s.type]}</span></div>
          <span class="xs muted" style="line-height:1.6">${s.description}</span>
          <span class="xs" style="color:var(--accent);line-height:1.6">${skillEffectText(s)}</span>
          <span class="xs muted">消耗 ${s.cost} 靈力 · 冷卻 ${s.cooldown} 息 · ${REALMS[s.req]}期可用${battleOnly ? ' · 僅戰鬥中' : ''}</span>
          ${extra}
        </div>
      </li>`
  }
  function renderTechniques() {
    const sect = currentSect()
    const title = (t) => `<h3 class="panel-title" style="font-size:12px;margin:14px 0 8px">${t}</h3>`
    const basics = SKILLS.filter((s) => s.grade === 'basic')
    let html = title('基礎功法') + '<ul class="stack">' + basics.map((s) => skillCard(s)).join('') + '</ul>'
    if (!sect) {
      html += title('宗門功法') + '<p class="xs muted" style="line-height:1.7">你目前是散修，只會基礎功法。拜入宗門即可習得宗門專屬功法，並能以貢獻在宗門寶庫兌換高階功法。</p>'
      return html
    }
    const own = SKILLS.filter((s) => s.sect === sect.id)
    html += title(`${sect.name} · 宗門功法`) + '<ul class="stack">' + own.filter((s) => s.grade === 'sect').map((s) => skillCard(s)).join('') + '</ul>'
    html += title(`${sect.name} · 高階功法`) + '<ul class="stack">' + own.filter((s) => s.grade === 'advanced').map((s) => skillCard(s,
      state.learned[s.id]
        ? '<span class="xs" style="color:var(--primary);margin-top:2px">已習得</span>'
        : `<span class="xs" style="color:var(--destructive);margin-top:2px">尚未習得 · 於宗門寶庫以 ${s.shopCost} 貢獻兌換</span>`)).join('') + '</ul>'
    const sealed = SKILLS.filter((s) => s.grade === 'advanced' && state.learned[s.id] && s.sect !== sect.id)
    if (sealed.length) html += title('封存中的高階功法') + `<p class="xs muted" style="line-height:1.7">${sealed.map((s) => `${s.name}（${(SECTS.find((x) => x.id === s.sect) || {}).name}）`).join('、')}：只有回到原宗門才能施展。</p>`
    return html
  }

  /* ---------- 背包分類 ----------
   * 依 ITEMS 的 type 分組；新增道具 type 時若沒列在這裡，會自動歸入「其他」。
   * 每個分類內依稀有度（高→低）再依名稱排序。 */
  const BAG_TABS = [
    { id: 'all', label: '全部' },
    { id: 'pill', label: '丹藥', types: ['pill'] },
    { id: 'equip', label: '裝備', types: ['equip'] },
    { id: 'material', label: '材料', types: ['material'] },
    { id: 'treasure', label: '天材地寶', types: ['treasure'] },
    { id: 'pet', label: '靈寵', types: ['egg', 'feed'] },
    { id: 'other', label: '其他' },
  ]
  const RARITY_RANK = { '史詩': 0, '稀有': 1, '精良': 2, '普通': 3 }
  const bagTabOf = (id) => { const t = (ITEMS[id] || {}).type; const tab = BAG_TABS.find((x) => x.types && x.types.includes(t)); return tab ? tab.id : 'other' }
  const bagSorted = () => Object.entries(state.inventory).filter(([id, q]) => q > 0 && ITEMS[id])
    .sort(([a], [b]) => (RARITY_RANK[ITEMS[a].rarity] ?? 9) - (RARITY_RANK[ITEMS[b].rarity] ?? 9) || String(ITEMS[a].name).localeCompare(String(ITEMS[b].name), 'zh-Hant'))
  function bagTabsHtml(all) {
    const cur = state.bagTab || 'all'
    const cnt = {}; all.forEach(([id]) => { const t = bagTabOf(id); cnt[t] = (cnt[t] || 0) + 1 })
    return `<div class="actions" style="justify-content:flex-start;gap:6px;margin-bottom:10px;flex-wrap:wrap">${BAG_TABS.filter((t) => t.id === 'all' || cnt[t.id] || t.id === cur).map((t) =>
      `<button type="button" class="small-btn" data-bag-tab="${t.id}" style="${cur === t.id ? 'background:color-mix(in oklch, var(--primary) 20%, transparent)' : ''}">${t.label}<span class="num muted"> ${t.id === 'all' ? all.length : cnt[t.id] || 0}</span></button>`).join('')}</div>`
  }
  const bagFiltered = (all) => {
    const cur = state.bagTab || 'all'
    let r = cur === 'all' ? all : all.filter(([id]) => bagTabOf(id) === cur)
    if (cur === 'equip' && state.bagSlot && state.bagSlot !== 'all') r = r.filter(([id]) => ITEMS[id].equip && ITEMS[id].equip.slot === state.bagSlot)
    return r
  }
  // 「裝備」分類下再依部位細分（兵器／護甲／頭冠／靴履／佩飾）
  function bagSlotTabsHtml(all) {
    if ((state.bagTab || 'all') !== 'equip') return ''
    const eq = all.filter(([id]) => bagTabOf(id) === 'equip'), cur = state.bagSlot || 'all'
    const cnt = (sl) => eq.filter(([id]) => ITEMS[id].equip && ITEMS[id].equip.slot === sl).length
    return `<div class="actions" style="justify-content:flex-start;gap:6px;margin:-4px 0 10px;flex-wrap:wrap">${[['all', '全部部位', eq.length], ...Object.entries(EQUIP_SLOTS).map(([k, v]) => [k, `${v.icon}${v.label}`, cnt(k)])].map(([k, label, n]) =>
      `<button type="button" class="small-btn" data-bag-slot="${k}" style="${cur === k ? 'background:color-mix(in oklch, var(--primary) 20%, transparent)' : ''}">${label}<span class="num muted"> ${n}</span></button>`).join('')}</div>`
  }

  // 已穿戴裝備卡片（每個部位一張，附「卸下」鍵）；attr 為卸下按鈕的 data 屬性名（資訊頁與背包視窗各自綁事件）
  function wornCards(attr) {
    return Object.entries(EQUIP_SLOTS).map(([slot, sd]) => {
      const id = state.equipped[slot], def = id && ITEMS[id]
      if (!def) return `<li class="card" style="list-style:none;margin-bottom:6px"><span class="xs muted">${sd.icon} ${sd.label}：空</span></li>`
      return `
      <li class="card" style="list-style:none;margin-bottom:6px">
        <div class="row" style="align-items:baseline"><span class="bold">${def.icon} ${def.name}</span><span class="xs" style="color:${rarityColor(def.rarity)}">${sd.label} · ${def.rarity} · 已穿戴</span></div>
        <p class="xs muted" style="margin-top:4px">${def.desc}</p>
        <p class="xs" style="margin-top:2px;color:var(--accent)">${def.equip.bonuses.map((b) => BONUS_TYPES[b.type](b.value)).join('、')}</p>
        <div class="actions" style="justify-content:flex-start;margin-top:6px"><button type="button" class="small-btn" ${attr}="${slot}">卸下</button></div>
      </li>`
    }).join('')
  }
  function renderBag() {
    const equipped = wornCards('data-unequip')
    const allEntries = bagSorted(), entries = bagFiltered(allEntries)
    const items = entries.length ? entries.map(([id, qty]) => {
      const def = ITEMS[id]
      return `
        <li class="item-card">
          <div class="item-icon">${def.icon}</div>
          <div class="col" style="flex:1;min-width:0">
            <div class="row" style="align-items:baseline">
              <span class="bold">${def.name}</span>
              <span class="xs num muted">× ${qty}</span>
            </div>
            <span class="xs" style="color:${rarityColor(def.rarity)}">${def.rarity}${def.equip ? ` · ${EQUIP_SLOTS[def.equip.slot].icon}${EQUIP_SLOTS[def.equip.slot].label}` : ''}</span>
            ${itemInfo(id)}
            <div class="actions" style="justify-content:flex-start;margin-top:6px;gap:8px">
              ${def.effect ? `<button type="button" class="small-btn" data-use-item="${id}">使用</button>` : ''}
              ${def.equip ? `<button type="button" class="small-btn" data-equip-item="${id}">穿戴</button>` : ''}
              <button type="button" class="small-btn" data-sell-item="${id}">出售（${sellPrice(id)} 靈石）</button>
            </div>
          </div>
        </li>`
    }).join('') : `<li class="xs muted">${allEntries.length ? '此分類沒有物品。' : '行囊空空，去秘境歷練拾取些物件吧。'}</li>`
    return `
      <h3 class="panel-title" style="font-size:12px;margin-bottom:8px">已穿戴裝備</h3>
      <ul class="stack">${equipped}</ul>
      <h3 class="panel-title" style="font-size:12px;margin:18px 0 8px">物品欄</h3>
      ${bagTabsHtml(allEntries)}${bagSlotTabsHtml(allEntries)}
      <ul class="item-list">${items}</ul>`
  }

  /* ---------- 背包視窗（左側） ---------- */
  let bagHtmlCache = ''
  const bagOpen = () => !$('bag-modal').classList.contains('hidden')
  function renderBagPanel(force) {
    const body = $('bagModalBody')
    const allEntries = bagSorted(), entries = bagFiltered(allEntries)
    const curTab = state.bagTab || 'all'
    const worn = (curTab === 'all' || curTab === 'equip') ? `<h3 class="panel-title" style="font-size:12px;margin:0 0 8px">已穿戴裝備</h3><ul style="padding:0;margin:0 0 12px">${wornCards('data-modal-unequip')}</ul>` : ''
    const html = (allEntries.length ? bagTabsHtml(allEntries) + bagSlotTabsHtml(allEntries) : '') + worn + (entries.length ? entries.map(([id, qty]) => {
      const def = ITEMS[id]
      return `
        <div class="item-card" style="margin-bottom: 10px;">
          <div class="item-icon">${def.icon}</div>
          <div class="col" style="flex:1;min-width:0">
            <div class="row" style="align-items:baseline">
              <span class="bold">${def.name}</span>
              <span class="xs num muted">× ${qty}</span>
            </div>
            <span class="xs" style="color:${rarityColor(def.rarity)}">${def.rarity}${def.equip ? ` · ${EQUIP_SLOTS[def.equip.slot].icon}${EQUIP_SLOTS[def.equip.slot].label}` : ''}</span>
            ${itemInfo(id)}
            <div class="actions" style="justify-content:flex-start;margin-top:6px;gap:8px">
              ${def.effect ? `<button type="button" class="small-btn" data-modal-use="${id}">使用</button>` : ''}
              ${def.equip ? `<button type="button" class="small-btn" data-modal-equip="${id}">穿戴</button>` : ''}
              <button type="button" class="small-btn" data-modal-sell="${id}">出售（${sellPrice(id)} 靈石）</button>
            </div>
          </div>
        </div>`
    }).join('') : `<p class="xs muted">${allEntries.length ? '此分類沒有物品。' : '行囊空空，去秘境歷練拾取些物件吧。'}</p>`)
    if (force || html !== bagHtmlCache) { const st = body.scrollTop; body.innerHTML = html; body.scrollTop = st; bagHtmlCache = html }
  }
  // 桌面（≥1200px）：把左欄加寬，背包視窗貼在導覽列右側，中間的修為圓盤只是被擠窄、不會被蓋住
  // 窄螢幕：背包改成貼在畫面底部的面板，高度只佔修為區塊下方的空間，修為與進度條仍看得到
  function placeBagPanel() {
    const m = $('bag-modal'), grid = document.querySelector('.grid'), main = grid.querySelector('main'), nav = document.querySelector('.nav')
    grid.classList.remove('bag-open'); grid.style.gridTemplateColumns = ''
    let docked = false
    if (window.innerWidth >= 1200) {
      const w = Math.max(280, Math.min(360, main.getBoundingClientRect().width - 340 - 12))
      grid.style.gridTemplateColumns = `${200 + 12 + w}px 1fr 300px`
      grid.classList.add('bag-open')
      const r = nav.getBoundingClientRect()
      Object.assign(m.style, { width: w + 'px', left: (r.right + 12) + 'px', right: 'auto', top: r.top + 'px', bottom: 'auto', maxHeight: Math.max(200, window.innerHeight - r.top - 12) + 'px' })
      // 保險：若版面沒有真的把修為區塊讓開（例如被其他樣式覆蓋），就退回底部面板
      docked = m.getBoundingClientRect().right <= $('core').getBoundingClientRect().left + 4
      if (!docked) { grid.classList.remove('bag-open'); grid.style.gridTemplateColumns = '' }
    }
    if (!docked) {
      // 高度只用「修為區塊」下方剩餘的空間，確保圓盤、進度與運功按鈕不被蓋住（空間太小時至少留 160px）
      const room = window.innerHeight - $('core').getBoundingClientRect().bottom - 16
      Object.assign(m.style, { width: 'auto', left: '8px', right: '8px', top: 'auto', bottom: '8px', maxHeight: Math.max(160, Math.min(room, window.innerHeight * 0.5)) + 'px' })
    }
  }
  function openBagModal() { $('bag-modal').classList.remove('hidden'); placeBagPanel(); renderBagPanel(true) }
  function closeBagPanel() {
    $('bag-modal').classList.add('hidden'); bagHtmlCache = ''
    const grid = document.querySelector('.grid'); grid.classList.remove('bag-open'); grid.style.gridTemplateColumns = ''
  }
  const toggleBagPanel = () => (bagOpen() ? closeBagPanel() : openBagModal())

  function renderPets() {
    const byEffect = (type) => Object.keys(ITEMS).filter((id) => ITEMS[id].effect && ITEMS[id].effect.type === type)
    const feeds = byEffect('feedPet')
    const eggCards = byEffect('hatch').filter((id) => (state.inventory[id] || 0) > 0).map((id) => {
      const def = ITEMS[id]
      return `
        <li class="card row">
          <div class="cluster">
            <div class="item-icon">${def.icon}</div>
            <div class="col">
              <span class="bold">${def.name} <span class="xs muted">× ${state.inventory[id]}</span></span>
              ${itemInfo(id)}
            </div>
          </div>
          <button type="button" class="small-btn" data-hatch="${id}">孵化</button>
        </li>`
    }).join('') || '<li class="xs muted" style="line-height:1.7">沒有靈獸蛋。普通靈獸蛋可在交易所購得；高級靈獸蛋掉落於秘境妖獸；神獸蛋唯有討伐世界王魔蛟方有機緣。</li>'

    const petCards = state.pets.map((p) => {
      const t = petTpl(p), g = PET_GRADES[p.grade] || PET_GRADES.common
      const active = p.uid === state.activePet, maxed = petMaxed(p)
      const req = petRequired(p), pct = maxed ? 100 : Math.min(100, (p.xp / req) * 100)
      const feedBtns = feeds.map((f) => {
        const q = state.inventory[f] || 0
        return `<button type="button" class="small-btn" data-pet-feed="${p.uid}" data-feed="${f}" ${q <= 0 || maxed ? 'disabled' : ''} title="${ITEMS[f].name}：${itemEffectText(f)}">${ITEMS[f].icon} ${ITEMS[f].name.replace('寵物', '')} ${q}</button>`
      }).join('')
      return `
        <li class="card" style="${active ? 'border-color:color-mix(in oklch, var(--accent) 60%, transparent);background:color-mix(in oklch, var(--accent) 6%, transparent)' : ''}">
          <div class="row" style="align-items:flex-start">
            <div class="cluster">
              <div class="monster-icon" style="width:44px;height:44px;font-size:24px;border-color:${g.color}">${t.icon}</div>
              <div class="col">
                <span class="bold">${t.name} <span class="xs" style="color:${g.color}">${g.label}</span></span>
                <span class="xs muted">${realmText(p.realm, p.layer)} · 攻擊 ${petAtk(p)}</span>
              </div>
            </div>
            <span class="xs" style="color:${active ? 'var(--accent)' : 'var(--muted-fg)'};white-space:nowrap">${active ? '出戰中' : '休息中'}</span>
          </div>
          <p class="xs muted" style="margin-top:6px">${t.desc}</p>
          <div class="row xs" style="margin-top:8px">
            <span class="muted">資質上限：<span style="color:${g.color}">${REALMS[p.cap]}期</span></span>
            <span class="num muted">${maxed ? '已圓滿' : `修為 ${Math.floor(p.xp)} / ${req}`}</span>
          </div>
          <div class="mini-track" style="margin-top:4px" aria-hidden="true"><div style="width:${pct}%;${maxed ? 'background:var(--accent)' : ''}"></div></div>
          <div class="actions" style="justify-content:flex-start;gap:6px;margin-top:10px">
            <button type="button" class="small-btn" data-pet-active="${p.uid}">${active ? '休息' : '出戰'}</button>
            ${feedBtns}
            <button type="button" class="small-btn" data-pet-release="${p.uid}" style="border-color:color-mix(in oklch, var(--destructive) 50%, transparent);color:var(--destructive)">放生</button>
          </div>
        </li>`
    }).join('') || '<li class="xs muted">尚無靈寵，孵化一顆靈獸蛋吧。</li>'

    return `
      <h3 class="panel-title" style="font-size:12px;margin-bottom:8px">靈獸蛋</h3>
      <ul class="stack" style="margin-bottom:18px">${eggCards}</ul>
      <h3 class="panel-title" style="font-size:12px;margin-bottom:8px">我的靈寵（${state.pets.length}/${MAX_PETS}）</h3>
      <ul class="stack">${petCards}</ul>
      <p class="xs muted" style="margin-top:12px;line-height:1.7">出戰靈寵會在秘境與世界王戰鬥中協同攻擊，戰勝妖獸時與你一同獲得修為。靈寵修為圓滿會自動晉級，最高可修煉至資質上限的第九層。靈寵出戰時的戰力不會超過你自己的境界，戰鬥獲得的靈寵修為與你一樣受等級減速（餵食不受影響）。</p>`
  }

  function renderRealm() {
    if (state.battle) return renderBattle()
    if (state.selectedLocation) {
      const loc = LOCATIONS.find((l) => l.id === state.selectedLocation)
      const monsters = loc.monsters.map((m) => `
        <li class="card row">
          <div class="cluster">
            <div class="monster-icon">${m.icon}</div>
            <div class="col">
              <span class="bold">${m.name}</span>
              <span class="xs muted">氣血 ${m.hp} · 攻擊 ${m.atkMin}-${m.atkMax} · 修為 +${m.exp}</span>
            </div>
          </div>
          <button type="button" class="small-btn" data-monster="${m.id}">挑戰</button>
        </li>`).join('')
      return `
        <button type="button" class="small-btn" data-back-location style="margin-bottom:12px">← 返回秘境列表</button>
        <p class="xs muted" style="margin-bottom:4px">${loc.desc}</p>
        <p class="xs" style="margin-bottom:10px;color:var(--accent)">🎫 已持門票，離開秘境後再次進入需重新購票。</p>
        <button type="button" class="btn btn-gold" data-field-enter="${loc.id}" style="width:100%;margin-bottom:12px">⚔ 進入野外（即時戰鬥）</button>
        <p class="xs muted" style="margin-bottom:8px">或選擇下方妖獸進行回合制挑戰：</p>
        <ul class="stack">${monsters}</ul>`
    }
    const cards = LOCATIONS.map((loc) => {
      const open = state.realm >= loc.reqRealm
      return `
        <li class="card location-card ${open ? '' : 'locked'}" ${open ? `data-location="${loc.id}"` : ''}>
          <div class="row" style="align-items:flex-start">
            <div class="col">
              <span class="bold">${loc.icon} ${loc.name}</span>
              <span class="xs muted" style="margin-top:4px">${loc.desc}</span>
            </div>
            <span class="xs" style="color:${open ? (state.stones >= ticketCost(loc) ? 'var(--primary)' : 'var(--destructive)') : 'var(--muted-fg)'};white-space:nowrap">${open ? (ticketCost(loc) ? `🎫 門票 ${ticketCost(loc).toLocaleString()} 靈石` : '免費入內') : `${REALMS[loc.reqRealm]}期可入`}</span>
          </div>
        </li>`
    }).join('')
    return `<p class="xs muted" style="line-height:1.7;margin-bottom:10px">進入秘境需先以靈石購買門票；離開秘境後再次進入須重新購票。</p><ul class="stack">${cards}</ul>`
  }

  function renderBattle() {
    const b = state.battle
    const hpPct = Math.max(0, Math.min(100, (state.hp / maxHp()) * 100))
    const mPct = Math.max(0, Math.min(100, (b.monsterHp / b.monster.hp) * 100))
    return `
      <div class="battle">
        <div class="battle-row">
          <div class="combatant">
            <div class="avatar" style="width:64px;height:64px"><img src="./img/cultivator.png" alt="" onerror="this.outerHTML='&lt;div class=&quot;avatar-fallback&quot;&gt;仙&lt;/div&gt;'" /></div>
            <span class="bold xs">${esc(pname())}</span>
            <div class="track" style="width:110px"><div class="fill" style="background:var(--destructive);width:${hpPct}%"></div></div>
            <span class="xs muted num">${state.hp}/${maxHp()}</span>
          </div>
          <span class="xs muted serif">VS</span>
          <div class="combatant">
            <div class="monster-icon" style="width:64px;height:64px;font-size:32px">${b.monster.icon}</div>
            <span class="bold xs">${b.monster.name}</span>
            <div class="track" style="width:110px"><div class="fill" style="background:var(--primary);width:${mPct}%"></div></div>
            <span class="xs muted num">${b.monsterHp}/${b.monster.hp}</span>
          </div>
        </div>
        ${activePet() ? `<p class="xs muted" style="text-align:center">出戰靈寵：${petTpl(activePet()).icon} ${petTpl(activePet()).name}（${realmText(activePet().realm, activePet().layer)} · 攻擊 ${petAtk(activePet())}）</p>` : ''}
        <div class="actions" style="margin-top:14px">
          <button type="button" class="btn btn-gold" data-attack>攻擊</button>
          <button type="button" class="btn btn-ghost" data-flee>逃跑</button>
        </div>
        <ol class="battle-log xs muted">${b.log.map((l) => `<li>${l}</li>`).join('')}</ol>
      </div>`
  }

  function renderMarket() {
    const buy = SHOP_ITEMS.map((id) => {
      const def = ITEMS[id]
      return `
        <li class="card">
          <div class="cluster"><div class="item-icon">${def.icon}</div><span class="bold">${def.name}</span></div>
          <div style="margin-top:6px">${itemInfo(id)}</div>
          <div class="row" style="margin-top:8px;align-items:center">
            <span class="xs muted">價格　<span class="bold num" style="color:var(--accent)">${buyPrice(id)}</span> ${def.currency === 'jade' ? '仙玉' : '靈石'}</span>
            <button type="button" class="small-btn" data-buy-item="${id}">購買</button>
          </div>
        </li>`
    }).join('')
    const entries = Object.entries(state.inventory).filter(([, q]) => q > 0)
    const sell = entries.length ? entries.map(([id, qty]) => {
      const def = ITEMS[id]
      return `
        <li class="card row">
          <div class="cluster">
            <div class="item-icon">${def.icon}</div>
            <span class="bold">${def.name} <span class="xs muted">× ${qty}</span></span>
          </div>
          <button type="button" class="small-btn" data-sell-item="${id}">出售（${sellPrice(id)} 靈石）</button>
        </li>`
    }).join('') : '<li class="xs muted">無可出售物品</li>'
    return `
      <div class="card" style="margin-bottom:18px">
        <h3 class="xs muted" style="letter-spacing:.2em;margin-bottom:10px">靈石兌仙玉（500 : 1）</h3>
        <div class="row" style="gap:8px">
          <input id="exchangeAmount" class="exchange-input" type="number" min="0" step="500" placeholder="靈石數量" />
          <button type="button" class="small-btn" data-exchange>兌換</button>
        </div>
      </div>
      <h3 class="panel-title" style="font-size:12px;margin-bottom:8px">仙品鋪</h3>
      <ul class="stack" style="margin-bottom:18px">${buy}</ul>
      <h3 class="panel-title" style="font-size:12px;margin-bottom:8px">出售物品</h3>
      <ul class="stack">${sell}</ul>`
  }

  function renderAuction() {
    return renderNetAuction()
  }

  /* ---------- 宗門畫面 ---------- */
  const bonusText = (s) => s.bonuses.map((b) => BONUS_TYPES[b.type](b.value)).join('、')
  const alignTag = (s) => `<span class="xs" style="color:${SECT_ALIGNS[s.align].color};border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:6px">${SECT_ALIGNS[s.align].label}</span>`
  const rewardText = (r) => [`貢獻 ${r.contribution}`, r.stones ? `靈石 ${r.stones}` : '', r.xp ? `修為 ${Math.round(r.xp * 100)}%` : ''].filter(Boolean).join('、')
  const monsterById = (id) => { for (const l of LOCATIONS) { const m = l.monsters.find((x) => x.id === id); if (m) return { m, loc: l } } return null }

  function renderSect() {
    const sect = currentSect()
    const tab = sect ? state.sectTab : 'list'
    const tabs = sect ? `
      <div class="actions" style="justify-content:flex-start;gap:6px;margin-bottom:14px">
        ${[['mine', '本宗'], ['quests', '任務'], ['shop', '寶庫'], ['forge', '工坊'], ['list', '宗門列表']].map(([k, label]) =>
          `<button type="button" class="small-btn" data-sect-tab="${k}" style="${tab === k ? 'background:color-mix(in oklch, var(--primary) 20%, transparent)' : ''}">${label}</button>`).join('')}
      </div>` : ''
    let body = ''
    if (tab === 'mine') body = renderSectMine(sect)
    else if (tab === 'quests') body = renderSectQuests(sect)
    else if (tab === 'shop') body = renderSectShop(sect)
    else if (tab === 'forge') body = renderSectForge(sect)
    else body = renderSectList()
    return tabs + body
  }

  function renderSectMine(s) {
    const info = [['陣營', SECT_ALIGNS[s.align].label], ['掌門', s.master], ['貢獻', state.contribution.toLocaleString()], ['進行中任務', `${Object.keys(state.quests).length} / ${MAX_ACTIVE_QUESTS}`]]
    return `
      <div class="card" style="margin-bottom:12px">
        <span class="bold" style="font-size:16px">${s.name}</span>${alignTag(s)}
        <p class="xs muted" style="margin-top:6px;line-height:1.7">${s.desc}</p>
        <h3 class="xs" style="margin-top:10px;color:var(--accent);letter-spacing:.2em">宗門特色</h3>
        <ul style="margin-top:4px">${s.bonuses.map((b) => `<li class="xs" style="color:var(--primary)">✦ ${BONUS_TYPES[b.type](b.value)}</li>`).join('')}</ul>
      </div>
      <dl class="sect-grid" style="margin-bottom:12px">${info.map(([k, v]) => `<div class="card"><dt class="xs muted">${k}</dt><dd class="bold">${v}</dd></div>`).join('')}</dl>
      <div class="card" style="margin-bottom:12px">
        <h3 class="xs" style="color:var(--accent);letter-spacing:.2em">宗門功法</h3>
        <ul style="margin-top:4px">${SKILLS.filter((k) => k.sect === s.id && k.grade === 'sect').map((k) => `<li class="xs" style="color:var(--primary)">✦ ${k.name}　<span class="muted">${skillEffectText(k)}</span></li>`).join('')}</ul>
      </div>
      <p class="xs muted" style="line-height:1.7;margin-bottom:10px">完成「任務」獲得貢獻，可在「寶庫」兌換本宗專屬天材地寶與高階功法，並在「工坊」煉製裝備。離開宗門貢獻將歸零，宗門功法會封存。</p>
      <button type="button" class="small-btn" data-sect-leave style="border-color:color-mix(in oklch, var(--destructive) 50%, transparent);color:var(--destructive)">離開宗門</button>`
  }

  function renderSectQuests(s) {
    const active = Object.keys(state.quests).length
    const cards = s.quests.map((q) => {
      let need, status
      const cdLeft = questCdLeft(q.id)
      if (cdLeft > 0) {
        need = q.type === 'kill' ? `擊殺 ${(monsterById(q.monster) || { m: { icon: '', name: q.monster } }).m.name} × ${q.qty}` : `上交 ${ITEMS[q.item].icon} ${ITEMS[q.item].name} × ${q.qty}`
        status = `<span class="xs num" style="color:var(--muted-fg)">冷卻中 <span data-cd-until="${state.questCd[q.id]}">${fmtCd(cdLeft)}</span></span>`
      } else if (q.type === 'kill') {
        const info = monsterById(q.monster)
        const mName = info ? `${info.m.icon} ${info.m.name}` : q.monster
        const where = info ? `（${info.loc.name}，${REALMS[info.loc.reqRealm]}期可入）` : ''
        const accepted = q.id in state.quests
        const prog = state.quests[q.id] || 0
        need = `擊殺 ${mName} × ${q.qty}${where}`
        status = !accepted
          ? `<button type="button" class="small-btn" data-quest-accept="${q.id}" ${active >= MAX_ACTIVE_QUESTS ? 'disabled title="擊殺任務最多同時接 ' + MAX_ACTIVE_QUESTS + ' 個"' : ''}>接取</button>`
          : `<span class="xs num" style="color:${prog >= q.qty ? 'var(--accent)' : 'var(--muted-fg)'}">${prog} / ${q.qty}</span>
             ${prog >= q.qty ? `<button type="button" class="small-btn" data-quest-done="${q.id}">交付</button>` : ''}
             <button type="button" class="small-btn" data-quest-abandon="${q.id}">放棄</button>`
      } else {
        const def = ITEMS[q.item], have = state.inventory[q.item] || 0
        need = `上交 ${def.icon} ${def.name} × ${q.qty}`
        status = `<span class="xs num" style="color:${have >= q.qty ? 'var(--accent)' : 'var(--muted-fg)'}">持有 ${have} / ${q.qty}</span>
                  <button type="button" class="small-btn" data-quest-done="${q.id}" ${have >= q.qty ? '' : 'disabled'}>上交</button>`
      }
      return `
        <li class="card">
          <div class="row" style="align-items:baseline"><span class="bold">${q.name}</span><span class="xs muted">${q.type === 'kill' ? '討伐' : '上交'} · 冷卻 ${q.cd || 0} 分</span></div>
          <p class="xs muted" style="margin-top:4px">${q.desc}</p>
          <p class="xs" style="margin-top:6px">${need}</p>
          <p class="xs" style="margin-top:2px;color:var(--accent)">獎勵：${rewardText(q.reward)}</p>
          <div class="actions" style="justify-content:flex-start;align-items:center;gap:8px;margin-top:8px">${status}</div>
        </li>`
    }).join('')
    return `
      <p class="xs muted" style="margin-bottom:10px">貢獻：<span class="bold num" style="color:var(--accent)">${state.contribution.toLocaleString()}</span>　任務可重複完成，但每個任務完成後都有冷卻時間；討伐任務需先接取（同時最多 ${MAX_ACTIVE_QUESTS} 個）。</p>
      <ul class="stack">${cards}</ul>`
  }

  function renderSectShop(s) {
    const cards = s.shop.map(({ item, cost }) => {
      const def = ITEMS[item], have = state.inventory[item] || 0
      return `
        <li class="item-card">
          <div class="item-icon">${def.icon}</div>
          <div class="col" style="flex:1;min-width:0">
            <div class="row" style="align-items:baseline"><span class="bold">${def.name}</span><span class="xs muted">持有 ${have}</span></div>
            <span class="xs" style="color:${rarityColor(def.rarity)}">${def.rarity}${def.sect ? ' · 本宗專屬' : ''}</span>
            ${itemInfo(item)}
            <div class="actions" style="justify-content:flex-start;margin-top:6px">
              <button type="button" class="small-btn" data-sect-buy="${item}" ${state.contribution >= cost ? '' : 'disabled'}>兌換（${cost} 貢獻）</button>
            </div>
          </div>
        </li>`
    }).join('')

    // 拍賣場／戰鬥中的畫面需要每秒即時更新，其餘分頁（背包、交易所…）的刷新由各自的操作函式自行呼叫 renderInfo()
    if (infoView() === 'realm' && state.battle) renderInfo()
  }









  // 妖獸反擊；玩家倒下回傳 true（已處理敗北）
  // mult：傷害倍率（普通攻擊 = 1）；skill：以功法出手時帶入

  /* 氣血／靈力自然回復速度倍率（1 = 原速，數字越小越慢）。丹藥因此更有價值。 */
  const regenAcc = { hp: 0, mp: 0 }

  /* =========================================================
   * 與伺服器同步（第二、三階段：伺服器權威）
   * 所有會改變數值的操作都送到伺服器，由伺服器依 shared/game-rules.js 計算後回傳最新狀態，前端只負責顯示。
   *   - 一般操作：act(類型, 參數) → POST /api/act
   *   - 野外攻擊：/api/attack；魔蛟：/api/boss/attack；拍賣、切磋：各自的 API
   * 前端的 tick() 只做「畫面預測」（回血、冷卻倒數、閉關），每 3 秒向伺服器同步一次，以伺服器數值為準。
   * 在主控台改 state 只會改到畫面，下一次同步就會被伺服器的數值蓋回來。
   * ========================================================= */
  function applyServerState(sv) {
    if (!sv) return
    if (state.v != null && sv.v != null && sv.v < state.v) return   // 比目前舊的回應（網路先後順序），忽略
    Object.assign(state, sv)   // 伺服器狀態不含介面欄位（目前分頁等），不會被蓋掉
  }
  function showResult(r, opt = {}) {
    if (!r) return r
    if (r.state) applyServerState(r.state)
    for (const [t, tone] of r.logs || []) addLog(t, tone)
    if (r.ok === false && r.error) addLog(r.error, 'danger')
    render()
    if (opt.info !== false && infoView() !== 'town') renderInfo()
    if (bagOpen()) renderBagPanel(true)
    return r
  }
  async function act(type, p = {}, opt) {
    if (!isOnline()) { addLog('需要登入連線。', 'danger'); return null }
    const r = await api('act', { type, p })
    if (r && !r.state && (type === 'sync' || r.error === '操作太快')) return r   // 點太快被伺服器擋下：安靜略過，不洗版
    return showResult(r, opt)
  }
  function applyMail(list) {   // 傳書已由伺服器入帳，這裡只顯示訊息並標記已讀
    const ids = []
    for (const m of list || []) {
      if (net.seenMail.has(m.id)) continue
      net.seenMail.add(m.id); ids.push(m.id)
      addLog(m.text || '收到一封傳書。', m.kind === 'stones' && m.amount < 0 ? 'danger' : 'gold')
    }
    if (ids.length) { api('mail/ack', { ids }); render(); if (['bag', 'market', 'auction', 'pets'].includes(infoView())) renderInfo() }
  }

  /* ---------- 修煉 ---------- */
  const cultivate = () => act('cultivate', {}, { info: false })
  const breakthrough = () => act('breakthrough', {}, { info: false })
  const toggleSeclusion = () => act('seclude', {}, { info: false })

  /* ---------- 功法 ---------- */
  function castSkill(skill) {
    if (!skill || !usableSkills().includes(skill)) return
    if ((state.cooldowns[skill.id] || 0) > 0 || state.mp < skill.cost) return
    if ((skill.req || 0) > state.realm) { addLog(`「${skill.name}」需達到${REALMS[skill.req]}期方能施展。`, 'danger'); return }
    const isDmg = skill.effects.some((e) => e.t === 'dmg')
    const bossMode = !state.battle && infoView() === 'boss' && net.boss && net.boss.alive
    const fieldMode = !state.battle && state.nav === 'town' && town.curMap !== 'town'
    if (isDmg && bossMode) return attackBoss(skill)
    if (isDmg && fieldMode) {
      if (performance.now() - town.atkAt < 470) return
      if (!fieldTarget(4.4)) { townFloat(town.me.x, town.me.y - 1, '射程內沒有目標', '#ddd'); return }
      return fieldAttack(skill)
    }
    if (isDmg && !state.battle) { addLog(`「${skill.name}」是攻伐功法，需在秘境戰鬥、野外，或在「魔蛟」分頁對世界王施展。`, 'danger'); return }
    return act('cast', { skill: skill.id }).then((r) => { if (r && r.ok !== false && !r.error) fxSkillCast(skill); return r })   // 【招式動畫】
  }

  /* ---------- 背包、交易所 ---------- */

  const equipItem = (id) => act('equip', { id })
  const unequipSlot = (slot) => act('unequip', { slot })
  const forgeItem = (id) => act('forge', { id })

  const feedPet = (uid, item) => act('feed', { uid, item })

  function releasePet(uid) {

    return act('petRelease', { uid })
  }

  /* ---------- 宗門 ---------- */
  async function joinSect(id) {
    const s = SECTS.find((x) => x.id === id), old = currentSect()
    if (!s || state.sect === id) return
    if (old && !confirm(`改投「${s.name}」將離開「${old.name}」，目前 ${state.contribution} 點貢獻會歸零、進行中的任務作廢。確定嗎？`)) return
    const r = await act('sectJoin', { id })
    if (r && r.ok) { state.sectTab = 'mine'; renderInfo() }
  }
  function leaveSect() {
    const s = currentSect()
    if (!s || !confirm(`確定要離開「${s.name}」嗎？目前 ${state.contribution} 點貢獻會歸零、進行中的任務作廢。`)) return
    return act('sectLeave')
  }
  const acceptQuest = (qid) => act('questAccept', { qid })
  const abandonQuest = (qid) => act('questAbandon', { qid })
  const completeQuest = (qid) => act('questComplete', { qid })
  const buySectItem = (item) => act('sectBuy', { item })
  const buySectSkill = (id) => act('sectSkill', { id })

  /* ---------- 秘境（門票、回合制戰鬥）---------- */
  const enterLocation = (id) => act('enterLoc', { id })
  const backToLocations = () => act('leaveLoc')
  const startBattle = (monster) => act('battleStart', { mon: monster.id })
  const attackMonster = () => { const hp0 = state.hp; return act('battleAttack').then((r) => { if (r && r.ok !== false && !r.error) fxBattleHit(hp0); return r }) }   // 【招式動畫】
  const fleeBattle = () => act('battleFlee')

  /* ---------- 野外即時戰鬥 ---------- */
  async function fieldEnter(id) {
    if (!isOnline()) return addLog('需要登入連線才能進入野外。', 'danger')
    const r = await api('enter', { map: id })
    if (!r.ok) { addLog(r.error || '無法進入野外。', 'danger'); return renderInfo() }
    applyServerState(r.state)
    town.map = r.map; town.curMap = r.map.id; town.players = {}; town.mobs = {}; town.fx = []; town.inited = true
    town.me.x = r.x; town.me.y = r.y; town.lastSent = ''; town.barSig = ''; town.near = undefined
    town.big = true; state.lastNav = state.nav; state.nav = 'town'; state.townPanel = null; town.panelNpc = null
    addLog(`踏入「${r.map.name}」野外，妖獸四處遊蕩，小心！`, 'gold')
    renderNav(); renderInfo()
  }
  function toTown(map, x, y) {
    town.map = town.townMap = map; town.curMap = 'town'; town.players = {}; town.mobs = {}; town.fx = []
    town.me.x = x; town.me.y = y; town.lastSent = ''; town.barSig = ''; town.near = undefined
  }
  async function fieldLeave() {
    const r = await api('enter', { map: 'town' })
    if (r.ok) { applyServerState(r.state); toTown(r.map, r.x, r.y); addLog('離開野外，門票作廢，再次進入須重新購票。') }
    render(); renderInfo()
  }
  function fieldHit(d) {   // 伺服器已扣好氣血，這裡只顯示
    if (d.v != null && d.v >= (state.v || 0)) { state.hp = d.hp; state.v = d.v }
    for (const [t, tone] of d.logs || []) addLog(t, tone)
    if (town.curMap !== 'town') { townFloat(town.me.x, town.me.y, `-${d.dmg}`, '#ff6b5a'); if (fxTownOn()) SkillFX.hurt('world', fxMe) }   // 【招式動畫】受擊
    render()
  }
  function fieldDefeat(d) {   // 伺服器判定重傷：已扣修為、門票作廢、送回主城
    applyServerState(d.state)
    for (const [t, tone] of d.logs || []) addLog(t, tone)
    toTown(d.map, d.x, d.y)
    render(); renderInfo()
  }
  function fieldKill(d) {   // 伺服器已結算修為、掉落、任務進度
    applyServerState(d.state)
    for (const [t, tone] of d.logs || []) addLog(t, tone)
    if (town.curMap !== 'town') {
      townFloat(town.me.x, town.me.y - 0.6, `+${d.exp} 修為`, '#ffd966')
      for (const l of d.loot || []) if (ITEMS[l.item]) townFloat(town.me.x, town.me.y - 1.2, `${ITEMS[l.item].name}×${l.qty}`, '#8fd0ff')
    }
    render()
    if (bagOpen()) renderBagPanel(true)
  }
  async function fieldAttack(skill) {
    town.atkAt = performance.now()
    const tg = fieldTarget(skill ? 4.4 : 2.0)
    if (tg) { town.me.f = Math.abs(tg.x - town.me.x) > Math.abs(tg.y - town.me.y) ? (tg.x > town.me.x ? 'r' : 'l') : (tg.y > town.me.y ? 'd' : 'u') }
    if (!skill && tg && fxTownOn()) SkillFX.strike('world', null, fxMe, { x: tg.x * TS, y: tg.y * TS - 10 }, { owner: net.name })   // 【招式動畫】普攻：按下就御劍出擊
    const r = await api('attack', { skill: skill ? skill.id : null })
    if (r.state) applyServerState(r.state)
    for (const [t, tone] of r.logs || []) addLog(t, tone)
    if (!r.ok) { if (r.error) addLog(r.error, 'danger'); render(); return }
    const hitMs = skill ? fxFieldSkill(skill, r) : 0   // 【招式動畫】功法動畫，傷害數字等打中才跳
    setTimeout(() => townFloat(r.mx, r.my, `${r.dmg}`, skill ? '#ffb347' : '#ffffff'), hitMs)
    const o = town.mobs[r.mi]; if (o) o.hp = r.hp
    render()
  }

  /* ---------- 【招式動畫】把戰鬥事件接到 SkillFX（引擎在檔案開頭的 <script>） ---------- */
  const fxMe = () => ({ x: town.me.x * TS, y: town.me.y * TS - 12 })
  const fxTownOn = () => state.nav === 'town' && !!town.cv && town.cv.isConnected
  function fxFieldSkill(skill, r) {   // 野外施展攻伐功法；回傳打中目標的時間（毫秒）
    if (!fxTownOn()) return 0
    SkillFX.callout('world', fxMe, skill.name)
    return SkillFX.strike('world', skill, fxMe, { x: r.mx * TS, y: r.my * TS - 10 }, { owner: net.name })
  }
  function fxSkillCast(skill) {   // 野外以外施展成功：回合制的攻伐功法、各處的回復／靈力／增益功法
    const dmg = skill.effects.some((e) => e.t === 'dmg')
    const me = '#infoBody .combatant .avatar', mon = '#infoBody .combatant .monster-icon'
    if (dmg) { if (state.battle) { SkillFX.callout('screen', me, skill.name); SkillFX.strike('screen', skill, me, mon) } return }
    if (fxTownOn()) { SkillFX.callout('world', fxMe, skill.name); SkillFX.selfCast('world', skill, fxMe); return }
    const at = state.battle && document.querySelector(me) ? me : '#game-screen .who .avatar'
    SkillFX.callout('screen', { sel: at, dy: at === me ? 0 : 70 }, skill.name); SkillFX.selfCast('screen', skill, at)
  }
  function fxBattleHit(hp0) {   // 回合制普攻：御劍出擊，被反擊時頭像閃紅
    const me = '#infoBody .combatant .avatar', hit = SkillFX.strike('screen', null, me, '#infoBody .combatant .monster-icon')
    if (state.hp < hp0) setTimeout(() => SkillFX.hurt('screen', me), hit + 250)
  }
  function fxBossHit(skill) {   // 魔蛟：從魔蛟卡片下方出招
    const boss = '#infoBody .monster-icon'
    if (skill) SkillFX.callout('screen', { sel: boss, dy: 110 }, skill.name)
    SkillFX.strike('screen', skill, { sel: boss, dy: 150 }, boss)
  }

  /* ---------- 世界王 ---------- */
  async function attackBoss(skill = null) {

    for (const t of (r && r.bossLog) || []) bossLogPush(t)
    showResult(r, { info: infoView() === 'boss' })
    if (r && r.ok) fxBossHit(skill)   // 【招式動畫】
  }

  /* ---------- 拍賣 ---------- */
  async function netBidWithRate(id, rate) {
    const a = net.auctions.find((x) => x.id === id); if (!a) return
    const basePrice = a.bidder ? a.current : a.start
    const target = basePrice + Math.ceil(basePrice * Number(rate))
    if (state.stones < target) { addLog('靈石不足，無法出價。', 'danger'); render(); return }
    const r = await api('auction/bid', { id, amount: target })   // 伺服器檢查並扣款
    if (!r.ok) { addLog(r.error, 'danger'); return }
    applyServerState(r.state)
    addLog(`你出價 ${r.amount} 靈石（加價 ${Number(rate) * 100}%）。`, 'gold')
    render()
  }
  async function netList() {
    const itemId = $('listItemSelect') && $('listItemSelect').value
    const price = Math.max(0, Math.floor(Number($('listPrice') && $('listPrice').value) || 0))
    if (!itemId || (state.inventory[itemId] || 0) <= 0) { addLog('沒有可上架的物品。', 'danger'); return }
    if (SHOP_ITEMS.includes(itemId)) { addLog('交易所販售的道具無法上架拍賣場。', 'danger'); return }
    const qty = Math.max(1, Math.floor(Number($('listQty') && $('listQty').value) || 1))
    if (price <= 0) { addLog('請輸入有效的每件起標價格。', 'danger'); return }
    if (qty > (state.inventory[itemId] || 0)) { addLog('物品數量不足，無法上架這麼多。', 'danger'); return }
    const total = price * qty // 伺服器的起標價為整組總價
    const r = await api('auction/list', { item: itemId, price: total, qty })   // 伺服器驗證並扣除背包
    if (!r.ok) addLog(r.error, 'danger')
    else { applyServerState(r.state); addLog(`將「${ITEMS[itemId].name}」× ${qty} 送上全服拍賣，每件 ${price} 靈石，起標總價 ${total} 靈石。`, 'gold') }
    render(); renderInfo()
  }

  /* ---------- 每秒：畫面預測＋定期同步 ---------- */
  function tick() {
    if ($('game-screen').classList.contains('hidden')) return
    if (isOnline()) {
      R.tickSecond(state, null)   // 與伺服器同一套每息規則，只是先在畫面上預演（不寫日誌）
      if (++net.tickN % 3 === 0) act('sync', {}, { info: false })   // 每 3 秒以伺服器數值為準
    }
    tickTimers()
    render()
  }

  $('btnCultivate').addEventListener('click', cultivate)
  $('btnBreak').addEventListener('click', breakthrough)
  $('btnSeclude').addEventListener('click', toggleSeclusion)

  /* ---------- 遊戲說明 ----------
   * 右上角「？」按鈕開啟。內容用到的數字（運功耗靈力、閉關耗靈石、兌換匯率、境界名稱）都直接讀程式裡的常數，
   * 之後調整數值不用回來改說明。要改文字就改 helpHTML()。 */
  function helpHTML() {
    const h3 = (t) => `<h3 class="xs" style="color:var(--accent);letter-spacing:.2em;margin:14px 0 6px">${t}</h3>`
    const p = (t) => `<p class="xs" style="line-height:1.8;margin:0 0 4px">${t}</p>`
    const li = (t) => `<li class="xs" style="line-height:1.8;margin-bottom:3px">${t}</li>`
    const navList = NAV.filter((n) => !n.gm || state.isGM).map((n) => li(`<span class="bold">${n.label}</span>　<span class="muted">${NAV_HELP[n.id] || ''}</span>`)).join('')
    return `
      ${h3('遊戲簡介')}
      ${p('這是一款修仙放置遊戲：運功、閉關積累修為，突破境界，變得更強；也可以進入秘境打妖獸、拜入宗門、與其他修士交易，一起挑戰魔蛟。')}
      ${h3('境界與修為')}
      ${p(`境界依序為：${REALMS.join(' → ')}，每個境界分 ${MAX_LAYER} 層。越高的境界與層數，需要的修為越多，氣血與靈力上限也越高。`)}
      ${p('中央圓環顯示目前修為進度；修為圓滿後，才能按「突破」晉升到下一層（第九層圓滿則晉入下一個境界）。')}
      ${h3('運功')}
      ${p(`每次運功消耗靈力（起始 ${CULTIVATE_COST} 點，隨靈力上限增加），獲得一段修為。靈力用完就要等自然回復或服用丹藥。`)}
      ${h3('閉關')}
      ${p(`按「閉關」後會自動修煉，不必一直點擊。<span style="color:var(--accent)">閉關每息消耗 ${secludeCost()} 靈石（隨境界層數增加）</span>，靈石不足時不能閉關，閉關中靈石耗盡會被迫出關；修為圓滿時也會自動出關，方便你去突破。`)}
      ${h3('突破')}
      ${p('按鈕上的百分比是目前的突破成功率。層數越高越難，第九層晉入下一境界最難。宗門加成、幸運屬性與突破類丹藥可以提高成功率。')}
      ${p('突破失敗會損失部分修為並受傷，但不會掉境界。')}
      ${h3('靈石與仙玉')}
      ${p(`靈石是主要貨幣：用於閉關、購買秘境門票、買賣與煉器。仙玉較稀有，用於購買部分高級道具，可在交易所用 ${JADE_RATE} 靈石兌換 1 仙玉。`)}
      ${h3('氣血與靈力')}
      ${p('氣血與靈力會自然回復，但速度很慢，需要時請善用丹藥。')}
      ${h3('左側選單')}
      <ul style="margin:0;padding:0;list-style:none">${navList}</ul>
      ${h3('聊天')}
      ${p('世界頻道與私訊的內容都會被記錄，管理員可能檢視。請文明發言；不當言論或騷擾可能被禁言，部分字詞會被自動以 *** 取代。')}
      ${h3('存檔')}
      ${p('所有進度都由伺服器即時計算並保存，不需要手動儲存；換裝置登入也會接續同一份進度。')}`
  }
  const helpModal = $('help-modal')
  const openHelp = () => { $('helpBody').innerHTML = helpHTML(); helpModal.hidden = false; $('helpBody').scrollTop = 0 }
  const closeHelp = () => { helpModal.hidden = true }
  $('btnHelp').addEventListener('click', openHelp)
  $('closeHelpBtn').addEventListener('click', closeHelp)
  helpModal.addEventListener('click', (e) => { if (e.target === helpModal) closeHelp() })
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !helpModal.hidden) closeHelp() })
  $('nav').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-nav]')
  if (!btn) return

  // 如果點到的是「背包」，就開啟彈跳視窗並結束，不切換右側面板
  if (btn.dataset.nav === 'bag') {
    toggleBagPanel()
    return
  }

  if (btn.dataset.nav !== 'report') state.lastNav = state.nav
  state.townPanel = null; town.panelNpc = null
  state.nav = btn.dataset.nav
  renderNav()
  renderInfo()
})

// 綁定彈窗右上角的「關閉」按鈕
$('closeBagBtn').addEventListener('click', closeBagPanel)
window.addEventListener('resize', () => { if (bagOpen()) placeBagPanel() })
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && bagOpen()) closeBagPanel() })

  // 換選物品 → 自動帶入建議價；改價格／數量 → 即時更新判斷與總價
  $('infoBody').addEventListener('change', (e) => { if (e.target.id === 'listItemSelect') updateListSuggest(true) })
  $('infoBody').addEventListener('input', (e) => { if (e.target.id === 'listPrice' || e.target.id === 'listQty') updateListSuggest(false) })
  $('infoBody').addEventListener('click', (e) => {
    if (e.target.closest('[data-suggest-apply]')) return updateListSuggest(true)
    if (e.target.closest('[data-gm-send]')) return sendGM()
    if (e.target.closest('[data-chatlog-load]')) return loadChatLog()
    if (e.target.closest('[data-pw-change]')) return changePw()
    if (e.target.closest('[data-pw-gen]')) return genPw()
    if (e.target.closest('[data-pw-reset]')) return resetPw()
    const muteDo = e.target.closest('[data-mute-do]')
    if (muteDo) return doMute($('gmMuteTarget') && $('gmMuteTarget').value, Number($('gmMuteMin') && $('gmMuteMin').value) || 0)
    const muteLift = e.target.closest('[data-mute-lift]')
    if (muteLift) return doMute(muteLift.dataset.muteLift, 0)
    const muteFill = e.target.closest('[data-mute-fill]')
    if (muteFill) { const i = $('gmMuteTarget'); if (i) { i.value = muteFill.dataset.muteFill; i.focus() } return }
    if (e.target.closest('[data-report-send]')) return sendReport()
    if (e.target.closest('[data-report-reload]')) return loadReports()
    const rAct = e.target.closest('[data-report-act]')
    if (rAct) return actReport(rAct.dataset.reportAct, rAct.dataset.act)
    const nbRate =e.target.closest('[data-net-bid-rate]')
    if (nbRate) return netBidWithRate(nbRate.dataset.netBidRate, nbRate.dataset.rate)
    const useBtn = e.target.closest('[data-use-item]')
    if (useBtn) return useItem(useBtn.dataset.useItem)
    const equipBtn = e.target.closest('[data-equip-item]')
    if (equipBtn) return equipItem(equipBtn.dataset.equipItem)
    const unequipBtn = e.target.closest('[data-unequip]')
    if (unequipBtn) return unequipSlot(unequipBtn.dataset.unequip)
    const forgeBtn = e.target.closest('[data-forge]')
    if (forgeBtn) return forgeItem(forgeBtn.dataset.forge)
    const sellBtn = e.target.closest('[data-sell-item]')
    if (sellBtn) return sellItem(sellBtn.dataset.sellItem)
    const buyBtn = e.target.closest('[data-buy-item]')
    if (buyBtn) return buyItem(buyBtn.dataset.buyItem)
    const exchangeBtn = e.target.closest('[data-exchange]')
    if (exchangeBtn) {
      const input = $('exchangeAmount')
      const amt = Math.max(0, Math.floor(Number(input && input.value) || 0))
      return exchangeCurrency(amt)
    }
    const feBtn = e.target.closest('[data-field-enter]')
    if (feBtn) return fieldEnter(feBtn.dataset.fieldEnter)
    const locBtn = e.target.closest('[data-location]')
    if (locBtn) return enterLocation(locBtn.dataset.location)
    const backBtn = e.target.closest('[data-back-location]')
    if (backBtn) return backToLocations()
    const challengeBtn = e.target.closest('[data-monster]')
    if (challengeBtn) {
      const loc = LOCATIONS.find((l) => l.id === state.selectedLocation)
      const mon = loc && loc.monsters.find((m) => m.id === challengeBtn.dataset.monster)
      if (mon) startBattle(mon)
      return
    }
    const atkBtn = e.target.closest('[data-attack]')
    if (atkBtn) return attackMonster()
    const fleeBtn = e.target.closest('[data-flee]')
    if (fleeBtn) return fleeBattle()
    const sectEl = e.target.closest('[data-sect]')
    if (sectEl) return joinSect(sectEl.dataset.sect)
    const bagSlot = e.target.closest('[data-bag-slot]')
    if (bagSlot) { state.bagSlot = bagSlot.dataset.bagSlot; renderInfo(); if (bagOpen()) renderBagPanel(true); return }
    const bagTab = e.target.closest('[data-bag-tab]')
    if (bagTab) { state.bagTab = bagTab.dataset.bagTab; renderInfo(); if (bagOpen()) renderBagPanel(true); return }
    const sectTab = e.target.closest('[data-sect-tab]')
    if (sectTab) { state.sectTab = sectTab.dataset.sectTab; return renderInfo() }
    if (e.target.closest('[data-sect-leave]')) return leaveSect()
    const qAccept = e.target.closest('[data-quest-accept]')
    if (qAccept) return acceptQuest(qAccept.dataset.questAccept)
    const qDone = e.target.closest('[data-quest-done]')
    if (qDone) return completeQuest(qDone.dataset.questDone)
    const qAbandon = e.target.closest('[data-quest-abandon]')
    if (qAbandon) return abandonQuest(qAbandon.dataset.questAbandon)
    const sectBuy = e.target.closest('[data-sect-buy]')
    if (sectBuy) return buySectItem(sectBuy.dataset.sectBuy)
    const sectSkill = e.target.closest('[data-sect-skill]')
    if (sectSkill) return buySectSkill(sectSkill.dataset.sectSkill)
    const hatchBtn = e.target.closest('[data-hatch]')
    if (hatchBtn) return useItem(hatchBtn.dataset.hatch)
    const feedBtn = e.target.closest('[data-pet-feed]')
    if (feedBtn) return feedPet(feedBtn.dataset.petFeed, feedBtn.dataset.feed)
    const petActBtn = e.target.closest('[data-pet-active]')
    if (petActBtn) return toggleActivePet(petActBtn.dataset.petActive)
    const petRelBtn = e.target.closest('[data-pet-release]')
    if (petRelBtn) return releasePet(petRelBtn.dataset.petRelease)
    if (e.target.closest('[data-net-list]')) return netList()
    const pv = e.target.closest('[data-pvp]')
    if (pv) return challengePlayer(pv.dataset.pvp)
    const wh = e.target.closest('[data-whisper]')
    if (wh) { const i = $('chatInput'); if (i) { i.value = `/w ${wh.dataset.whisper} `; i.focus() } return }
    if (e.target.closest('[data-boss-attack]')) return attackBoss()
  })
  $('infoBody').addEventListener('submit', (e) => {
    if (e.target.id !== 'chatForm') return
    e.preventDefault()
    const i = $('chatInput'); const v = i.value; i.value = ''
    sendChat(v)
  })
  $('skills').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-skill]')
    if (btn) castSkill(usableSkills()[Number(btn.dataset.skill)])
  })
  window.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, [contenteditable="true"]')) return
    const i = Number(e.key) - 1
    const list = usableSkills()
    if (i >= 0 && i < list.length) castSkill(list[i])
  })

  setInterval(tick, 1000)
  // 宗門任務冷卻倒數：每秒更新畫面上的剩餘時間，歸零時重繪讓按鈕恢復
  setInterval(() => {
    const els = document.querySelectorAll('[data-cd-until]')
    if (!els.length) return
    let done = false
    els.forEach((el) => { const left = Number(el.dataset.cdUntil) - srvNow(); if (left <= 0) done = true; else el.textContent = fmtCd(left) })
    if (done) refreshSect()
  }, 1000)
</script>
</body>
</html>
